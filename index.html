function saveLogEntry(){
  var id=sheetEx; if(!id)return;
  var w=parseFloat(($('#in-w').value||'').replace(',','.'));
  var r=Math.max(1,parseInt($('#in-r').value,10)||0);
  var s=Math.max(1,parseInt($('#in-s').value,10)||0);
  if(!(w>0)){toast('Enter a weight first');$('#in-w').focus();return;}
  var prevBest=bestW(id);
  var entry={id:uid(),ts:Date.now(),w:Math.round(w*100)/100,r:r,s:s};
  if(state.game){
    var am=activeMon();
    if(am){
      var vol=entry.w*entry.r*entry.s;
      var expFrom=expPctOf(am),expLv0=monLevel(am.xp);
      var gain=Math.round(vol/10*(state.session?(state.session.mode==='boss'?1:1.5):1)*(state.session&&state.session.lucky?2:1));
      if(gain>0){
        entry.xpg=gain;entry.mon=am.uid;
        if(state.session)state.session.xpg=(state.session.xpg||0)+gain;
        applyXP(am,gain);
      }
      if(state.session&&state.session.mode==='boss'&&state.game.boss){
        resolveBossSet(am,entry,vol,id);
      }
      else if(state.session&&state.session.mode==='train'&&state.session.wild&&state.session.blackout){
        state.session.bmsg=DEX[am.sp].n+' keeps training! +'+(entry.xpg||0)+' XP. (Blacked out — no battles this workout.)';
        pendingSteps={ov:null,list:[{msg:state.session.bmsg}]};
      }
      else if(state.session&&state.session.mode==='train'&&state.session.wild){
        if(!state.session.party)initBossSession();
        var wd=state.session.wild;
        var stT=statsFor(am);
        var wCrit=Math.random()<Math.min(0.25,stT.spe/400);
        var dmgT=Math.round(vol*(1+Math.max(stT.atk,stT.spa)/250)*(wCrit?1.5:1));
        var wPre={sp:wd.sp,lv:wd.lv,hp:Math.max(0,wd.hp),max:wd.max,shiny:wd.shiny,tr:wd.tr};
        var wFrom=Math.round(wPre.hp/wd.max*100);
        wd.hp-=dmgT;
        var wTo=Math.round(Math.max(0,wd.hp)/wd.max*100);
        var wKm=knownMoves(am);
        var wMv=wKm[Math.floor(Math.random()*wKm.length)];
        var wAtk=DEX[am.sp].n+' used '+wMv+'!'+(wCrit?' A critical hit!':'');
        var wSteps=[{msg:wAtk,sfx:wCrit?'superhit':'hit',lunge:'player',blink:'enemy',ehp:[wFrom,wTo],dmg:['enemy',dmgT],fx:moveTypeOf(wMv)}];
        if(wd.hp<=0){
          var wbonus=Math.round(wd.max/(wd.tr?8:10));
          state.session.xpg=(state.session.xpg||0)+wbonus;
          applyXP(am,wbonus);
          var oldN=DEX[wd.sp].n;
          state.session.wild=spawnWild();
          var newN=DEX[state.session.wild.sp].n;
          if(wd.tr){
            // trainer beaten — payout, like the games
            addMoney(wd.tr.purse);
            state.session.bmsg=wd.tr.clsN+' '+wd.tr.name+' was defeated! Won ₽'+wd.tr.purse+'! +'+wbonus+' XP! A wild '+newN+' appeared!';
            wSteps.push({msg:'Foe '+oldN+' is unable to battle! +'+wbonus+' XP!',sfx:'faint',faint:'enemy',hold:1100});
            wSteps.push({msg:wd.tr.clsN+' '+wd.tr.name+' was defeated! Won ₽'+wd.tr.purse+'!',sfx:'badge',hold:1300});
            wSteps.push({msg:'A wild '+newN+' appeared!',sfx:'battlestart',refresh:true,slide:'enemy'});
          }else{
            state.session.bmsg='Wild '+oldN+' fainted! +'+wbonus+' XP! A wild '+newN+' appeared!';
            wSteps.push({msg:'Wild '+oldN+' fainted! +'+wbonus+' XP!',sfx:'faint',faint:'enemy',hold:1100});
            wSteps.push({msg:'A wild '+newN+' appeared!',sfx:'battlestart',refresh:true,slide:'enemy'});
            // sometimes a route trainer ambushes you (optional fight, pays ₽)
            if(Math.random()<0.25){
              pendingAmbush=rollAmbush();
              (function(pa){
                setTimeout(function(){
                  queueModal(function(){
                    sfx('battlestart');
                    showModal('<div style="text-align:center;padding-bottom:4px"><img src="sprites/trainers/'+pa.cls+'.png" alt="" style="width:64px;height:64px;image-rendering:pixelated"></div>'+
                      '<h3>'+pa.clsN+' '+pa.name+' wants to battle!</h3>'+
                      '<p>Their '+DEX[pa.sp].n+' :L'+pa.lv+' blocks the path. Beat it for ₽'+pa.purse+'!</p>'+
                      '<div class="mbtns"><button class="btn" data-action="close-modal">IGNORE</button>'+
                      '<button class="btn acc" data-action="ambush-yes">BATTLE</button></div>');
                    modalOk=null;
                  });
                },2700);
              })(pendingAmbush);
            }
          }
        }else{
          state.session.bmsg=wAtk+' '+dmgT.toLocaleString()+' dmg.';
          var wct=applyWildCounter(wd,am);
          wSteps.push({msg:wct.msg,sfx:'hit',lunge:'enemy',blink:'player',php:wct.php,dmg:['player',wct.dmg],quake:true});
          if(wct.fainted){
            wSteps.push({msg:wct.faintMsg,sfx:'faint',faint:'player',hold:1100});
            if(wct.goMsg)wSteps.push({msg:wct.goMsg,sfx:'battlestart',refresh:true,slide:'player'});
            else wSteps.push({msg:'Your whole team fainted! You blacked out…',refresh:true,hold:1400});
          }else{
            wSteps.push({refresh:true,hold:0});
          }
        }
        pendingSteps={ov:{wild:wPre,lead:am},list:wSteps};
      }
      // a new record feeds the lead a Rare Candy: jump to the next level (+PR bonus ₽)
      if(entry.w>prevBest&&prevBest>0){
        sfx('pr');
        addMoney(300);
        var clv=monLevel(am.xp);
        if(clv<100&&am.xp<xpFloor(clv+1)){
          am.xp=xpFloor(clv+1);
          queueLevelUp(am,clv,clv+1);
        }
      }
      else if(!(state.session&&state.game)){sfx('save');}
      // hand the XP fill to the battle playback (wraps through 100 on level-up)
      if(pendingSteps)pendingSteps.exp={from:expFrom,to:expPctOf(am),wrap:monLevel(am.xp)>expLv0};
      if(state.game.egg){
        state.game.egg.left-=entry.s;
        if(state.game.egg.left<=0){
          var HATCH=['pidgey','pikachu','machop','geodude','abra','growlithe','gastly','magikarp','dratini','eevee','rattata','oddish','poliwag','ponyta','magnemite','voltorb','clefairy','jigglypuff','diglett','mankey'];
          var hsp=HATCH[Math.floor(Math.random()*HATCH.length)];
          var hshiny=Math.random()<0.2;
          state.game.egg=null;
          addMon(hsp,hshiny);
          queueModal(function(){
            sfx('evolve');
            showModal('<h3>Oh?</h3><p>The EGG is hatching!</p>'+
              '<div style="text-align:center;padding:8px 0"><span class="evoflash" style="display:inline-block">'+eggSVG(56)+'</span></div>'+
              '<div class="mbtns"><button class="btn acc" data-action="modal-ok">. . .</button></div>',true);
            modalOk=function(){
              closeModal();
              queueModal(function(){
                sfx('catch');
                if(hshiny)setTimeout(function(){sfx('shiny');},600);
                showModal('<h3>'+DEX[hsp].n+' hatched from the EGG!</h3>'+(hshiny?'<p>✨ It’s SHINY!</p>':'')+
                  '<div style="text-align:center;padding:8px 0"><img class="bigspr'+(hshiny?' shinyglow':'')+'" src="'+sprPath(hsp,hshiny)+'" alt=""></div>'+
                  '<div class="mbtns"><button class="btn acc" data-action="modal-ok">OK</button></div>',true);
                modalOk=function(){closeModal();render(true);};
              });
            };
          });
        }
      }
    }
  }
  (state.logs[id]=state.logs[id]||[]).push(entry);
  state.logs[id].sort(function(a,b){return a.ts-b.ts;});
  save();
  refreshSheetData(id);
  toast(entry.w>prevBest&&prevBest>0?('New record — '+fmtW(entry.w)+' '+state.unit+'! 🎉 RARE CANDY!'):'Logged ✓'+(entry.xpg?' +'+entry.xpg+' XP':''));
  if(state.game)checkGameEvents();
}
function delLogEntry(logId){
  var id=sheetEx; if(!id)return;
  var arr=state.logs[id]||[];
  var i=arr.findIndex(function(l){return l.id===logId;});
  if(i<0)return;
  var gone=arr.splice(i,1)[0];
  if(!arr.length)delete state.logs[id];
  if(gone.xpg&&gone.mon&&state.game){
    var dm=findMon(gone.mon);
    if(dm)dm.xp=Math.max(0,dm.xp-gone.xpg);
    if(state.session&&state.session.xpg)state.session.xpg=Math.max(0,state.session.xpg-gone.xpg);
  }
  if(gone.dmg!==undefined&&state.game&&state.game.boss&&state.game.boss.idx===gone.bidx){
    state.game.boss.hp=Math.min(hpFor(gone.bidx,state.game.round||1),state.game.boss.hp+gone.dmg);
  }
  save();
  refreshSheetData(id);
  toast('Entry deleted',{action:'Undo',fn:function(){
    (state.logs[id]=state.logs[id]||[]).push(gone);
    state.logs[id].sort(function(a,b){return a.ts-b.ts;});
    if(gone.xpg&&gone.mon&&state.game){
      var um=findMon(gone.mon);
      if(um)um.xp+=gone.xpg;
      if(state.session)state.session.xpg=(state.session.xpg||0)+gone.xpg;
    }
    if(gone.dmg!==undefined&&state.game&&state.game.boss&&state.game.boss.idx===gone.bidx){
      state.game.boss.hp=Math.max(1,state.game.boss.hp-gone.dmg);
    }
    save();
    refreshSheetData(id);
  }});
}

/* ===== rest timer ===== */
var timerInt=null, timerEnd=0, timerBtnEl=null, timerLbl='', audioCtx=null;
function stopTimer(){
  if(timerInt){clearInterval(timerInt);timerInt=null;}
  if(timerBtnEl){timerBtnEl.classList.remove('on');timerBtnEl.textContent=timerLbl;timerBtnEl=null;}
}
function startTimer(sec,btn){
  if(timerBtnEl===btn){stopTimer();return;}
  stopTimer();
  timerBtnEl=btn; timerLbl=btn.textContent;
  timerEnd=Date.now()+sec*1000;
  btn.classList.add('on');
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended')audioCtx.resume();
  }catch(e){}
  function tick(){
    var left=Math.ceil((timerEnd-Date.now())/1000);
    if(left<=0){
      stopTimer();
      toast('Rest over — next set 💪');
      beep();
      if(navigator.vibrate)navigator.vibrate(200);
      return;
    }
    if(timerBtnEl)timerBtnEl.textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');
  }
  tick();
  timerInt=setInterval(tick,250);
}
function beep(){
  try{
    if(!audioCtx)return;
    var t0=audioCtx.currentTime;
    [0,0.22].forEach(function(off){
      var o=audioCtx.createOscillator(), g=audioCtx.createGain();
      o.frequency.value=880;o.connect(g);g.connect(audioCtx.destination);
      g.gain.setValueAtTime(0.001,t0+off);
      g.gain.exponentialRampToValueAtTime(0.25,t0+off+0.02);
      g.gain.exponentialRampToValueAtTime(0.001,t0+off+0.18);
      o.start(t0+off);o.stop(t0+off+0.2);
    });
  }catch(e){}
}

  opts=opts||{};
  var t=$('#toast');
  t.innerHTML=esc(msg)+(opts.action?' <button id="toastact">'+esc(opts.action)+'</button>':'');
  if(opts.action)$('#toastact').onclick=function(){opts.fn();t.classList.remove('show');};
  t.classList.add('show');
  clearTimeout(toastTimer);

}

/* ===== data management ===== */
function applyImport(txt){
  var d=JSON.parse(txt);
  if(!d||!Array.isArray(d.groups))throw new Error('bad');
  var logs=(d.logs&&typeof d.logs==='object')?d.logs:{};
  var ng=d.groups.map(function(g){return {
    id:g.id||uid(),
    name:String(g.name||'Group').slice(0,40),
    exercises:Array.isArray(g.exercises)?g.exercises.map(function(e){return {
      id:e.id||uid(),
      name:String(e.name||'Exercise').slice(0,40),
      note:typeof e.note==='string'?e.note.slice(0,500):''
    };}):[]
  };});
  var nl={};
  ng.forEach(function(g){g.exercises.forEach(function(e){
    var arr=Array.isArray(logs[e.id])?logs[e.id]:[];
    var c=arr.filter(function(l){return l&&isFinite(l.w)&&isFinite(l.ts);})
      .map(function(l){return {id:l.id||uid(),ts:+l.ts,w:+l.w,r:Math.max(1,parseInt(l.r,10)||1),s:Math.max(1,parseInt(l.s,10)||1)};})
      .sort(function(a,b){return a.ts-b.ts;});
    if(c.length)nl[e.id]=c;
  });});
  var ns=Array.isArray(d.sessions)?d.sessions
    .filter(function(s){return s&&isFinite(s.start)&&isFinite(s.end)&&+s.end>+s.start;})
    .map(function(s){return {id:s.id||uid(),start:+s.start,end:+s.end,
      sets:Math.max(0,parseInt(s.sets,10)||0),volume:Math.max(0,Math.round(+s.volume)||0),
      exercises:Math.max(0,parseInt(s.exercises,10)||0)};})
    .sort(function(a,b){return a.start-b.start;}):[];
  var gm=null;
  if(d.game&&Array.isArray(d.game.mons)){
    gm={startTs:+d.game.startTs||Date.now(),
      starter:d.game.starter==='squirtle'?'squirtle':'charmander',
      mons:d.game.mons.filter(function(m){return m&&DEX[m.sp];}).map(function(m){
        var nm={uid:m.uid||uid(),sp:m.sp,xp:Math.max(0,Math.round(+m.xp)||0),shiny:!!m.shiny,ts:+m.ts||Date.now()};
        if(m.vits&&typeof m.vits==='object'){
          var vt={};
          ['hp','atk','def','spa','spd','spe'].forEach(function(k){
            var n=parseInt(m.vits[k],10);
            if(n>0)vt[k]=Math.min(5,n);
          });
          if(Object.keys(vt).length)nm.vits=vt;
        }
        return nm;
      }),
      active:typeof d.game.active==='string'?d.game.active:null,
      enc:(d.game.enc&&typeof d.game.enc==='object')?d.game.enc:{},
      flags:(d.game.flags&&typeof d.game.flags==='object')?d.game.flags:{},
      seen:(d.game.seen&&typeof d.game.seen==='object')?d.game.seen:{},
      dex:(d.game.dex&&typeof d.game.dex==='object')?d.game.dex:{}};
    gm.round=Math.max(1,parseInt(d.game.round,10)||1);
    gm.boss=null;
    var bi=(d.game.boss&&isFinite(d.game.boss.idx)&&BOSSES[+d.game.boss.idx])?+d.game.boss.idx:0;
    var bmax=hpFor(bi,gm.round);
    var bh=(d.game.boss&&isFinite(d.game.boss.hp))?Math.min(bmax,Math.max(1,Math.round(+d.game.boss.hp))):bmax;
    if(!gm.flags.champion||d.game.boss){
      gm.boss={idx:bi,hp:bh};
    }else{
      gm.round=Math.max(2,gm.round);
      gm.boss={idx:0,hp:hpFor(0,gm.round)};
    }
    gm.player=(d.game.player&&typeof d.game.player.name==='string')?
      {name:String(d.game.player.name).slice(0,10),spr:d.game.player.spr==='leaf'?'leaf':'red'}:null;
    gm.egg=(d.game.egg&&isFinite(d.game.egg.left)&&+d.game.egg.left>0)?{left:Math.round(+d.game.egg.left)}:null;
    gm.money=Math.max(0,Math.round(+d.game.money)||0);
    gm.bag={};
    if(d.game.bag&&typeof d.game.bag==='object'){
      Object.keys(d.game.bag).forEach(function(bk){
        if(!ITEMS[bk])return;
        var bc=parseInt(d.game.bag[bk],10);
        if(bc>0)gm.bag[bk]=Math.min(99,bc);
      });
    }
    gm.hof=Array.isArray(d.game.hof)?d.game.hof.filter(function(e){return e&&isFinite(e.ts)&&Array.isArray(e.team);})
      .map(function(e){return {ts:+e.ts,round:Math.max(1,parseInt(e.round,10)||1),
        team:e.team.filter(function(t){return t&&DEX[t.sp];})
          .map(function(t){return {sp:t.sp,lv:Math.max(1,Math.min(100,parseInt(t.lv,10)||1)),shiny:!!t.shiny};})};}):[];
    gm.partyIds=Array.isArray(d.game.partyIds)?d.game.partyIds.filter(function(x){return typeof x==='string';}).slice(0,6):null;
    if(gm.partyIds&&!gm.partyIds.length)gm.partyIds=null;
    gm.medals={};
    if(d.game.medals&&typeof d.game.medals==='object'){
      MEDAL_ORDER.forEach(function(t){if(d.game.medals[t])gm.medals[t]=1;});
    }
    gm.hurt={};
    if(d.game.hurt&&typeof d.game.hurt==='object'){
      gm.mons.forEach(function(m){
        var hv=parseInt(d.game.hurt[m.uid],10);
        if(hv>=0&&isFinite(hv))gm.hurt[m.uid]=hv;
      });
    }
  }
  state={version:+d.version||1,unit:d.unit==='lb'?'lb':'kg',groups:ng,logs:nl,sessions:ns,session:null,theme:d.theme==='day'?'day':'night',game:gm,gamePlayed:(d.gamePlayed||gm)?1:0,sound:d.sound!==false};
  save();
  editMode=false;tab='workout';render();
}
function exportData(){
  var json=JSON.stringify(state,null,2);
  var name='gym-backup-'+dateKey(Date.now())+'.json';
  try{
    var file=new File([json],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})&&navigator.share){
      navigator.share({files:[file],title:'Gym Tracker backup'}).catch(function(){});
      return;
    }
  }catch(e){}
  var a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([json],{type:'application/json'}));
  a.download=name;
  document.body.appendChild(a);a.click();a.remove();
  toast('Backup downloaded');
}
function copyData(){
  var json=JSON.stringify(state);
  function fallback(){
    var ta=document.createElement('textarea');
    ta.value=json;document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');toast('Copied — paste it somewhere safe');}
    catch(e){toast('⚠️ Copy failed — use Export instead');}
    ta.remove();
  }
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(json).then(function(){toast('Copied — paste it somewhere safe');},fallback);
  }else fallback();
}

/* ===== edit operations ===== */
function logCount(g){return g.exercises.reduce(function(n,e){return n+logsOf(e.id).length;},0);}

/* ===== event delegation ===== */
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-action]');
  if(!b)return;
  var a=b.dataset.action;
  if(!titlePlayed){titlePlayed=true;sfx('title');}
  else sfx('click');

  if(a==='tab'){tab=b.dataset.tab;editMode=false;render();}
  else if(a==='toggle-edit'){editMode=!editMode;render(true);}
  else if(a==='open'){openSheet(b.dataset.ex);}
  else if(a==='close-sheet'){closeSheet();}
  else if(a==='step'){stepInput(b.dataset.t,+b.dataset.d);}
  else if(a==='log'){saveLogEntry();}
  else if(a==='del-log'){delLogEntry(b.dataset.log);}
  else if(a==='del-session'){
    var sid=b.dataset.s;
    var ses=(state.sessions||[]).filter(function(x){return x.id===sid;})[0];
    if(!ses)return;
    var n=0;
    Object.keys(state.logs).forEach(function(k){
      n+=state.logs[k].filter(function(l){return l.ts>=ses.start&&l.ts<=ses.end;}).length;
    });
    confirmModal('Delete this workout?',
      fmtDayKey(dateKey(ses.end))+' · '+fmtDur(ses.end-ses.start)+' · '+ses.sets+' sets. '+
      (n?('Its '+n+' logged entr'+(n===1?'y':'ies')+' will be deleted too.'):'No logged entries belong to it.'),
      'Delete',function(){
      Object.keys(state.logs).forEach(function(k){
        state.logs[k].forEach(function(l){
          if(l.ts>=ses.start&&l.ts<=ses.end&&l.xpg&&l.mon&&state.game){
            var dm=findMon(l.mon);
            if(dm)dm.xp=Math.max(0,dm.xp-l.xpg);
          }
          if(l.ts>=ses.start&&l.ts<=ses.end&&l.dmg&&state.game&&state.game.boss&&state.game.boss.idx===l.bidx){
            state.game.boss.hp=Math.min(hpFor(l.bidx,state.game.round||1),state.game.boss.hp+l.dmg);
          }
        });
        state.logs[k]=state.logs[k].filter(function(l){return l.ts<ses.start||l.ts>ses.end;});
        if(!state.logs[k].length)delete state.logs[k];
      });
      state.sessions=state.sessions.filter(function(x){return x.id!==sid;});
      save();render(true);toast('Workout deleted');
    });
  }
  else if(a==='timer'){startTimer(+b.dataset.sec,b);}
  else if(a==='dismiss-banner'){localStorage.setItem('gym.bannerOff','1');render(true);}
  else if(a==='close-modal'){closeModal();}
  else if(a==='modal-ok'){if(modalOk)modalOk();}
  else if(a==='unit'){state.unit=b.dataset.u==='lb'?'lb':'kg';save();render(true);}
  else if(a==='theme'){state.theme=b.dataset.th==='day'?'day':'night';save();applyTheme();render(true);}
  else if(a==='start-workout'){if(state.game)showChooserThenStart('train');else startWorkout('train');}
  else if(a==='end-workout'){endWorkout();}
  else if(a==='team-view'){teamView=b.dataset.v==='dex'?'dex':'party';render(true);}
  else if(a==='open-mon'){openMon(b.dataset.m);}
  else if(a==='close-mon'){closeMon();}
  else if(a==='make-lead'){
    if(state.game&&findMon(b.dataset.m)){
      state.game.active=b.dataset.m;save();closeMon();toast('New lead ✓');
    }
  }
  else if(a==='choose-mon'){
    if(state.game&&findMon(b.dataset.m)){
      state.game.active=b.dataset.m;save();closeModal();startWorkout(pendingMode);
    }
  }
  else if(a==='pre-lead'){
    if(state.game&&findMon(b.dataset.m)){state.game.active=b.dataset.m;save();showBossPartyModal();}
  }
  else if(a==='party-go'){closeModal();startWorkout('boss');}
  else if(a==='switch-mon'){if(state.session&&!state.session.blackout)showSwitchModal();}
  else if(a==='do-switch'){
    var swm=findMon(b.dataset.m);
    if(swm&&state.session&&curHpOf(swm)>0){
      state.session.lead=swm.uid;state.game.active=swm.uid;
      state.session.bmsg=playerName()+' sent out '+DEX[swm.sp].n+'!';
      save();closeModal();updateBattlePanel();render(true);
    }
  }
  else if(a==='stadium-go'){closeModal();showChooserThenStart('boss');}
  else if(a==='bld'){
    var bid=b.dataset.b;
    if(bid==='train'){if(state.session){tab='workout';render();}else showChooserThenStart('train');}
    else if(bid==='boss'){if(state.session){tab='workout';render();}else showStadiumModal();}
    else if(bid==='mart'){
      if(state.game)showMartModal();
      else toast('Meet PROF. OAK first!');
    }
  }
  else if(a==='use-xatk'){
    if(state.session&&state.session.mode==='boss'&&!state.session.xatkUsed&&!state.session.xatkArmed){
      state.session.xatkArmed=true;
      state.session.bmsg=playerName()+' used X ATTACK! The next set hits 50% harder!';
      save();sfx('pr');updateBattlePanel();
    }
  }
  else if(a==='use-xatk-item'){
    if(state.session&&state.session.mode==='boss'&&!state.session.xatkArmed&&(bagOf().xattack||0)>0){
      bagOf().xattack--;
      state.session.xatkArmed=true;
      state.session.bmsg=playerName()+' used an X ATTACK from the bag! The next set hits 50% harder!';
      save();sfx('pr');updateBattlePanel();
    }
  }
  else if(a==='battle-bag'){showBattleBag();}
  else if(a==='pick-move'){showMoveModal();}
  else if(a==='set-move'){
    var smLead=leadMon();
    if(smLead&&state.session&&knownMoves(smLead).indexOf(b.dataset.mv)>=0){
      state.session.moveSel=state.session.moveSel||{};
      state.session.moveSel[smLead.uid]=b.dataset.mv;
      save();closeModal();updateBattlePanel();
    }
  }
  else if(a==='use-potion'){
    var pk=b.dataset.it,pit=ITEMS[pk],plead=leadMon();
    if(pit&&plead&&state.session&&(bagOf()[pk]||0)>0&&curHpOf(plead)>0){
      bagOf()[pk]--;
      state.session.phps[plead.uid]=Math.min(maxHpOf(plead),curHpOf(plead)+pit.heal);
      state.session.bmsg=DEX[plead.sp].n+' was healed with a '+pit.n+'!';
      sfx('save');save();closeModal();updateBattlePanel();
    }
  }
  else if(a==='use-revive'){
    var rvm=findMon(b.dataset.m);
    if(rvm&&state.session&&(bagOf().revive||0)>0&&curHpOf(rvm)<=0){
      bagOf().revive--;
      state.session.phps[rvm.uid]=Math.ceil(maxHpOf(rvm)/2);
      state.session.bmsg=DEX[rvm.sp].n+' was revived!';
      sfx('levelup');save();closeModal();updateBattlePanel();
    }
  }
  else if(a==='buy-item'){
    var bik=b.dataset.it,bit=ITEMS[bik];
    if(bit&&state.game&&(bit.t||0)<=townIdx()&&money()>=bit.p){
      state.game.money-=bit.p;
      bagOf()[bik]=(bagOf()[bik]||0)+1;
      sfx('save');save();
      showMartModal();
      toast('Bought '+bit.n+'!');
    }
  }
  else if(a==='throw-ball'){
    var tgk=b.dataset.gk,tbk=b.dataset.ball,tenc=state.game&&state.game.enc[tgk];
    if(tenc&&ITEMS[tbk]&&(bagOf()[tbk]||0)>0){
      bagOf()[tbk]--;
      tenc.bonus=(tenc.bonus||0)+Math.round(tenc.target*ITEMS[tbk].ball);
      sfx('hit');save();
      checkGameEvents();
      render(true);
    }
  }
  else if(a==='ambush-yes'){
    if(state.session&&state.session.mode==='train'&&pendingAmbush){
      state.session.wild={sp:pendingAmbush.sp,lv:pendingAmbush.lv,hp:pendingAmbush.hp,max:pendingAmbush.hp,shiny:false,
        tr:{cls:pendingAmbush.cls,clsN:pendingAmbush.clsN,name:pendingAmbush.name,purse:pendingAmbush.purse}};
      state.session.bmsg=pendingAmbush.clsN+' '+pendingAmbush.name+' sent out '+DEX[pendingAmbush.sp].n+'!';
      pendingAmbush=null;
      save();closeModal();updateBattlePanel();render(true);
    }else closeModal();
  }
  else if(a==='show-hof'){showHofModal();}
  else if(a==='show-medal'){showMedalModal(b.dataset.t);}
  else if(a==='pokecenter'){
    if(!state.game)return;
    if(state.session){toast('Finish your workout first!');}
    else{
      var anyH=false;
      state.game.mons.forEach(function(m){if(curHpOf(m)<maxHpOf(m))anyH=true;});
      if(!anyH){toast('Your team is already fighting fit!');}
      else{
        state.game.hurt={};
        save();sfx('levelup');
        showModal('<div style="text-align:center;padding-bottom:4px"><img src="'+itemIcon('potion')+'" alt="" style="width:40px;height:40px;image-rendering:pixelated"></div>'+
          '<h3>POKéMON CENTER</h3><p>Welcome! …There. Your POKéMON are fully healed. Come back anytime!</p>'+
          '<div class="mbtns"><button class="btn acc" data-action="close-modal">THANKS</button></div>');
        modalOk=null;
        render(true);
      }
    }
  }
  else if(a==='edit-party'){pendingParty=null;showPartyManager();}
  else if(a==='pm-toggle'){
    if(pendingParty){
      var pmi=pendingParty.indexOf(b.dataset.m);
      if(pmi>=0)pendingParty.splice(pmi,1);
      else if(pendingParty.length<6)pendingParty.push(b.dataset.m);
      else{toast('Party is full — six max!');return;}
      showPartyManager();
    }
  }
  else if(a==='pm-auto'){
    if(state.game){state.game.partyIds=null;pendingParty=null;save();closeModal();toast('Auto party: your top 6 by level');render(true);}
  }
  else if(a==='pm-save'){
    if(state.game&&pendingParty&&pendingParty.length){
      state.game.partyIds=pendingParty.slice();pendingParty=null;
      save();closeModal();toast('Party order saved ✓');render(true);
    }else toast('Pick at least one POKéMON');
  }
  else if(a==='use-vitamin'){
    var vk=b.dataset.it,vit=ITEMS[vk],vm=findMon(b.dataset.m);
    if(vit&&vit.v&&vm&&(bagOf()[vk]||0)>0){
      vm.vits=vm.vits||{};
      if((vm.vits[vit.v]||0)>=5){toast('It won’t have any effect!');return;}
      bagOf()[vk]--;
      vm.vits[vit.v]=(vm.vits[vit.v]||0)+1;
      sfx('pr');save();
      openMon(vm.uid);
      toast(DEX[vm.sp].n+'’s stat rose!');
    }
  }
  else if(a==='use-candy'){
    var cm=findMon(b.dataset.m);
    if(cm&&(bagOf().rarecandy||0)>0){
      var cl=monLevel(cm.xp);
      if(cl>=100){toast('It’s already at MAX level!');return;}
      bagOf().rarecandy--;
      cm.xp=Math.max(cm.xp,xpFloor(cl+1));
      sfx('pr');save();
      queueLevelUp(cm,cl,cl+1);
      openMon(cm.uid);
    }
  }
  else if(a==='reset-game'){
    if(!state.game){toast('No adventure to reset');return;}
    confirmModal('Restart the adventure?','Your team, badges and POKéDEX are wiped and PROF. OAK greets you again. Workout data stays untouched. No retro XP this time — a true fresh start.','Restart',function(){
      state.game=null;save();
      tab='summary';render();
      setTimeout(showStarterModal,350);
    });
  }
  else if(a==='pick-starter'){
    var ssp=b.dataset.sp==='squirtle'?'squirtle':'charmander';
    var retro=state.gamePlayed?0:Math.min(Math.round(totalVolumeAll()/10),xpFloor(15));
    state.game={startTs:Date.now(),starter:ssp,mons:[],active:null,enc:{},flags:{},seen:{},dex:{},round:1,
      boss:{idx:0,hp:BOSSES[0].hp},player:{name:pendingName||'RED',spr:pendingGender||'red'},
      money:3000,bag:{},hof:[],partyIds:null,egg:null,medals:{},hurt:{}};
    state.gamePlayed=1;
    var sm=addMon(ssp,false);
    sm.xp=retro;
    state.game.active=sm.uid;
    save();
    closeModal();
    var slv=monLevel(sm.xp);
    queueModal(function(){
      showModal('<h3>'+esc(DEX[ssp].n)+' joined you!</h3><p>'+
        (retro>0?('Your past training counts: +'+retro+' XP — it’s already LV '+slv+'! '):'')+
        'Every set you log earns it XP. You pick who trains at each workout start.</p>'+
        '<div style="text-align:center;padding:8px 0"><img class="bigspr" src="'+sprPath(ssp,false)+'" alt=""></div>'+
        '<div class="mbtns"><button class="btn acc" data-action="modal-ok">LET’S GO</button></div>',true);
      modalOk=function(){closeModal();tab='team';render();checkGameEvents();};
    });
  }
  else if(a==='evo-choice'){
    var em=findMon(b.dataset.m);
    if(em&&DEX[b.dataset.to]){closeModal();doEvolve(em,b.dataset.to);}
  }
  else if(a==='pick-gender'){
    pendingGender=b.dataset.g==='leaf'?'leaf':'red';
    closeModal();
    promptModal('And your name is…?',state.game&&state.game.player?state.game.player.name:'',function(v){
      pendingName=v.toUpperCase().slice(0,10);
      afterNamePicked();
    },'OK');
  }
  else if(a==='rename-trainer'){
    if(!state.game)return;
    promptModal('Trainer name',playerName(),function(v){
      if(!state.game.player)state.game.player={name:'RED',spr:'red'};
      state.game.player.name=v.toUpperCase().slice(0,10);
      save();render(true);
    });
  }
  else if(a==='sound'){
    state.sound=b.dataset.s==='on';
    save();render(true);
    if(state.sound)sfx('save');
  }
  else if(a==='goto-edit'){tab='workout';editMode=true;render();}
  else if(a==='export'){exportData();}
  else if(a==='copy'){copyData();}
  else if(a==='import'){importModal();}
  else if(a==='reset'){
    confirmModal('Reset everything?','This permanently deletes all logged workouts and restores the default exercise list.','Delete all',function(){
      state=seedState();save();editMode=false;render();toast('Fresh start 🌱');
    });
  }
  else if(a==='add-group'){
    promptModal('New muscle group','',function(v){
      state.groups.push({id:uid(),name:v,exercises:[]});save();render(true);
    },'Add');
  }
  else if(a==='rename-group'){
    var g1=groupById(b.dataset.g);if(!g1)return;
    promptModal('Rename group',g1.name,function(v){g1.name=v;save();render(true);});
  }
  else if(a==='del-group'){
    var g2=groupById(b.dataset.g);if(!g2)return;
    confirmModal('Delete “'+g2.name+'”?',
      g2.exercises.length+' exercise(s) and '+logCount(g2)+' log entries will be deleted too.','Delete',function(){
      g2.exercises.forEach(function(ex){delete state.logs[ex.id];});
      state.groups=state.groups.filter(function(x){return x.id!==g2.id;});
      save();render(true);
    });
  }
  else if(a==='add-ex'){
    var g3=groupById(b.dataset.g);if(!g3)return;
    promptModal('New exercise in '+g3.name,'',function(v){
      g3.exercises.push({id:uid(),name:v,note:''});save();render(true);
    },'Add');
  }
  else if(a==='rename-ex'){
    var r1=exById(b.dataset.ex);if(!r1)return;
    promptModal('Rename exercise',r1.ex.name,function(v){r1.ex.name=v;save();render(true);});
  }
  else if(a==='del-ex'){
    var r2=exById(b.dataset.ex);if(!r2)return;
    var n=logsOf(r2.ex.id).length;
    confirmModal('Delete “'+r2.ex.name+'”?',
      n?('Its '+n+' log entries will be deleted too.'):'It has no logged entries.','Delete',function(){
      delete state.logs[r2.ex.id];
      r2.group.exercises=r2.group.exercises.filter(function(x){return x.id!==r2.ex.id;});
      save();render(true);
    });
  }
});

/* ===== init ===== */
// Surface unexpected errors instead of silently freezing a button press.
window.addEventListener('error',function(ev){
  try{toast('⚠️ '+String((ev&&ev.message)||'Something glitched').slice(0,90));}catch(e){}
});
var staleNote=migrateState();
applyTheme();
render();
ensureTicker();
if(staleNote)setTimeout(function(){toast(staleNote);},600);
if(!state.game)setTimeout(showGenderModal,450);
else{
  if(!state.game.player)setTimeout(showGenderModal,450);
  setTimeout(checkGameEvents,900);
}
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('./sw.js').catch(function(){});
  });
}
})();
