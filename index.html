<!doctype html>
<html lang="en" class="theme-night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym">
<meta name="description" content="Track your lifts. Offline, private, on your phone.">
<title>Gym Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<style>
@font-face{font-family:'Press Start 2P';src:url('fonts/press-start-2p.woff2') format('woff2');font-display:swap}
@font-face{font-family:'VT323';src:url('fonts/vt323.woff2') format('woff2');font-display:swap}
:root{
  --cream:#F8F8D0;
  --cream2:#EEE8B0;
  --bord:#585048;
  --frame:#405068;
  --boxw:#FFFFFF;
  --text:#303030;
  --mut:#787878;
  --red:#D03028;
  --gold:#F8B050;
  --hp:#58C868;
  --exp:#4890F8;
  --accent:#2E8B48;
  --muted:#787878;
  --radius:6px;
}
html.theme-night{--bg:#182028;--ink:#E8F0F8;--inkmut:#8898B0}
html.theme-day{--bg:#E4E8EE;--ink:#283038;--inkmut:#5A6878}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:'VT323','Courier New',monospace;
  touch-action:manipulation;overscroll-behavior-y:none}
html.lock,html.lock body{overflow:hidden}
button{-webkit-touch-callout:none;user-select:none;-webkit-user-select:none;cursor:pointer}
#view{padding:calc(env(safe-area-inset-top) + 8px) 0 130px;min-height:100vh}

/* ---------- header ---------- */
.titlebar{padding:14px 16px 0;display:flex;align-items:center;justify-content:space-between}
h1{font-family:'Press Start 2P';font-size:16px;font-weight:400;margin:0;color:var(--ink);line-height:1.5}
.subtitle{color:var(--inkmut);font-size:19px;margin:6px 16px 12px}
.textbtn{background:none;border:none;color:var(--gold);font-family:'Press Start 2P';font-size:11px;padding:10px 0 10px 16px}

/* ---------- sections & exercise cards ---------- */
.section{margin:18px 0 0}
.sechead{display:flex;align-items:center;gap:9px;padding:0 16px;margin:0 0 6px}
.dot{width:10px;height:10px;border-radius:2px;flex:none;border:2px solid rgba(0,0,0,.3)}
.sechead h2{font-family:'Press Start 2P';font-size:11px;font-weight:400;margin:0;flex:1;min-width:0;
  color:var(--ink);text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.5}
.count{color:var(--inkmut);font-size:17px}
.card{background:var(--cream);border:3px solid var(--bord);border-radius:var(--radius);
  margin:7px 12px;padding:10px 12px;display:flex;align-items:center;gap:10px;color:var(--text)}
button.card{width:calc(100% - 24px);text-align:left;font-family:inherit;color:var(--text);font-size:inherit}
button.card:active{background:var(--cream2)}
.exinfo{flex:1;min-width:0}
.exname{font-size:22px;line-height:1.05;margin-bottom:3px;text-transform:uppercase;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.exlast{font-size:17px;color:var(--mut);display:flex;align-items:center;gap:7px;flex-wrap:wrap;line-height:1.1}
.exlast b{color:var(--text);font-weight:400}
.trend{font-size:15px}
.trend.up{color:var(--accent)} .trend.down{color:var(--red)}
.gobtn{width:34px;height:34px;border-radius:4px;background:var(--boxw);border:2px solid var(--bord);flex:none;
  display:flex;align-items:center;justify-content:center;font-family:'Press Start 2P';font-size:11px;color:var(--text)}
.iconbtn{width:34px;height:34px;border-radius:4px;background:var(--boxw);border:2px solid var(--bord);color:var(--text);
  font-size:16px;flex:none;font-family:inherit;display:flex;align-items:center;justify-content:center}
.iconbtn.red{color:var(--red)}
.addcard{justify-content:center;color:var(--text);background:var(--boxw);border-style:dashed}

/* ---------- install banner ---------- */
.banner{margin:4px 12px 8px;background:var(--boxw);
  border:3px solid var(--frame);border-radius:var(--radius);padding:11px 12px;
  display:flex;align-items:center;gap:10px;color:var(--text)}
.banner .binfo{flex:1;font-size:18px;line-height:1.25}
.banner .binfo b{color:var(--red);font-weight:400}

/* ---------- bottom tab bar ---------- */
#tabbar{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));
  display:flex;gap:2px;background:var(--boxw);border:3px solid var(--frame);
  border-radius:8px;padding:4px;z-index:50}
#tabbar button{flex:1;border:none;background:none;color:var(--mut);
  font-family:'Press Start 2P';font-size:10px;padding:13px 0 11px;border-radius:4px;line-height:1}
#tabbar button.on{color:var(--red);background:var(--cream)}
#tabbar svg{display:none}

/* ---------- exercise sheet ---------- */
#sheet{position:fixed;inset:0;background:var(--bg);z-index:60;transform:translateY(102%);
  transition:transform .32s cubic-bezier(.32,.72,.3,1);overflow-y:auto;-webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;padding:calc(env(safe-area-inset-top) + 12px) 0 60px;visibility:hidden}
#sheet.open{transform:none;visibility:visible}
.sheethead{display:flex;align-items:flex-start;padding:4px 14px 2px;gap:10px}
.shtitle{flex:1;min-width:0}
.shtitle .g{font-family:'Press Start 2P';font-size:11px;text-transform:uppercase;margin-bottom:6px;line-height:1.4}
.shtitle h1{font-size:14px;text-transform:uppercase;line-height:1.5}
.shtitle .lv{font-size:19px;color:var(--inkmut);margin-top:4px}
.roundbtn{width:36px;height:36px;border-radius:4px;background:var(--boxw);border:2px solid var(--bord);color:var(--text);
  font-size:16px;font-family:inherit;flex:none}
.panel{background:var(--cream);border:3px solid var(--bord);border-radius:var(--radius);margin:12px 12px;padding:12px;color:var(--text)}
.panel h3{margin:0 0 12px;font-family:'Press Start 2P';font-size:11px;color:var(--text);font-weight:400;
  display:flex;align-items:center;justify-content:space-between;gap:8px;line-height:1.4;text-transform:uppercase}
.bestchip{background:var(--boxw);border:2px solid var(--bord);border-radius:4px;padding:4px 7px;
  font-family:'Press Start 2P';font-size:9px;color:var(--text);letter-spacing:0;text-transform:none}
.bestchip:empty{display:none}
.steprow{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.steprow label{width:62px;color:var(--mut);font-size:18px;text-transform:uppercase;flex:none}
.step{width:44px;height:44px;border-radius:4px;background:var(--boxw);border:2px solid var(--bord);color:var(--text);
  font-family:'Press Start 2P';font-size:13px;flex:none;display:flex;align-items:center;justify-content:center;line-height:1}
.step:active{background:var(--cream2)}
.steprow input{flex:1;min-width:0;background:var(--boxw);border:2px solid var(--bord);height:46px;border-radius:4px;
  color:var(--text);font-size:27px;text-align:center;font-family:inherit;outline:none}
.steprow input:focus{border-color:var(--exp)}
.savebtn{width:100%;padding:16px 8px;border-radius:4px;border:3px solid var(--bord);background:var(--boxw);color:var(--text);
  font-family:'Press Start 2P';font-size:12px;margin-top:8px;line-height:1}
.savebtn:active{background:var(--cream2)}
.timerrow{display:flex;gap:8px;margin-top:12px;align-items:center}
.timerrow .tlab{color:var(--mut);font-size:18px;text-transform:uppercase;flex:none}
.chip{flex:1;background:var(--boxw);border:2px solid var(--bord);color:var(--text);border-radius:4px;height:40px;
  font-family:inherit;font-size:20px}
.chip.on{background:var(--bord);color:var(--cream)}
.notes textarea{width:100%;background:var(--boxw);border:2px solid var(--bord);border-radius:4px;color:var(--text);
  font-family:inherit;font-size:19px;padding:9px 11px;min-height:58px;resize:vertical;outline:none}
.notes textarea:focus{border-color:var(--exp)}
.chart-empty{color:var(--mut);font-size:18px;text-align:center;padding:20px 8px;line-height:1.3}
.cl{fill:#787878;font-size:15px;font-family:'VT323'}
.cl.big{fill:#303030;font-size:17px}

/* ---------- history rows ---------- */
.histday{padding:16px 16px 4px;color:var(--inkmut);font-family:'Press Start 2P';font-size:10px;line-height:1.5}
.hrow{display:flex;align-items:center;gap:10px;background:var(--cream);border:3px solid var(--bord);
  margin:6px 12px;border-radius:var(--radius);padding:8px 12px;color:var(--text)}
.hrow .meta{flex:1;min-width:0}
.hrow .hname{font-size:20px;margin-bottom:0;display:flex;align-items:center;gap:7px;text-transform:uppercase;line-height:1.1}
.hrow .hname .dot{width:8px;height:8px}
.hrow .hsub{color:var(--mut);font-size:16px}
.hrow .w{font-size:20px;white-space:nowrap}
.hrow .w .xr{color:var(--mut);font-size:16px}
.delbtn{width:30px;height:30px;border-radius:4px;background:var(--boxw);border:2px solid var(--bord);color:var(--text);
  font-size:13px;flex:none;font-family:inherit}

/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:8px 12px}
.stat{background:var(--cream);border:3px solid var(--bord);border-radius:var(--radius);padding:10px;color:var(--text)}
.stat .v{font-size:30px;line-height:1}
.stat .l{font-size:15px;color:var(--mut);margin-top:4px;line-height:1.15}
.empty{color:var(--inkmut);text-align:center;padding:60px 30px;font-size:20px;line-height:1.4}
.empty .big{font-size:40px;margin-bottom:10px}

/* ---------- summary / workout sessions ---------- */
.hero-title{font-family:'Press Start 2P';font-size:12px;margin-bottom:8px;line-height:1.6}
.hero .lastline{color:var(--mut);font-size:18px;margin-bottom:10px;line-height:1.2}
.hero.live{background:var(--cream)}
.bigtime{font-size:48px;line-height:1;margin:8px 0 4px}
.livehead{color:var(--red);font-family:'Press Start 2P';font-size:11px;display:flex;gap:8px;align-items:center;line-height:1.5}
.pulse{width:9px;height:9px;border-radius:2px;background:var(--red);animation:pulse 1.2s ease-in-out infinite;flex:none}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}
.herobtns{display:flex;gap:8px}
.herobtns .btn{flex:1;padding:13px 6px}
.trow{display:flex;justify-content:space-between;font-size:20px;padding:2px 0}
.trow .tv{color:var(--text)}
.trow .tk{color:var(--mut);text-transform:uppercase}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 12px}
.scard{background:var(--cream);border:3px solid var(--bord);border-radius:var(--radius);padding:11px 12px;min-height:92px;color:var(--text)}
.scard .t{font-family:'Press Start 2P';font-size:11px;margin-bottom:8px;line-height:1.4;text-transform:uppercase}
.scard .v{font-size:30px;line-height:1}
.scard .u{font-size:16px;color:var(--mut)}
.wide{margin:8px 12px;background:var(--cream);border:3px solid var(--bord);border-radius:var(--radius);padding:12px;color:var(--text)}
.wide h3{margin:0 0 10px;font-family:'Press Start 2P';font-size:11px;color:var(--text);font-weight:400;line-height:1.4;text-transform:uppercase}
.hero-title,.tl-h{text-transform:uppercase}
.livebar{position:fixed;top:calc(env(safe-area-inset-top) + 8px);left:12px;right:12px;z-index:40;
  display:flex;align-items:center;gap:10px;background:var(--cream);border:3px solid var(--bord);border-radius:6px;
  padding:7px 7px 7px 12px;color:var(--text)}
.livebar .elapsed{font-family:'Press Start 2P';font-size:12px}
.livebar .lb-sets{color:var(--mut);font-size:18px;flex:1}
.btn.small{padding:9px 10px}
.lvspace{height:56px}
.todaylist{margin-top:14px;border-top:2px solid rgba(0,0,0,.15);padding-top:10px}
.tl-h{font-family:'Press Start 2P';font-size:11px;color:var(--mut);margin-bottom:6px;line-height:1.4}
.tlrow{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:20px}
.tlrow .xr{color:var(--mut);font-size:17px;flex:1}
.tlrow .delbtn{width:28px;height:28px;font-size:13px}

/* ---------- settings ---------- */
.srow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 12px;
  background:var(--cream);border:3px solid var(--bord);margin:8px 12px;border-radius:var(--radius);color:var(--text)}
.srow .lab{font-size:21px;text-transform:uppercase;line-height:1.1}
.srow .sub{font-size:16px;color:var(--mut);margin-top:2px}
.seg{display:flex;background:var(--boxw);border:2px solid var(--bord);border-radius:4px;padding:2px;flex:none}
.seg button{border:none;background:none;color:var(--mut);font-family:'Press Start 2P';font-size:10px;padding:9px 10px;
  border-radius:3px;line-height:1}
.seg button.on{background:var(--bord);color:var(--cream)}
.btn{border:2px solid var(--bord);border-radius:4px;background:var(--boxw);color:var(--text);
  font-family:'Press Start 2P';font-size:10px;padding:11px 10px;flex:none;line-height:1;text-transform:uppercase}
.btn.acc{background:var(--cream)}
.btn.danger{color:var(--red)}
.btn.dangerbg{background:var(--red);border-color:#802018;color:#FFF8F0}
.about{color:var(--inkmut);font-size:17px;text-align:center;margin:26px 20px;line-height:1.45}

/* ---------- modal ---------- */
#modalwrap{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;padding:24px}
#modalwrap.open{display:flex}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.6)}
.modal{position:relative;background:var(--frame);border-radius:8px;padding:3px;width:100%;max-width:340px}
.modal .min{background:var(--boxw);border-radius:5px;padding:16px;color:var(--text)}
.modal h3{margin:0 0 10px;font-family:'Press Start 2P';font-size:12px;font-weight:400;line-height:1.5}
.modal p{color:#606060;font-size:19px;margin:0 0 12px;line-height:1.25}
.modal input[type=text],.modal textarea{width:100%;background:var(--boxw);border:2px solid var(--bord);
  border-radius:4px;color:var(--text);font-size:21px;font-family:inherit;padding:9px 11px;outline:none}
.modal input[type=text]:focus,.modal textarea:focus{border-color:var(--exp)}
.modal textarea{resize:vertical}
.mbtns{display:flex;gap:8px;margin-top:14px}
.mbtns .btn{flex:1;padding:14px 6px}

/* ---------- toast ---------- */
#toast{position:fixed;top:calc(env(safe-area-inset-top) + 12px);left:50%;transform:translate(-50%,-16px);
  opacity:0;transition:.25s ease;z-index:90;background:var(--boxw);border:3px solid var(--frame);
  border-radius:6px;padding:9px 14px;font-size:20px;color:var(--text);line-height:1.2;
  display:flex;gap:14px;align-items:center;pointer-events:none;max-width:90vw;width:max-content}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{background:none;border:none;color:var(--red);font-family:'Press Start 2P';font-size:11px;padding:0}
</style>
</head>
<body>

<main id="view"></main>

<nav id="tabbar">
  <button data-action="tab" data-tab="summary" aria-label="Trainer">TRAINER</button>
  <button data-action="tab" data-tab="workout" aria-label="Gym">GYM</button>
  <button data-action="tab" data-tab="history" aria-label="History">HISTORY</button>
  <button data-action="tab" data-tab="settings" aria-label="Options">OPTION</button>
</nav>

<div id="sheet"></div>
<div id="modalwrap"></div>
<div id="toast"></div>

<script>
(function(){
'use strict';

/* ===== utils ===== */
var KEY='gymtracker.v1';
function $(s){return document.querySelector(s);}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
var GROUP_COLORS=['#D03028','#3878C8','#38A058','#B07818','#8040A0','#C86828'];
var DAY=86400000;
var MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var DAYSF=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

function dateKey(ts){var d=new Date(ts);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function startOfDay(ts){var d=new Date(ts);d.setHours(0,0,0,0);return d.getTime();}
function fmtDayKey(k){
  var today=dateKey(Date.now()), yest=dateKey(Date.now()-DAY);
  if(k===today)return 'Today';
  if(k===yest)return 'Yesterday';
  var p=k.split('-'), dt=new Date(+p[0],+p[1]-1,+p[2]);
  return DAYS[dt.getDay()]+', '+MONTHS[+p[1]-1]+' '+(+p[2])+((+p[0])!==new Date().getFullYear()?' '+p[0]:'');
}
function rel(ts){
  var n=Math.round((startOfDay(Date.now())-startOfDay(ts))/DAY);
  if(n<=0)return 'today';
  if(n===1)return 'yesterday';
  if(n<30)return n+'d ago';
  var d=new Date(ts);return MONTHS[d.getMonth()]+' '+d.getDate();
}
function fmtTime(ts){var d=new Date(ts);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function fmtW(w){return String(Math.round(w*100)/100);}

/* ===== state ===== */
function seedState(){
  function g(name,exs){return {id:uid(),name:name,exercises:exs.map(function(n){return {id:uid(),name:n,note:''};})};}
  return {version:2,unit:'kg',groups:[
    g('Back',['Rear delts','Lat pull down','Close grip row','Row machine']),
    g('Biceps',['Curl machine','Hammer curl']),
    g('Pecs',['Fly machine','Side delts','Machine delts','Incline bench','Converging chest press']),
    g('Triceps',['Triceps pull down','Triceps pull up','Tricep isolate']),
    g('Fore arm',['Curl','Extension']),
    g('Shoulders',[]),
    g('Legs',['Leg extension','Seated leg curl','Calf raises','Cable crunch'])
  ],logs:{},sessions:[],session:null};
}
function load(){
  try{var d=JSON.parse(localStorage.getItem(KEY));
    if(d&&Array.isArray(d.groups)&&d.logs&&typeof d.logs==='object')return d;
  }catch(e){}
  return seedState();
}
var state=load();
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(state));}
  catch(e){toast('⚠️ Could not save — storage full?');}
}
var staleNote=migrateState();
save(); // persist seed (and any migration) on first run

/* ===== model helpers ===== */
function exById(id){
  for(var i=0;i<state.groups.length;i++){
    var g=state.groups[i];
    for(var j=0;j<g.exercises.length;j++)if(g.exercises[j].id===id)return {ex:g.exercises[j],group:g,gi:i};
  }
  return null;
}
function groupById(id){for(var i=0;i<state.groups.length;i++)if(state.groups[i].id===id)return state.groups[i];return null;}
function logsOf(id){return state.logs[id]||[];}
function lastLog(id){var l=logsOf(id);return l.length?l[l.length-1]:null;}
function bestW(id){return logsOf(id).reduce(function(m,l){return Math.max(m,l.w);},0);}
function dayTops(id){
  var m={};
  logsOf(id).forEach(function(l){var k=dateKey(l.ts);if(!(k in m)||l.w>m[k])m[k]=l.w;});
  return Object.keys(m).sort().map(function(k){return {k:k,w:m[k]};});
}
function trendOf(id){var t=dayTops(id);if(t.length<2)return 0;return t[t.length-1].w-t[t.length-2].w;}

/* ===== app state ===== */
var tab='summary', editMode=false, sheetEx=null, openScrollY=0;

/* ===== render: tabs ===== */
function render(keepScroll){
  document.querySelectorAll('#tabbar button').forEach(function(b){b.classList.toggle('on',b.dataset.tab===tab);});
  var v=$('#view');
  if(tab==='summary')v.innerHTML=summaryHTML();
  else if(tab==='workout')v.innerHTML=workoutHTML();
  else if(tab==='history')v.innerHTML=historyHTML();
  else v.innerHTML=settingsHTML();
  if(!keepScroll)window.scrollTo(0,0);
}

/* ===== workout sessions ===== */
function fmtElapsed(ms){
  var s=Math.max(0,Math.floor(ms/1000));
  var m=Math.floor(s/60), sec=s%60, h=Math.floor(m/60);
  return h>0 ? h+':'+String(m%60).padStart(2,'0')+':'+String(sec).padStart(2,'0')
             : m+':'+String(sec).padStart(2,'0');
}
function fmtDur(ms){
  if(ms<60000)return Math.round(ms/1000)+'s';
  var m=Math.round(ms/60000);
  return m>=60 ? Math.floor(m/60)+'h '+(m%60)+'m' : m+'m';
}
function fmtVol(v){
  if(v>=10000)return String(Math.round(v/1000))+'k';
  if(v>=1000)return (v/1000).toFixed(1)+'k';
  return String(Math.round(v));
}
function allLogsFlat(){
  var out=[];
  state.groups.forEach(function(g){g.exercises.forEach(function(e){
    logsOf(e.id).forEach(function(l){out.push({l:l,ex:e});});
  });});
  return out;
}
function sessionStats(start,end){
  var sets=0,vol=0,exIds={};
  allLogsFlat().forEach(function(o){
    if(o.l.ts>=start&&o.l.ts<=end){sets+=o.l.s;vol+=o.l.w*o.l.r*o.l.s;exIds[o.ex.id]=1;}
  });
  return {sets:sets,volume:Math.round(vol),exercises:Object.keys(exIds).length};
}
function sessionSets(){return state.session?sessionStats(state.session.start,Date.now()).sets:0;}
function daySetsMap(){
  var m={};
  allLogsFlat().forEach(function(o){var k=dateKey(o.l.ts);m[k]=(m[k]||0)+o.l.s;});
  return m;
}
function weekStartTs(ts){
  var d0=startOfDay(ts);
  var day=(new Date(d0).getDay()+6)%7; // Monday = 0
  return d0-day*DAY;
}
var tickInt=null;
function ensureTicker(){
  if(state.session&&!tickInt)tickInt=setInterval(tickElapsed,1000);
  if(!state.session&&tickInt){clearInterval(tickInt);tickInt=null;}
}
function tickElapsed(){
  if(!state.session)return;
  var t=fmtElapsed(Date.now()-state.session.start);
  document.querySelectorAll('.elapsed').forEach(function(el){el.textContent=t;});
}
function startWorkout(){
  if(state.session)return;
  state.session={start:Date.now()};
  save();ensureTicker();
  tab='workout';editMode=false;render();
  toast('Workout started 🔥');
}
function endWorkout(){
  var ses=state.session;if(!ses)return;
  var end=Date.now();
  var st=sessionStats(ses.start,end);
  state.session=null;ensureTicker();
  if(!st.sets){save();render();toast('Workout ended — no sets logged, so nothing saved');return;}
  state.sessions=state.sessions||[];
  state.sessions.push({id:uid(),start:ses.start,end:end,sets:st.sets,volume:st.volume,exercises:st.exercises});
  save();render();
  showModal('<h3>Workout complete 💪</h3>'+
    '<p style="line-height:2.1;font-size:15px">⏱&nbsp; Duration&nbsp; <b>'+fmtDur(end-ses.start)+'</b><br>'+
    '🏋️&nbsp; Exercises&nbsp; <b>'+st.exercises+'</b><br>'+
    '📈&nbsp; Sets&nbsp; <b>'+st.sets+'</b><br>'+
    '⚖️&nbsp; Volume&nbsp; <b>'+fmtVol(st.volume)+' '+esc(state.unit)+'</b></p>'+
    '<div class="mbtns"><button class="btn acc" data-action="close-modal">Done</button></div>');
}
function applyTheme(){
  var th=state.theme==='day'?'theme-day':'theme-night';
  document.documentElement.className=th;
  var meta=document.querySelector('meta[name="theme-color"]');
  if(meta)meta.setAttribute('content',state.theme==='day'?'#E4E8EE':'#182028');
}
function migrateState(){
  var changed=false, note=null;
  if(state.theme!=='day'&&state.theme!=='night'){state.theme='night';changed=true;}
  if(!Array.isArray(state.sessions)){state.sessions=[];changed=true;}
  if(!('session' in state)||(state.session&&typeof state.session.start!=='number')){state.session=null;changed=true;}
  state.groups.forEach(function(g){g.exercises.forEach(function(e){
    if(e.name==='Dear delts'){e.name='Rear delts';changed=true;}
  });});
  // v2: add Shoulders + Legs groups to existing installs (one time)
  if(!(state.version>=2)){
    if(!state.groups.some(function(g){return /shoulder/i.test(g.name);})){
      state.groups.push({id:uid(),name:'Shoulders',exercises:[]});
    }
    var lg=null;
    state.groups.forEach(function(g){if(!lg&&/^leg/i.test(g.name))lg=g;});
    if(!lg){lg={id:uid(),name:'Legs',exercises:[]};state.groups.push(lg);}
    ['Leg extension','Seated leg curl','Calf raises','Cable crunch'].forEach(function(n){
      if(!lg.exercises.some(function(e){return e.name.toLowerCase()===n.toLowerCase();})){
        lg.exercises.push({id:uid(),name:n,note:''});
      }
    });
    state.version=2;changed=true;
  }
  // a workout left running for >6h was clearly forgotten: close it at the last logged set
  if(state.session&&Date.now()-state.session.start>6*3600000){
    var ses=state.session, limit=ses.start+6*3600000, lastTs=0;
    allLogsFlat().forEach(function(o){if(o.l.ts>=ses.start&&o.l.ts<=limit&&o.l.ts>lastTs)lastTs=o.l.ts;});
    if(lastTs>ses.start){
      var st=sessionStats(ses.start,lastTs);
      state.sessions.push({id:uid(),start:ses.start,end:lastTs,sets:st.sets,volume:st.volume,exercises:st.exercises});
      note='Your last workout was still running — saved it automatically.';
    }
    state.session=null;changed=true;
  }
  if(changed)save();
  return note;
}

function miniBarsHTML(){

  }
  var max=Math.max.apply(null,pts.map(function(p){return p.v;}).concat([1]));
  var bars='';
  pts.forEach(function(p,i){
    var x=i*19, bh=Math.max(2,Math.round(p.v/max*30)), y=34-bh;
    bars+='<rect x="'+x+'" y="'+y+'" width="13" height="'+bh+'" rx="2" fill="#4890F8" opacity="'+(p.v?1:.3)+'"/>'+
      '<text x="'+(x+6.5)+'" y="45" text-anchor="middle" style="fill:#787878;font-size:11px;font-family:VT323">'+p.lbl+'</text>';
  });

}
function weeksChartHTML(){
  var daysSet={};
  allLogsFlat().forEach(function(o){daysSet[startOfDay(o.l.ts)]=1;});
  var thisWS=weekStartTs(Date.now()), weeks=[];
  for(var i=7;i>=0;i--){
    var ws=thisWS-i*7*DAY, n=0;
    Object.keys(daysSet).forEach(function(k){var t=+k;if(t>=ws&&t<ws+7*DAY)n++;});
    weeks.push({ws:ws,n:n});
  }
  var max=Math.max.apply(null,weeks.map(function(w){return w.n;}).concat([4]));
  var W=312,H=92,bw=28,gap=10.6,bars='';
  weeks.forEach(function(w,i){
    var x=i*(bw+gap), bh=Math.max(3,Math.round(w.n/max*56)), y=72-bh;
    var cur=i===weeks.length-1;
    bars+='<rect x="'+x.toFixed(1)+'" y="'+y+'" width="'+bw+'" height="'+bh+'" rx="3" fill="'+(cur?'#E89028':'var(--accent)')+'" opacity="'+(w.n?1:.25)+'"/>';
    if(w.n)bars+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(y-5)+'" text-anchor="middle" style="fill:#606060;font-size:13px;font-family:VT323">'+w.n+'</text>';
  });
  var d0=new Date(weeks[0].ws);
  bars+='<text x="0" y="'+(H-2)+'" style="fill:#787878;font-size:13px;font-family:VT323">'+MONTHS[d0.getMonth()]+' '+d0.getDate()+'</text>'+
    '<text x="'+W+'" y="'+(H-2)+'" text-anchor="end" style="fill:#787878;font-size:13px;font-family:VT323">this week</text>';
  return '<div class="wide"><h3>Training days per week</h3>'+
    '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block" aria-hidden="true">'+bars+'</svg></div>';
}

    (state.session?'<span class="bestchip elapsed" style="margin:6px 10px 0 0;flex:none">'+fmtElapsed(Date.now()-state.session.start)+'</span>':'')+
    '<button class="roundbtn" data-action="close-sheet" aria-label="Close">✕</button></div>'+

  '<div class="panel"><h3>Log a set — today</h3>'+
    '<div class="steprow"><label>Weight</label>'+
      '<button class="step" data-action="step" data-t="w" data-d="-1">−</button>'+
      '<input id="in-w" type="text" inputmode="decimal" value="'+fmtW(w)+'" aria-label="Weight">'+
      '<button class="step" data-action="step" data-t="w" data-d="1">＋</button></div>'+
    '<div class="steprow"><label>Reps</label>'+
      '<button class="step" data-action="step" data-t="r" data-d="-1">−</button>'+
      '<input id="in-r" type="text" inputmode="numeric" value="'+r+'" aria-label="Reps">'+
      '<button class="step" data-action="step" data-t="r" data-d="1">＋</button></div>'+
    '<div class="steprow"><label>Sets</label>'+
      '<button class="step" data-action="step" data-t="s" data-d="-1">−</button>'+
      '<input id="in-s" type="text" inputmode="numeric" value="'+s+'" aria-label="Sets">'+
      '<button class="step" data-action="step" data-t="s" data-d="1">＋</button></div>'+
    '<button class="savebtn" data-action="log">SAVE SET</button>'+
    '<div class="timerrow"><span class="tlab">Rest</span>'+
      '<button class="chip" data-action="timer" data-sec="60">1:00</button>'+
      '<button class="chip" data-action="timer" data-sec="90">1:30</button>'+
      '<button class="chip" data-action="timer" data-sec="120">2:00</button></div>'+
    '<div id="sh-today">'+todayRowsHTML(ex.id)+'</div>'+
  '</div>'+

  '<div class="panel"><h3>Progress <span class="bestchip" id="sh-best"></span></h3>'+
    '<div id="sh-chart">'+chartHTML(ex.id)+'</div></div>'+

  '<div class="panel notes"><h3>Notes</h3>'+
    '<textarea id="in-note" placeholder="Seat height, grip, machine settings…">'+esc(ex.note||'')+'</textarea></div>'+

  '<div id="sh-hist">'+histListHTML(ex.id)+'</div>';
}

function histListHTML(id){
  var logs=logsOf(id).slice().sort(function(a,b){return b.ts-a.ts;});
  if(!logs.length)return '<div class="chart-empty" style="padding-bottom:30px">No history yet — your sets will show up here.</div>';
  var h='', curr='';
  logs.forEach(function(l){
    var k=dateKey(l.ts);
    if(k!==curr){curr=k;h+='<div class="histday">'+fmtDayKey(k)+'</div>';}
    h+='<div class="hrow"><div class="meta"><div class="hname">'+fmtW(l.w)+' '+state.unit+
      ' <span class="hsub" style="font-size:13px">× '+l.r+(l.s>1?' × '+l.s+' sets':'')+'</span></div></div>'+
      '<div class="hsub">'+fmtTime(l.ts)+'</div>'+
      '<button class="delbtn" data-action="del-log" data-log="'+l.id+'" aria-label="Delete entry">✕</button></div>';
  });
  return h;
}

function updateBest(id){
  var el=$('#sh-best'); if(!el)return;
  var b=bestW(id);
  el.textContent=b>0?('BEST '+fmtW(b)+state.unit):'';
}

/* ===== chart ===== */
function chartHTML(id){
  var pts=dayTops(id).slice(-12);
  if(pts.length<2)return '<div class="chart-empty">Log on two different days and your progress curve appears here 📈</div>';
  var W=336,H=150,L=34,R=12,T=20,B=22;
  var ws=pts.map(function(p){return p.w;});
  var omin=Math.min.apply(null,ws), omax=Math.max.apply(null,ws);
  var lo,hi;
  if(omin===omax){lo=omin-2;hi=omax+2;}else{var pad=(omax-omin)*0.18;lo=omin-pad;hi=omax+pad;}
  function X(i){return L+(W-L-R)*i/(pts.length-1);}
  function Y(w){return T+(H-T-B)*(1-(w-lo)/(hi-lo));}
  var line='', area='M '+X(0).toFixed(1)+' '+(H-B)+' ';
  pts.forEach(function(p,i){
    var x=X(i).toFixed(1), y=Y(p.w).toFixed(1);
    line+=(i?' ':'')+x+','+y;
    area+='L '+x+' '+y+' ';
  });
  area+='L '+X(pts.length-1).toFixed(1)+' '+(H-B)+' Z';
  var dots=pts.map(function(p,i){
    var last=i===pts.length-1;
    return '<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(p.w).toFixed(1)+'" r="'+(last?4.5:3)+'" fill="'+(last?'#D03028':'var(--accent)')+'"/>';
  }).join('');
  var lastP=pts[pts.length-1];
  var grid='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(omax).toFixed(1)+'" y2="'+Y(omax).toFixed(1)+'" stroke="rgba(255,255,255,.08)" stroke-dasharray="3 4"/>';
  if(omax!==omin)grid+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(omin).toFixed(1)+'" y2="'+Y(omin).toFixed(1)+'" stroke="rgba(255,255,255,.08)" stroke-dasharray="3 4"/>';
  var labels='<text x="2" y="'+(Y(omax)+4).toFixed(1)+'" class="cl">'+fmtW(omax)+'</text>';
  if(omax!==omin)labels+='<text x="2" y="'+(Y(omin)+4).toFixed(1)+'" class="cl">'+fmtW(omin)+'</text>';
  labels+='<text x="'+X(pts.length-1).toFixed(1)+'" y="'+(Y(lastP.w)-10).toFixed(1)+'" text-anchor="end" class="cl big">'+fmtW(lastP.w)+'</text>';
  var p0=pts[0].k.split('-'), p1=lastP.k.split('-');
  labels+='<text x="'+L+'" y="'+(H-4)+'" class="cl">'+MONTHS[+p0[1]-1]+' '+(+p0[2])+'</text>'+
    '<text x="'+(W-R)+'" y="'+(H-4)+'" text-anchor="end" class="cl">'+MONTHS[+p1[1]-1]+' '+(+p1[2])+'</text>';
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block" aria-hidden="true">'+
    '<defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1">'+
    '<stop offset="0" stop-color="var(--accent)" stop-opacity=".30"/>'+
    '<stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>'+
    grid+'<path d="'+area+'" fill="url(#cg)"/>'+
    '<polyline points="'+line+'" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>'+
    dots+labels+'</svg>';
}

/* ===== logging ===== */
function stepInput(t,d){
  var inp=$('#in-'+t); if(!inp)return;
  var v=parseFloat((inp.value||'').replace(',','.'));
  if(isNaN(v))v=(t==='w')?20:(t==='r'?10:3);
  var st=(t==='w')?(state.unit==='kg'?2.5:5):1;
  v=v+d*st;
  v=Math.max(t==='w'?0:1,Math.round(v*100)/100);
  inp.value=fmtW(v);
}
function refreshSheetData(id){
  if(sheetEx===id){
    var sh=$('#sh-hist'), sc=$('#sh-chart'), st=$('#sh-today');
    if(sh)sh.innerHTML=histListHTML(id);
    if(sc)sc.innerHTML=chartHTML(id);
    if(st)st.innerHTML=todayRowsHTML(id);
    updateBest(id);
  }else{
    render(true);
  }
}
function saveLogEntry(){
  var id=sheetEx; if(!id)return;
  var w=parseFloat(($('#in-w').value||'').replace(',','.'));
  var r=Math.max(1,parseInt($('#in-r').value,10)||0);
  var s=Math.max(1,parseInt($('#in-s').value,10)||0);
  if(!(w>0)){toast('Enter a weight first');$('#in-w').focus();return;}
  var prevBest=bestW(id);
  var entry={id:uid(),ts:Date.now(),w:Math.round(w*100)/100,r:r,s:s};
  (state.logs[id]=state.logs[id]||[]).push(entry);
  state.logs[id].sort(function(a,b){return a.ts-b.ts;});
  save();
  refreshSheetData(id);
  toast(entry.w>prevBest&&prevBest>0?('New record — '+fmtW(entry.w)+' '+state.unit+'! 🎉'):'Logged ✓');
}
function delLogEntry(logId){
  var id=sheetEx; if(!id)return;
  var arr=state.logs[id]||[];
  var i=arr.findIndex(function(l){return l.id===logId;});
  if(i<0)return;
  var gone=arr.splice(i,1)[0];
  if(!arr.length)delete state.logs[id];
  save();
  refreshSheetData(id);
  toast('Entry deleted',{action:'Undo',fn:function(){
    (state.logs[id]=state.logs[id]||[]).push(gone);
    state.logs[id].sort(function(a,b){return a.ts-b.ts;});
    save();
    refreshSheetData(id);
  }});
}

/* ===== rest timer ===== */
var timerInt=null, timerEnd=0, timerBtnEl=null, timerLbl='', audioCtx=null;
function stopTimer(){
  if(timerInt){clearInterval(timerInt);timerInt=null;}
  if(timerBtnEl){timerBtnEl.classList.remove('on');timerBtnEl.textContent=timerLbl;timerBtnEl=null;}
}
function startTimer(sec,btn){
  if(timerBtnEl===btn){stopTimer();return;}
  stopTimer();
  timerBtnEl=btn; timerLbl=btn.textContent;
  timerEnd=Date.now()+sec*1000;
  btn.classList.add('on');
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended')audioCtx.resume();
  }catch(e){}
  function tick(){
    var left=Math.ceil((timerEnd-Date.now())/1000);
    if(left<=0){
      stopTimer();
      toast('Rest over — next set 💪');
      beep();
      if(navigator.vibrate)navigator.vibrate(200);
      return;
    }
    if(timerBtnEl)timerBtnEl.textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');
  }
  tick();
  timerInt=setInterval(tick,250);
}
function beep(){
  try{
    if(!audioCtx)return;
    var t0=audioCtx.currentTime;
    [0,0.22].forEach(function(off){
      var o=audioCtx.createOscillator(), g=audioCtx.createGain();
      o.frequency.value=880;o.connect(g);g.connect(audioCtx.destination);
      g.gain.setValueAtTime(0.001,t0+off);
      g.gain.exponentialRampToValueAtTime(0.25,t0+off+0.02);
      g.gain.exponentialRampToValueAtTime(0.001,t0+off+0.18);
      o.start(t0+off);o.stop(t0+off+0.2);
    });
  }catch(e){}
}

/* ===== toast ===== */
var toastTimer=null;
function toast(msg,opts){
  opts=opts||{};
  var t=$('#toast');
  t.innerHTML=esc(msg)+(opts.action?' <button id="toastact">'+esc(opts.action)+'</button>':'');
  if(opts.action)$('#toastact').onclick=function(){opts.fn();t.classList.remove('show');};
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){t.classList.remove('show');},opts.action?4500:1800);
}

/* ===== modals ===== */
var modalOk=null;
function showModal(html){
  $('#modalwrap').innerHTML='<div class="backdrop" data-action="close-modal"></div><div class="modal"><div class="min">'+html+'</div></div>';
  $('#modalwrap').classList.add('open');
}
function closeModal(){
  $('#modalwrap').classList.remove('open');
  $('#modalwrap').innerHTML='';
  modalOk=null;
}
function promptModal(title,initial,cb,okText){
  showModal('<h3>'+esc(title)+'</h3>'+
    '<input id="m-in" type="text" value="'+esc(initial)+'" placeholder="Name" maxlength="40">'+
    '<div class="mbtns"><button class="btn" data-action="close-modal">Cancel</button>'+
    '<button class="btn acc" data-action="modal-ok">'+esc(okText||'Save')+'</button></div>');
  modalOk=function(){
    var v=$('#m-in').value.trim();
    if(!v){$('#m-in').focus();return;}
    closeModal();cb(v);
  };
  var inp=$('#m-in');
  inp.focus();inp.select();
  inp.addEventListener('keydown',function(e){if(e.key==='Enter')modalOk&&modalOk();});
}
function confirmModal(title,msg,okText,cb){
  showModal('<h3>'+esc(title)+'</h3><p>'+esc(msg)+'</p>'+
    '<div class="mbtns"><button class="btn" data-action="close-modal">Cancel</button>'+
    '<button class="btn dangerbg" data-action="modal-ok">'+esc(okText)+'</button></div>');
  modalOk=function(){closeModal();cb();};
}
function importModal(){
  showModal('<h3>Import backup</h3><p>Choose a backup file, or paste its contents below.</p>'+
    '<input type="file" id="m-file" accept=".json,application/json" style="margin-bottom:10px;font-size:13px;color:var(--muted);width:100%">'+
    '<textarea id="m-json" rows="5" placeholder=\'{"groups":[…],"logs":{…}}\'></textarea>'+
    '<div class="mbtns"><button class="btn" data-action="close-modal">Cancel</button>'+
    '<button class="btn acc" data-action="modal-ok">Import</button></div>');
  $('#m-file').addEventListener('change',function(ev){
    var f=ev.target.files[0]; if(!f)return;
    var rd=new FileReader();
    rd.onload=function(){$('#m-json').value=rd.result;};
    rd.readAsText(f);
  });
  modalOk=function(){
    var txt=$('#m-json').value.trim();
    if(!txt){toast('Nothing to import');return;}
    try{applyImport(txt);closeModal();toast('Imported ✓');}
    catch(e){toast('⚠️ Invalid backup file');}
  };
}

/* ===== data management ===== */
function applyImport(txt){
  var d=JSON.parse(txt);
  if(!d||!Array.isArray(d.groups))throw new Error('bad');
  var logs=(d.logs&&typeof d.logs==='object')?d.logs:{};
  var ng=d.groups.map(function(g){return {
    id:g.id||uid(),
    name:String(g.name||'Group').slice(0,40),
    exercises:Array.isArray(g.exercises)?g.exercises.map(function(e){return {
      id:e.id||uid(),
      name:String(e.name||'Exercise').slice(0,40),
      note:typeof e.note==='string'?e.note.slice(0,500):''
    };}):[]
  };});
  var nl={};
  ng.forEach(function(g){g.exercises.forEach(function(e){
    var arr=Array.isArray(logs[e.id])?logs[e.id]:[];
    var c=arr.filter(function(l){return l&&isFinite(l.w)&&isFinite(l.ts);})
      .map(function(l){return {id:l.id||uid(),ts:+l.ts,w:+l.w,r:Math.max(1,parseInt(l.r,10)||1),s:Math.max(1,parseInt(l.s,10)||1)};})
      .sort(function(a,b){return a.ts-b.ts;});
    if(c.length)nl[e.id]=c;
  });});
  var ns=Array.isArray(d.sessions)?d.sessions
    .filter(function(s){return s&&isFinite(s.start)&&isFinite(s.end)&&+s.end>+s.start;})
    .map(function(s){return {id:s.id||uid(),start:+s.start,end:+s.end,
      sets:Math.max(0,parseInt(s.sets,10)||0),volume:Math.max(0,Math.round(+s.volume)||0),
      exercises:Math.max(0,parseInt(s.exercises,10)||0)};})
    .sort(function(a,b){return a.start-b.start;}):[];
  state={version:+d.version||1,unit:d.unit==='lb'?'lb':'kg',groups:ng,logs:nl,sessions:ns,session:null,theme:d.theme==='day'?'day':'night'};
  save();
  editMode=false;tab='workout';render();
}
function exportData(){
  var json=JSON.stringify(state,null,2);
  var name='gym-backup-'+dateKey(Date.now())+'.json';
  try{
    var file=new File([json],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})&&navigator.share){
      navigator.share({files:[file],title:'Gym Tracker backup'}).catch(function(){});
      return;
    }
  }catch(e){}
  var a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([json],{type:'application/json'}));
  a.download=name;
  document.body.appendChild(a);a.click();a.remove();
  toast('Backup downloaded');
}
function copyData(){
  var json=JSON.stringify(state);
  function fallback(){
    var ta=document.createElement('textarea');
    ta.value=json;document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');toast('Copied — paste it somewhere safe');}
    catch(e){toast('⚠️ Copy failed — use Export instead');}
    ta.remove();
  }
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(json).then(function(){toast('Copied — paste it somewhere safe');},fallback);
  }else fallback();
}

/* ===== edit operations ===== */
function logCount(g){return g.exercises.reduce(function(n,e){return n+logsOf(e.id).length;},0);}

/* ===== event delegation ===== */
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-action]');
  if(!b)return;
  var a=b.dataset.action;

  if(a==='tab'){tab=b.dataset.tab;editMode=false;render();}
  else if(a==='toggle-edit'){editMode=!editMode;render(true);}
  else if(a==='open'){openSheet(b.dataset.ex);}
  else if(a==='close-sheet'){closeSheet();}
  else if(a==='step'){stepInput(b.dataset.t,+b.dataset.d);}
  else if(a==='log'){saveLogEntry();}
  else if(a==='del-log'){delLogEntry(b.dataset.log);}
  else if(a==='del-session'){
    var sid=b.dataset.s;
    var ses=(state.sessions||[]).filter(function(x){return x.id===sid;})[0];
    if(!ses)return;
    var n=0;
    Object.keys(state.logs).forEach(function(k){
      n+=state.logs[k].filter(function(l){return l.ts>=ses.start&&l.ts<=ses.end;}).length;
    });
    confirmModal('Delete this workout?',
      fmtDayKey(dateKey(ses.end))+' · '+fmtDur(ses.end-ses.start)+' · '+ses.sets+' sets. '+
      (n?('Its '+n+' logged entr'+(n===1?'y':'ies')+' will be deleted too.'):'No logged entries belong to it.'),
      'Delete',function(){
      Object.keys(state.logs).forEach(function(k){
        state.logs[k]=state.logs[k].filter(function(l){return l.ts<ses.start||l.ts>ses.end;});
        if(!state.logs[k].length)delete state.logs[k];
      });
      state.sessions=state.sessions.filter(function(x){return x.id!==sid;});
      save();render(true);toast('Workout deleted');
    });
  }
  else if(a==='timer'){startTimer(+b.dataset.sec,b);}
  else if(a==='dismiss-banner'){localStorage.setItem('gym.bannerOff','1');render(true);}
  else if(a==='close-modal'){closeModal();}
  else if(a==='modal-ok'){if(modalOk)modalOk();}
  else if(a==='unit'){state.unit=b.dataset.u==='lb'?'lb':'kg';save();render(true);}
  else if(a==='theme'){state.theme=b.dataset.th==='day'?'day':'night';save();applyTheme();render(true);}
  else if(a==='start-workout'){startWorkout();}
  else if(a==='end-workout'){endWorkout();}
  else if(a==='goto-edit'){tab='workout';editMode=true;render();}
  else if(a==='export'){exportData();}
  else if(a==='copy'){copyData();}
  else if(a==='import'){importModal();}
  else if(a==='reset'){
    confirmModal('Reset everything?','This permanently deletes all logged workouts and restores the default exercise list.','Delete all',function(){
      state=seedState();save();editMode=false;render();toast('Fresh start 🌱');
    });
  }
  else if(a==='add-group'){
    promptModal('New muscle group','',function(v){
      state.groups.push({id:uid(),name:v,exercises:[]});save();render(true);
    },'Add');
  }
  else if(a==='rename-group'){
    var g1=groupById(b.dataset.g);if(!g1)return;
    promptModal('Rename group',g1.name,function(v){g1.name=v;save();render(true);});
  }
  else if(a==='del-group'){
    var g2=groupById(b.dataset.g);if(!g2)return;
    confirmModal('Delete “'+g2.name+'”?',
      g2.exercises.length+' exercise(s) and '+logCount(g2)+' log entries will be deleted too.','Delete',function(){
      g2.exercises.forEach(function(ex){delete state.logs[ex.id];});
      state.groups=state.groups.filter(function(x){return x.id!==g2.id;});
      save();render(true);
    });
  }
  else if(a==='add-ex'){
    var g3=groupById(b.dataset.g);if(!g3)return;
    promptModal('New exercise in '+g3.name,'',function(v){
      g3.exercises.push({id:uid(),name:v,note:''});save();render(true);
    },'Add');
  }
  else if(a==='rename-ex'){
    var r1=exById(b.dataset.ex);if(!r1)return;
    promptModal('Rename exercise',r1.ex.name,function(v){r1.ex.name=v;save();render(true);});
  }
  else if(a==='del-ex'){
    var r2=exById(b.dataset.ex);if(!r2)return;
    var n=logsOf(r2.ex.id).length;
    confirmModal('Delete “'+r2.ex.name+'”?',
      n?('Its '+n+' log entries will be deleted too.'):'It has no logged entries.','Delete',function(){
      delete state.logs[r2.ex.id];
      r2.group.exercises=r2.group.exercises.filter(function(x){return x.id!==r2.ex.id;});
      save();render(true);
    });
  }
});

/* ===== init ===== */
applyTheme();
render();
ensureTicker();
if(staleNote)setTimeout(function(){toast(staleNote);},600);
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('./sw.js').catch(function(){});
  });
}
})();
</script>
