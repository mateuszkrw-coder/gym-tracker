<!doctype html>
<html lang="en" class="theme-night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym">
<meta name="description" content="Track your lifts. Offline, private, on your phone.">
<title>Gym Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<style>
@font-face{font-family:'Press Start 2P';src:url('fonts/press-start-2p.woff2') format('woff2');font-display:swap}
@font-face{font-family:'VT323';src:url('fonts/vt323.woff2') format('woff2');font-display:swap}
:root{
  /* Official FRLG window skin: white menu boxes, FireRed red-orange frames */
  --cream:#FFFFFF;
  --cream2:#F0E4DC;
  --bord:#C05028;
  --frame:#405068;
  --boxw:#FFFFFF;
  --text:#303030;
  --mut:#787878;
  --red:#D03028;
  --gold:#F8B050;
  --hp:#58C868;
  --exp:#4890F8;
  --accent:#2E8B48;
  --muted:#787878;
  --radius:6px;
}
html.theme-night{--bg:#141A22;--ink:#E8F0F8;--inkmut:#8898B0;
  --cream:#222B38;--cream2:#1B2330;--boxw:#2A3442;--text:#E4ECF4;--mut:#9AA8BC}
html.theme-day{--bg:#E4E8EE;--ink:#283038;--inkmut:#5A6878}
/* night: the WHOLE UI goes dark — boxes, buttons, battle databoxes, the lot */
html.theme-night .card.done{background:#26303E;border-color:#46525F}
html.theme-night #tabbar button.on{background:#4A2A1E}
html.theme-night .btn.acc{background:#4A2A1E}
html.theme-night .databox{background:rgba(26,34,46,.92)}
html.theme-night .statrow{border-bottom-color:rgba(255,255,255,.14)}
html.theme-night .todaylist{border-top-color:rgba(255,255,255,.16)}
html.theme-night .dot{border-color:rgba(255,255,255,.28)}
/* moonlight over every town (and the POKEMON CENTER floor) */
html.theme-night .mapwrap::after{content:'';position:absolute;inset:0;background:rgba(46,72,140,.22);pointer-events:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:'VT323','Courier New',monospace;
  touch-action:manipulation;overscroll-behavior-y:none}
html.lock,html.lock body{overflow:hidden}
button{-webkit-touch-callout:none;user-select:none;-webkit-user-select:none;cursor:pointer}
#view{padding:calc(env(safe-area-inset-top) + 8px) 0 130px;min-height:100vh}

/* ---------- header ---------- */
.titlebar{padding:14px 16px 0;display:flex;align-items:center;justify-content:space-between}
h1{font-family:'Press Start 2P';font-size:16px;font-weight:400;margin:0;color:var(--ink);line-height:1.5}
.subtitle{color:var(--inkmut);font-size:19px;margin:6px 16px 12px}
.textbtn{background:none;border:none;color:var(--red);font-family:'Press Start 2P';font-size:11px;padding:10px 0 10px 16px}

/* ---------- sections & exercise cards ---------- */
.section{margin:18px 0 0}
.sechead{display:flex;align-items:center;gap:9px;padding:0 16px;margin:0 0 6px}
.dot{width:10px;height:10px;border-radius:2px;flex:none;border:2px solid rgba(0,0,0,.3)}
.sechead h2{font-family:'Press Start 2P';font-size:11px;font-weight:400;margin:0;flex:1;min-width:0;
  color:var(--ink);text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.5}
.count{color:var(--inkmut);font-size:17px}
.card{background:var(--cream);border:3px solid var(--bord);border-radius:var(--radius);
  margin:7px 12px;padding:10px 12px;display:flex;align-items:center;gap:10px;color:var(--text)}
button.card{width:calc(100% - 24px);text-align:left;font-family:inherit;color:var(--text);font-size:inherit}
button.card:active{background:var(--cream2)}
.exinfo{flex:1;min-width:0}
.exname{font-size:22px;line-height:1.05;margin-bottom:3px;text-transform:uppercase;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.exlast{font-size:17px;color:var(--mut);display:flex;align-items:center;gap:7px;flex-wrap:wrap;line-height:1.1}
.exlast b{color:var(--text);font-weight:400}
.trend{font-size:15px}
.trend.up{color:var(--accent)} .trend.down{color:var(--red)}
.gobtn{width:34px;height:34px;border-radius:4px;background:var(--boxw);border:2px solid var(--bord);flex:none;
  display:flex;align-items:center;justify-content:center;font-family:'Press Start 2P';font-size:11px;color:var(--text)}
.iconbtn{width:34px;height:34px;border-radius:4px;background:var(--boxw);border:2px solid var(--bord);color:var(--text);
  font-size:16px;flex:none;font-family:inherit;display:flex;align-items:center;justify-content:center}
.iconbtn.red{color:var(--red)}
.addcard{justify-content:center;color:var(--text);background:var(--boxw);border-style:dashed}
.card.done{background:#E8E8E8;border-color:#A8A8A0}
.card.done .exname{color:#606060}
.card.done .exlast{color:#909090}
.card.done .gobtn{color:#2E8B48;background:#F8F8F8;border-color:#A8A8A0;font-size:9px}

/* ---------- install banner ---------- */
.banner{margin:4px 12px 8px;background:var(--boxw);
  border:3px solid var(--frame);border-radius:var(--radius);padding:11px 12px;
  display:flex;align-items:center;gap:10px;color:var(--text)}
.banner .binfo{flex:1;font-size:18px;line-height:1.25}
.banner .binfo b{color:var(--red);font-weight:400}

/* ---------- bottom tab bar ---------- */
#tabbar{position:fixed;left:0;right:0;bottom:0;
  display:flex;justify-content:space-evenly;gap:0;background:var(--boxw);
  border:none;border-top:3px solid var(--frame);
  border-radius:0;padding:4px 6px calc(6px + env(safe-area-inset-bottom));z-index:50}
#tabbar button{flex:none;border:none;background:none;color:var(--mut);
  font-family:'Press Start 2P';font-size:9px;padding:13px 4px 11px;border-radius:4px;line-height:1}
#view svg g[data-action]:active{opacity:.7}
.slab{font-family:'VT323';font-size:14px;fill:#14380E;paint-order:stroke;stroke:#A8E090;stroke-width:3px}
.slab.dark{fill:#D8E8C0;stroke:#1A2A1E}
.mapwrap{position:relative;margin:6px 12px;border:3px solid var(--bord);border-radius:8px;overflow:hidden;line-height:0}
/* the Kanto travel map + markers */
.mapwrap.kanto{background:#9CD3F0}
.tmark{position:absolute;transform:translate(-50%,-50%);background:none;border:none;padding:0;
  display:flex;flex-direction:column;align-items:center;cursor:pointer;z-index:2}
.tmark.lock{cursor:default}
.tmark .tdot{width:13px;height:13px;border-radius:50%;border:2px solid;display:block}
.tmark .tlbl{font-family:'Press Start 2P';font-size:7px;line-height:1;margin-top:2px;white-space:nowrap;
  color:#20303A;background:rgba(255,255,255,.82);border-radius:3px;padding:1px 2px}
.tmark:active .tdot{transform:scale(.85)}
.ldot{display:inline-block;width:10px;height:10px;border-radius:50%;border:2px solid;vertical-align:-1px;margin-right:2px}
/* a village-arrival flourish on the QUEST page: wipe down + panels rise in */
@keyframes qrev{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.qreveal{animation:qrev .5s cubic-bezier(.2,.8,.25,1)}
.qreveal .panel,.qreveal .mapwrap,.qreveal .subtitle{animation:qrev .55s cubic-bezier(.2,.8,.25,1) both}
.qreveal .mapwrap{animation-delay:.05s}
.qreveal .panel:nth-of-type(1){animation-delay:.12s}
.qreveal .panel:nth-of-type(2){animation-delay:.19s}
.qreveal .panel:nth-of-type(3){animation-delay:.26s}
.qreveal .panel:nth-of-type(n+4){animation-delay:.32s}
html.theme-night .mapwrap img{filter:brightness(.62) saturate(.85)}
.hotspot{position:absolute;background:none;border:none;display:flex;align-items:flex-end;justify-content:center;padding:0;cursor:pointer}
.npc{position:absolute;width:16px;image-rendering:pixelated;pointer-events:none;transform:translate(-50%,-100%);z-index:1}
.hotspot:active{background:rgba(255,255,255,.25)}
.maptag{font-family:'Press Start 2P';font-size:9px;background:#FFFFFF;border:2px solid #C05028;border-radius:4px;
  padding:3px 6px;color:#303030;line-height:1;margin-bottom:2px}
.mapalert{position:absolute;top:-2px;right:2px;font-family:'VT323';font-size:17px;background:#FFFFFF;
  border:2px solid #C05028;border-radius:3px;padding:0 4px;color:#D03028;line-height:1.15}
@keyframes bob{0%,100%{transform:none}50%{transform:translateY(-3px)}}
.monstrip img{animation:bob 1.6s ease-in-out infinite}
html.theme-night .maptag{background:#222A34;color:#E0E8F0;border-color:#10161E}
html.theme-night .mapalert{background:#222A34;border-color:#10161E}
.pstripbtn{background:none;border:none;padding:0;text-align:center;flex:none;font-family:inherit;color:var(--text);cursor:pointer}
#fx{position:fixed;inset:0;z-index:200;pointer-events:none;background:transparent}
#fx.go{animation:fxflash .9s steps(1) forwards}
@keyframes fxflash{0%{background:rgba(248,248,240,.95)}12%{background:transparent}24%{background:rgba(248,248,240,.95)}36%{background:transparent}48%{background:#10141A}100%{background:transparent}}
@keyframes pagein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#view.pagein{animation:pagein .22s ease-out}
@keyframes modalin{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
.modal{animation:modalin .18s ease-out}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.backdrop{animation:fadein .2s ease-out}
.dexcell:active{transform:scale(.95)}
.prow:active,.card:active{transition:transform .08s}
button.card:active,button.prow:active{transform:scale(.98)}
#tabbar button.on{color:var(--red);background:#F8DCD0}
#tabbar svg{display:none}

/* ---------- exercise sheet ---------- */
#sheet{position:fixed;inset:0;background:var(--bg);z-index:60;transform:translateY(102%);
  transition:transform .32s cubic-bezier(.32,.72,.3,1);overflow-y:auto;-webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;padding:calc(env(safe-area-inset-top) + 12px) 0 60px;visibility:hidden}
#sheet.open{transform:none;visibility:visible}
.sheethead{display:flex;align-items:flex-start;padding:4px 14px 2px;gap:10px}
.shtitle{flex:1;min-width:0}
.shtitle .g{font-family:'Press Start 2P';font-size:11px;text-transform:uppercase;margin-bottom:6px;line-height:1.4}
.shtitle h1{font-size:14px;text-transform:uppercase;line-height:1.5}
.shtitle .lv{font-size:19px;color:var(--inkmut);margin-top:4px}
.roundbtn{width:36px;height:36px;border-radius:4px;background:var(--boxw);border:2px solid var(--bord);color:var(--text);
  font-size:16px;font-family:inherit;flex:none}
.panel{background:var(--cream);border:3px solid var(--bord);border-radius:var(--radius);margin:12px 12px;padding:12px;color:var(--text)}
.panel h3{margin:0 0 12px;font-family:'Press Start 2P';font-size:11px;color:var(--text);font-weight:400;
  display:flex;align-items:center;justify-content:space-between;gap:8px;line-height:1.4;text-transform:uppercase}
.bestchip{background:var(--boxw);border:2px solid var(--bord);border-radius:4px;padding:4px 7px;
  font-family:'Press Start 2P';font-size:9px;color:var(--text);letter-spacing:0;text-transform:none}
.bestchip:empty{display:none}
.steprow{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.steprow label{width:62px;color:var(--mut);font-size:18px;text-transform:uppercase;flex:none}
.step{width:44px;height:44px;border-radius:4px;background:var(--boxw);border:2px solid var(--bord);color:var(--text);
  font-family:'Press Start 2P';font-size:13px;flex:none;display:flex;align-items:center;justify-content:center;line-height:1}
.step:active{background:var(--cream2)}
.steprow input{flex:1;min-width:0;background:var(--boxw);border:2px solid var(--bord);height:46px;border-radius:4px;
  color:var(--text);font-size:27px;text-align:center;font-family:inherit;outline:none}
.steprow input:focus{border-color:var(--exp)}
.savebtn{width:100%;padding:16px 8px;border-radius:4px;border:3px solid var(--bord);background:var(--boxw);color:var(--text);
  font-family:'Press Start 2P';font-size:12px;margin-top:8px;line-height:1}
.savebtn:active{background:var(--cream2)}
.timerrow{display:flex;gap:8px;margin-top:12px;align-items:center}
.timerrow .tlab{color:var(--mut);font-size:18px;text-transform:uppercase;flex:none}
.chip{flex:1;background:var(--boxw);border:2px solid var(--bord);color:var(--text);border-radius:4px;height:40px;
  font-family:inherit;font-size:20px}
.chip.on{background:var(--bord);color:var(--cream)}
.notes textarea{width:100%;background:var(--boxw);border:2px solid var(--bord);border-radius:4px;color:var(--text);
  font-family:inherit;font-size:19px;padding:9px 11px;min-height:58px;resize:vertical;outline:none}
.notes textarea:focus{border-color:var(--exp)}
.chart-empty{color:var(--mut);font-size:18px;text-align:center;padding:20px 8px;line-height:1.3}
.cl{fill:#787878;font-size:15px;font-family:'VT323'}
.cl.big{fill:#303030;font-size:17px}

/* ---------- history rows ---------- */
.histday{padding:16px 16px 4px;color:var(--inkmut);font-family:'Press Start 2P';font-size:10px;line-height:1.5}
.hrow{display:flex;align-items:center;gap:10px;background:var(--cream);border:3px solid var(--bord);
  margin:6px 12px;border-radius:var(--radius);padding:8px 12px;color:var(--text)}
.hrow .meta{flex:1;min-width:0}
.hrow .hname{font-size:20px;margin-bottom:0;display:flex;align-items:center;gap:7px;text-transform:uppercase;line-height:1.1}
.hrow .hname .dot{width:8px;height:8px}
.hrow .hsub{color:var(--mut);font-size:16px}
.hrow .w{font-size:20px;white-space:nowrap}
.hrow .w .xr{color:var(--mut);font-size:16px}
.delbtn{width:30px;height:30px;border-radius:4px;background:var(--boxw);border:2px solid var(--bord);color:var(--text);
  font-size:13px;flex:none;font-family:inherit}

/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:8px 12px}
.stat{background:var(--cream);border:3px solid var(--bord);border-radius:var(--radius);padding:10px;color:var(--text)}
.stat .v{font-size:30px;line-height:1}
.stat .l{font-size:15px;color:var(--mut);margin-top:4px;line-height:1.15}
.empty{color:var(--inkmut);text-align:center;padding:60px 30px;font-size:20px;line-height:1.4}
.empty .big{font-size:40px;margin-bottom:10px}

/* ---------- summary / workout sessions ---------- */
.hero-title{font-family:'Press Start 2P';font-size:12px;margin-bottom:8px;line-height:1.6}
.hero .lastline{color:var(--mut);font-size:18px;margin-bottom:10px;line-height:1.2}
.hero.live{background:var(--cream)}
.bigtime{font-size:48px;line-height:1;margin:8px 0 4px}
.livehead{color:var(--red);font-family:'Press Start 2P';font-size:11px;display:flex;gap:8px;align-items:center;line-height:1.5}
.pulse{width:9px;height:9px;border-radius:2px;background:var(--red);animation:pulse 1.2s ease-in-out infinite;flex:none}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}
.herobtns{display:flex;gap:8px}
.herobtns .btn{flex:1;padding:13px 6px}
.trow{display:flex;justify-content:space-between;font-size:20px;padding:2px 0}
.trow .tv{color:var(--text)}
.trow .tk{color:var(--mut);text-transform:uppercase}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 12px}
.scard{background:var(--cream);border:3px solid var(--bord);border-radius:var(--radius);padding:11px 12px;min-height:92px;color:var(--text)}
.scard .t{font-family:'Press Start 2P';font-size:11px;margin-bottom:8px;line-height:1.4;text-transform:uppercase}
.scard .v{font-size:30px;line-height:1}
.scard .u{font-size:16px;color:var(--mut)}
.wide{margin:8px 12px;background:var(--cream);border:3px solid var(--bord);border-radius:var(--radius);padding:12px;color:var(--text)}
.wide h3{margin:0 0 10px;font-family:'Press Start 2P';font-size:11px;color:var(--text);font-weight:400;line-height:1.4;text-transform:uppercase}
.hero-title,.tl-h{text-transform:uppercase}
.livebar{position:fixed;top:0;left:0;right:0;z-index:40;
  display:flex;align-items:center;gap:10px;background:var(--cream);border:none;border-bottom:3px solid var(--bord);border-radius:0;
  padding:calc(env(safe-area-inset-top) + 10px) 12px 9px 14px;color:var(--text)}
.livebar .elapsed{font-family:'Press Start 2P';font-size:12px}
.livebar .lb-sets{color:var(--mut);font-size:18px;flex:1}
.btn.small{padding:9px 10px}
.lvspace{height:54px}
.todaylist{margin-top:14px;border-top:2px solid rgba(0,0,0,.15);padding-top:10px}
.tl-h{font-family:'Press Start 2P';font-size:11px;color:var(--mut);margin-bottom:6px;line-height:1.4}
.tlrow{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:20px}
.tlrow .xr{color:var(--mut);font-size:17px;flex:1}
.tlrow .delbtn{width:28px;height:28px;font-size:13px}

/* ---------- game ---------- */
.pspr{width:48px;height:48px;image-rendering:pixelated;flex:none}
.bigspr{width:96px;height:96px;image-rendering:pixelated}
.prow{display:flex;align-items:center;gap:10px;background:var(--cream);border:3px solid var(--bord);border-radius:6px;
  margin:7px 12px;padding:8px 12px;color:var(--text);text-align:left;font-family:inherit;font-size:inherit}
button.prow{width:calc(100% - 24px);cursor:pointer}
.modal .prow,.modal button.prow{margin:6px 0;width:100%}
.prow:active{background:var(--cream2)}
.pname{font-size:20px;text-transform:uppercase;line-height:1.05}
.plv{color:var(--mut);font-size:16px;text-transform:none}
.leadchip{font-family:'Press Start 2P';font-size:9px;background:var(--red);color:#FFF8F0;padding:2px 5px;border-radius:3px;vertical-align:2px}
.barlab{font-family:'Press Start 2P';font-size:9px;color:#F8B050;background:#585048;padding:2px 3px;border-radius:3px;flex:none}
.barnum{font-size:15px;color:var(--mut);flex:none}
.gbar{flex:1;background:#585048;border-radius:4px;padding:2px;min-width:40px}
.gbar>div{height:7px;border-radius:2px;background:#58C868;transition:width .4s}
.gbar.exp>div{height:5px;background:#4890F8}
.tchip{display:inline-block;font-family:'Press Start 2P';font-size:9px;padding:3px 6px;border-radius:4px;
  border:2px solid rgba(0,0,0,.3);color:#FFF8F0}
.shinystar{color:#E8A010}
.shinyglow{filter:drop-shadow(0 0 6px rgba(248,200,40,.8))}
.dexgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:8px 12px}
.dexcell{background:var(--cream);border:3px solid var(--bord);border-radius:6px;padding:8px 2px 6px;text-align:center;color:var(--text);position:relative;min-width:0;overflow:hidden}
button.dexcell{display:block;width:100%;font:inherit;white-space:normal}
.dexcell img{width:44px;height:44px;max-width:100%;image-rendering:pixelated}
.dexcell .dexname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#boxgrid .dexcell img{width:34px;height:34px}
#boxgrid .dexcell{padding:6px 2px 5px}
.dexcell.unk img{filter:brightness(0);opacity:.5}
.dexcell .shinystar{position:absolute;top:3px;right:6px}
.dexname{font-size:13px;text-transform:uppercase;line-height:1.05;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.statrow{display:flex;justify-content:space-between;font-size:21px;padding:4px 0;border-bottom:2px dashed rgba(0,0,0,.12)}
.statrow:last-child{border-bottom:none}
.statgain{display:grid;grid-template-columns:1fr 1fr;gap:3px 18px;font-size:20px;color:var(--text);
  background:var(--cream);border:2px solid var(--bord);border-radius:5px;padding:10px 12px;margin-top:6px}
.memo{font-size:19px;line-height:1.35}
.monstrip{display:flex;align-items:center;gap:9px;background:var(--boxw);border:2px solid var(--bord);border-radius:5px;
  padding:7px 10px;margin-bottom:10px;width:100%;text-align:left;font-family:inherit;font-size:inherit;color:var(--text);cursor:pointer}
.xpplus{font-family:'Press Start 2P';font-size:9px;color:#2E8B48;flex:none}
@keyframes evof{0%,100%{filter:none}50%{filter:brightness(4) saturate(0)}}
.evoflash{animation:evof .5s ease-in-out 4}
@keyframes shk{0%,100%{transform:none}25%{transform:translateX(5px)}75%{transform:translateX(-5px)}}
.shake{animation:shk .35s ease 2}
/* GBA battle choreography */
@keyframes lungeL{0%{transform:none}35%{transform:translate(16px,-9px)}60%{transform:translate(16px,-9px)}100%{transform:none}}
.lunge-l{animation:lungeL .5s ease 1}
@keyframes lungeR{0%{transform:none}35%{transform:translate(-16px,9px)}60%{transform:translate(-16px,9px)}100%{transform:none}}
.lunge-r{animation:lungeR .5s ease 1}
@keyframes blinkHit{0%,49%{opacity:1}50%,100%{opacity:.15}}
.blink{animation:blinkHit .14s steps(1) 4}
@keyframes faintdrop{to{transform:translateY(36px);opacity:0}}
.faintdrop{animation:faintdrop .55s ease-in forwards}
.bob{animation:bob 1.6s ease-in-out infinite}
.bt-msg.msgdone::after{content:'▼';color:var(--red);font-size:13px;margin-left:5px;

.hpcrit{animation:pulse 1s ease-in-out infinite}
/* full-screen move effects on the #fx overlay */

@keyframes fxfire{0%{background:linear-gradient(0deg,rgba(240,88,24,.55),transparent 55%);opacity:0}

#fx.fxelec{animation:fxelec .55s steps(1) forwards}
@keyframes fxelec{0%{background:rgba(248,224,56,.75)}15%{background:transparent}

  60%{background:rgba(248,224,56,.6)}100%{background:transparent}}
#fx.fxwater{animation:fxwater .7s ease-in-out forwards}
@keyframes fxwater{0%{background:linear-gradient(180deg,transparent 70%,rgba(56,120,224,.0));opacity:0}
  45%{background:linear-gradient(180deg,transparent 5%,rgba(56,120,224,.5));opacity:1}100%{opacity:0}}
#fx.fxrock{animation:fxrock .5s ease-out forwards}
@keyframes fxrock{0%{background:transparent}30%{background:rgba(148,116,60,.5)}100%{background:transparent}}
#fx.fxpsy{animation:fxpsy .7s ease forwards}
@keyframes fxpsy{0%{background:radial-gradient(circle,rgba(232,72,128,0) 35%,transparent 70%)}
  45%{background:radial-gradient(circle,rgba(232,72,128,.42) 20%,rgba(112,88,152,.32) 55%,transparent 78%)}
  100%{background:transparent}}
#fx.fximpact{animation:fximpact .4s steps(1) forwards}
@keyframes fximpact{0%{background:rgba(255,255,255,.85)}30%{background:transparent}
  50%{background:rgba(255,255,255,.5)}100%{background:transparent}}
#fx.fxleaf{animation:fxleaf .65s ease forwards}
@keyframes fxleaf{0%{opacity:0;background:linear-gradient(100deg,transparent 40%,rgba(120,200,80,.45) 50%,transparent 60%)}
  45%{opacity:1;background:linear-gradient(100deg,transparent 8%,rgba(120,200,80,.5) 50%,transparent 92%)}100%{opacity:0}}
.mapwrap img.mapimg{filter:var(--townf,none)}
html.theme-night .mapwrap img.mapimg{filter:var(--townf,none) brightness(.62) saturate(.85)}
/* official FRLG battle scene: fixed 240:112 stage, sprites on the ground,
   compact databoxes, text box glued underneath */
.arenabg{position:relative;aspect-ratio:240/112;background-size:cover;background-position:center;
  image-rendering:pixelated;border:2px solid var(--bord);border-radius:6px 6px 0 0;overflow:hidden}
.bt-layer{position:absolute;inset:0;pointer-events:none}
.databox{background:rgba(255,255,255,.9);border:2px solid var(--bord);border-radius:5px;padding:3px 7px 4px}
.databox .pname{font-size:15px;line-height:1.15}
.databox .plv{font-size:13px}
.databox .barlab{font-size:7px;padding:1px 3px}
.databox .gbar{padding:1px}
.databox .gbar>div{height:5px}
.databox .gbar.exp>div{height:4px}
/* party slots on the town map, styled after the in-game party screen */
.pslot{display:flex;align-items:center;gap:6px;background:var(--boxw);border:2px solid var(--bord);
  border-radius:6px;padding:5px 7px;font-family:inherit;text-align:left;color:var(--text);cursor:pointer;min-height:52px}
.pslot:active{background:var(--cream2)}
.pslot .gbar>div{height:5px}
.pslot .barlab{font-size:7px;padding:1px 3px}
.btmemo{background:var(--boxw);border:2px solid var(--bord);border-radius:0 0 5px 5px;
  padding:8px 10px;margin-top:-2px;min-height:68px} /* always two lines tall — no expand/shrink between moves */
.bt-tspr{position:absolute;right:7%;top:4%;width:72px;height:72px;image-rendering:pixelated;z-index:4;
  animation:bosscameo 2.3s ease forwards}
@keyframes bosscameo{0%{transform:translateX(84px);opacity:0}14%{transform:none;opacity:1}
  72%{transform:none;opacity:1}100%{transform:translateX(-48px);opacity:0}}
/* victory screen */
.vbanner{font-family:'Press Start 2P';font-size:20px;text-align:center;color:#E8A010;
  text-shadow:2px 2px 0 rgba(0,0,0,.25);letter-spacing:2px;padding:6px 0 2px;animation:vpop .5s ease-out}
@keyframes vpop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.12)}100%{transform:none;opacity:1}}
.vrow{display:flex;align-items:center;gap:8px;font-size:20px;padding:3px 0}
.vrow img{width:20px;height:20px;image-rendering:pixelated;flex:none}
.vexp{height:5px;width:0;background:#4890F8;border-radius:2px;animation:vexpfill 1.6s ease-out .4s forwards}
@keyframes vexpfill{to{width:100%}}
/* the training screen wears green; boss fights keep the FireRed frame */
.livebar.mode-train{border-bottom-color:#2E8B48}
.btwrap.mode-train>.panel{border-color:#2E8B48;background:#EAF6EA}
html.theme-night .btwrap.mode-train>.panel{background:#18261C;border-color:#2E6B48}
.btwrap.mode-train .btmemo{border-color:#2E8B48}
/* road-trainer fights inherit the biome vars set by applySkin — no hardcoded green */
.btwrap.mode-road>.panel{border-color:var(--bord);background:var(--cream)}
/* something is waiting on the QUEST page */
#tabbar button.alert::after{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;
  background:#D03028;margin-left:3px;vertical-align:7px}
.effchip{font-family:'Press Start 2P';font-size:9px;color:#FFF8F0;padding:3px 6px;border-radius:3px;flex:none}
@keyframes slr{from{transform:translateX(90px);opacity:0}to{transform:none;opacity:1}}
@keyframes sll{from{transform:translateX(-90px);opacity:0}to{transform:none;opacity:1}}
.slidein-r{animation:slr .45s ease-out}
.slidein-l{animation:sll .45s ease-out}
.dmgfloat{position:absolute;font-family:'Press Start 2P';font-size:12px;color:#D03028;
  animation:dfl .9s ease-out forwards;pointer-events:none;z-index:5}
@keyframes dfl{from{transform:none;opacity:1}to{transform:translateY(-34px);opacity:0}}
/* ---------- ball throw theatre ---------- */
.bball{position:absolute;left:16%;bottom:26%;width:22px;height:22px;image-rendering:pixelated;
  z-index:6;pointer-events:none}
.bball.bfly{animation:bflyk .5s linear forwards}
@keyframes bflyk{0%{left:16%;bottom:26%;transform:rotate(0)}
  55%{bottom:74%}
  100%{left:63%;bottom:47%;transform:rotate(660deg)}}
.bball.bdrop{animation:bdropk .5s ease-in forwards}
@keyframes bdropk{0%{transform:translateY(0)}45%{transform:translateY(44px)}
  68%{transform:translateY(30px)}100%{transform:translateY(44px)}}
.bball.brock{animation:brockk .5s ease-in-out}
@keyframes brockk{0%,100%{transform:translateY(44px) rotate(0)}
  25%{transform:translateY(44px) rotate(-24deg) translateX(-2px)}
  75%{transform:translateY(44px) rotate(22deg) translateX(2px)}}
.bball.bok{animation:bokk .7s ease-out}
@keyframes bokk{0%{filter:brightness(1)}25%{filter:brightness(3.2)}100%{filter:brightness(.8)}}
.bball.bpop{animation:bpopk .4s ease-out forwards}
@keyframes bpopk{0%{transform:translateY(44px) scale(1);opacity:1}
  100%{transform:translateY(44px) scale(2.6);opacity:0;filter:brightness(4)}}
.intoball{animation:intobk .38s ease-in forwards}
@keyframes intobk{0%{filter:brightness(1);transform:scale(1);opacity:1}
  35%{filter:brightness(6)}
  100%{filter:brightness(6);transform:scale(.06);opacity:0}}
.outball{animation:outbk .32s ease-out}
@keyframes outbk{0%{filter:brightness(6);transform:scale(.06);opacity:0}
  60%{filter:brightness(4)}
  100%{filter:brightness(1);transform:scale(1);opacity:1}}
.catchstars{position:absolute;left:63%;top:34%;z-index:7;pointer-events:none}
.catchstars span{position:absolute;font-size:16px;color:#F8C830;text-shadow:0 0 3px rgba(0,0,0,.4);
  animation:starpop .85s ease-out forwards}
.catchstars span:nth-child(1){--sx:-18px}
.catchstars span:nth-child(2){--sx:1px;animation-delay:.08s}
.catchstars span:nth-child(3){--sx:19px;animation-delay:.16s}
@keyframes starpop{0%{transform:none;opacity:0}25%{opacity:1}
  100%{transform:translate(var(--sx),-26px) scale(1.3);opacity:0}}
/* ---------- game corner slots ---------- */
.reelbox{width:46px;height:46px;overflow:hidden;border:3px solid var(--bord);border-radius:6px;
  background:var(--boxw);display:flex;align-items:center;justify-content:center}
.reelbox .reelstrip{display:flex;flex-direction:column;align-items:center;gap:10px}
.reelbox.spinning .reelstrip{animation:reelspin .26s linear infinite}
@keyframes reelspin{from{transform:translateY(0)}to{transform:translateY(-44px)}}
/* ---------- ferry travel transition ---------- */
#travelfx{position:fixed;inset:0;z-index:220;background:#000;opacity:0;
  display:flex;align-items:center;justify-content:center;padding:18px}
#travelfx.on{animation:tfxin .35s steps(4) forwards}
#travelfx.out{animation:tfxout .4s steps(4) forwards}
@keyframes tfxin{from{opacity:0}to{opacity:1}}
@keyframes tfxout{from{opacity:1}to{opacity:0}}
#travelfx .tfxcard{width:100%;max-width:390px;background:var(--cream,#F8F0E0);
  border:3px solid var(--bord,#583838);border-radius:8px;padding:10px;
  opacity:0;transform:scale(.92)}
#travelfx.on .tfxcard{animation:tcardin .3s ease-out .2s forwards}
@keyframes tcardin{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
.tfxtitle{font-family:'Press Start 2P';font-size:10px;text-align:center;margin:2px 0 9px;
  color:var(--text,#2A2A2A);line-height:1.5}
.tfxmap{position:relative;border:2px solid var(--bord,#583838);border-radius:4px;overflow:hidden}
.tfxmap img{width:100%;display:block;image-rendering:pixelated}
.tfxsvg{position:absolute;inset:0;width:100%;height:100%}
.tfxdot{position:absolute;transform:translate(-50%,-50%);z-index:3;
  filter:drop-shadow(0 2px 2px rgba(0,0,0,.45));animation:bob 1s ease-in-out infinite}
.tfxsign{font-family:'Press Start 2P';font-size:11px;text-align:center;background:#FFFFFF;
  border:2px solid #C05028;border-radius:4px;margin:10px auto 2px;padding:9px 8px;
  max-width:290px;color:#2A2A2A;line-height:1.6;opacity:0;transform:scale(.6)}
#travelfx.arrive .tfxsign{animation:tsignpop .38s cubic-bezier(.2,.8,.3,1.3) forwards}
@keyframes tsignpop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
html.theme-night .tfxsign{background:#222A34;color:#E0E8F0;border-color:#10161E}
/* ---------- cosmetic weather ---------- */
.wxchip{display:inline-flex;align-items:center;gap:4px;font-family:'Press Start 2P';font-size:8px;
  border:2px solid var(--bord);border-radius:4px;background:var(--boxw);padding:3px 6px;margin-left:8px;
  vertical-align:2px;color:var(--text)}
.wxov{position:absolute;inset:0;pointer-events:none;z-index:3;border-radius:inherit;overflow:hidden}
.wx-rain{background:repeating-linear-gradient(112deg,transparent 0 7px,rgba(88,140,208,.28) 7px 8.5px);
  animation:wxrain .5s linear infinite}
@keyframes wxrain{from{background-position:0 0}to{background-position:-14px 28px}}
.wx-sun{background:radial-gradient(circle at 78% 8%,rgba(248,208,72,.42),transparent 55%);
  animation:wxsun 3.2s ease-in-out infinite}
@keyframes wxsun{0%,100%{opacity:.55}50%{opacity:.95}}
.wx-fog{background:linear-gradient(100deg,rgba(232,236,242,0) 15%,rgba(226,232,240,.5) 40%,rgba(232,236,242,0) 65%),
  linear-gradient(80deg,rgba(226,232,240,0) 45%,rgba(222,228,238,.42) 70%,rgba(226,232,240,0) 95%);
  background-size:220% 100%;animation:wxfog 9s linear infinite}
@keyframes wxfog{from{background-position:120% 0,-40% 0}to{background-position:-120% 0,200% 0}}
.wx-sand{background:repeating-linear-gradient(74deg,transparent 0 9px,rgba(200,160,80,.22) 9px 11px);
  animation:wxsand .7s linear infinite}
@keyframes wxsand{from{background-position:0 0}to{background-position:26px -8px}}
/* ---------- VS intro splash ---------- */
#vsfx{position:fixed;inset:0;z-index:210;overflow:hidden;pointer-events:none}
#vsfx::before{content:'';position:absolute;inset:0;background:#10141A;opacity:.86}
#vsfx .vsp{position:absolute;width:118%;height:46%;display:flex;align-items:center;gap:14px;
  padding:0 13%;box-sizing:border-box}
#vsfx .vsl{top:2%;left:-4%;background:linear-gradient(105deg,#C03028 72%,transparent 72%);
  transform:translateX(-105%);animation:vsin .36s ease-out forwards}
#vsfx .vsr{bottom:2%;right:-4%;background:linear-gradient(-75deg,#3878C8 72%,transparent 72%);
  justify-content:flex-end;transform:translateX(105%);animation:vsin .36s ease-out .12s forwards}
@keyframes vsin{to{transform:none}}
#vsfx .vsp img{width:112px;height:112px;image-rendering:pixelated;filter:drop-shadow(0 3px 0 rgba(0,0,0,.35))}
#vsfx .vsp span{font-family:'Press Start 2P';font-size:12px;color:#FFF8F0;line-height:1.5;
  text-shadow:2px 2px 0 rgba(0,0,0,.55)}
#vsfx .vstxt{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(0);
  font-family:'Press Start 2P';font-size:40px;color:#F8D030;
  text-shadow:3px 3px 0 #B8500F,-2px -2px 0 #B8500F;
  animation:vspop .3s cubic-bezier(.2,.8,.3,1.45) .42s forwards}
@keyframes vspop{to{transform:translate(-50%,-50%) scale(1)}}
#vsfx.out{animation:tfxout .32s steps(4) forwards}
/* ---------- classic evolution morph ---------- */
.evomorph{position:relative;width:104px;height:104px;margin:10px auto}
.evomorph img{position:absolute;inset:0;width:104px;height:104px;image-rendering:pixelated}
.evomorph .em-old{animation:emOld 2.5s ease-in-out forwards}
@keyframes emOld{0%{filter:none;transform:scale(1);opacity:1}
  22%{filter:brightness(0) invert(1)}
  40%{transform:scale(.55)}52%{transform:scale(.9)}
  64%{filter:brightness(0) invert(1);transform:scale(.5);opacity:1}
  70%,100%{opacity:0;transform:scale(.4)}}
.evomorph .em-new{opacity:0;animation:emNew 2.5s ease-in-out forwards}
@keyframes emNew{0%,60%{filter:brightness(0) invert(1);transform:scale(.4);opacity:0}
  66%{opacity:1;transform:scale(1.06)}
  80%{filter:brightness(0) invert(1);transform:scale(.96)}
  88%{filter:brightness(2.4)}
  100%{filter:none;transform:scale(1);opacity:1}}
/* ---------- shiny encounter sparkle ---------- */
.shinyburst{position:absolute;right:16%;top:18%;z-index:6;pointer-events:none}
.shinyburst span{position:absolute;font-size:16px;color:#F8D030;text-shadow:0 0 4px rgba(248,208,48,.8);
  animation:shburst 1.1s ease-out forwards}
.shinyburst span:nth-child(1){--dx:-26px;--dy:-18px}
.shinyburst span:nth-child(2){--dx:24px;--dy:-22px;animation-delay:.07s}
.shinyburst span:nth-child(3){--dx:-20px;--dy:16px;animation-delay:.14s}
.shinyburst span:nth-child(4){--dx:28px;--dy:12px;animation-delay:.21s}
.shinyburst span:nth-child(5){--dx:2px;--dy:-30px;animation-delay:.28s}
@keyframes shburst{0%{transform:none;opacity:0}18%{opacity:1}
  100%{transform:translate(var(--dx),var(--dy)) scale(1.5) rotate(40deg);opacity:0}}
#monsheet{position:fixed;inset:0;background:var(--bg);z-index:60;transform:translateY(102%);
  transition:transform .32s cubic-bezier(.32,.72,.3,1);overflow-y:auto;-webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;padding:calc(env(safe-area-inset-top) + 12px) 0 60px;visibility:hidden}
#monsheet.open{transform:none;visibility:visible}

/* ---------- settings ---------- */
.srow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 12px;
  background:var(--cream);border:3px solid var(--bord);margin:8px 12px;border-radius:var(--radius);color:var(--text)}
.srow .lab{font-size:21px;text-transform:uppercase;line-height:1.1}
.srow .sub{font-size:16px;color:var(--mut);margin-top:2px}
.seg{display:flex;background:var(--boxw);border:2px solid var(--bord);border-radius:4px;padding:2px;flex:none}
.seg button{border:none;background:none;color:var(--mut);font-family:'Press Start 2P';font-size:10px;padding:9px 10px;
  border-radius:3px;line-height:1}
.seg button.on{background:var(--bord);color:var(--cream)}
.btn{border:2px solid var(--bord);border-radius:4px;background:var(--boxw);color:var(--text);
  font-family:'Press Start 2P';font-size:10px;padding:11px 10px;flex:none;line-height:1;text-transform:uppercase}
.btn.acc{background:#F8DCD0}
.btn.danger{color:var(--red)}
.btn.dangerbg{background:var(--red);border-color:#802018;color:#FFF8F0}
.about{color:var(--inkmut);font-size:17px;text-align:center;margin:26px 20px;line-height:1.45}

/* ---------- modal ---------- */
#modalwrap{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;padding:24px}
#modalwrap.open{display:flex}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.6)}
.modal{position:relative;background:var(--frame);border-radius:8px;padding:3px;width:100%;max-width:340px}
.modal .min{background:var(--boxw);border-radius:5px;padding:16px;color:var(--text);
  max-height:76vh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.modal h3{margin:0 0 10px;font-family:'Press Start 2P';font-size:12px;font-weight:400;line-height:1.5}
.modal p{color:#606060;font-size:19px;margin:0 0 12px;line-height:1.25}
.modal input[type=text],.modal textarea{width:100%;background:var(--boxw);border:2px solid var(--bord);
  border-radius:4px;color:var(--text);font-size:21px;font-family:inherit;padding:9px 11px;outline:none}
.modal input[type=text]:focus,.modal textarea:focus{border-color:var(--exp)}
.modal textarea{resize:vertical}
.mbtns{display:flex;gap:8px;margin-top:14px}
.mbtns .btn{flex:1;padding:14px 6px}

/* ---------- toast ---------- */
#toast{position:fixed;top:calc(env(safe-area-inset-top) + 12px);left:50%;transform:translate(-50%,-16px);
  opacity:0;transition:.25s ease;z-index:90;background:var(--boxw);border:3px solid var(--frame);
  border-radius:6px;padding:9px 14px;font-size:20px;color:var(--text);line-height:1.2;
  display:flex;gap:14px;align-items:center;pointer-events:none;max-width:90vw;width:max-content}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{background:none;border:none;color:var(--red);font-family:'Press Start 2P';font-size:11px;padding:0}
</style>
</head>
<body>

<main id="view"></main>

<nav id="tabbar">
  <button data-action="tab" data-tab="summary" aria-label="Trainer">TRAINER</button>
  <button data-action="tab" data-tab="map" aria-label="Town map">MAP</button>
  <button data-action="tab" data-tab="team" aria-label="Pokemon">TEAM</button>
  <button data-action="tab" data-tab="lab" aria-label="Lab">LAB</button>
  <button data-action="tab" data-tab="quests" aria-label="Quests">QUEST</button>
  <button data-action="tab" data-tab="settings" aria-label="Options">OPTION</button>
</nav>

<div id="sheet"></div>
<div id="monsheet"></div>
<div id="modalwrap"></div>
<div id="toast"></div>
<div id="fx"></div>

<script>
(function(){
'use strict';

/* ===== utils ===== */
var KEY='gymtracker.v1';
function $(s){return document.querySelector(s);}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
var GROUP_COLORS=['#D03028','#3878C8','#38A058','#B07818','#8040A0','#C86828'];
var DAY=86400000;
var MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var DAYSF=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

function dateKey(ts){var d=new Date(ts);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function startOfDay(ts){var d=new Date(ts);d.setHours(0,0,0,0);return d.getTime();}
function fmtDayKey(k){
  var today=dateKey(Date.now()), yest=dateKey(Date.now()-DAY);
  if(k===today)return 'Today';
  if(k===yest)return 'Yesterday';
  var p=k.split('-'), dt=new Date(+p[0],+p[1]-1,+p[2]);
  return DAYS[dt.getDay()]+', '+MONTHS[+p[1]-1]+' '+(+p[2])+((+p[0])!==new Date().getFullYear()?' '+p[0]:'');
}
function rel(ts){
  var n=Math.round((startOfDay(Date.now())-startOfDay(ts))/DAY);
  if(n<=0)return 'today';
  if(n===1)return 'yesterday';
  if(n<30)return n+'d ago';
  var d=new Date(ts);return MONTHS[d.getMonth()]+' '+d.getDate();
}
function fmtTime(ts){var d=new Date(ts);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function fmtW(w){return String(Math.round(w*100)/100);}

/* ===== state ===== */
function seedState(){
  function g(name,exs){return {id:uid(),name:name,exercises:exs.map(function(n){return {id:uid(),name:n,note:''};})};}
  return {version:4,unit:'kg',game:null,groups:[
    g('Back',['Lat pull down','Close grip row','Row machine']),
    g('Biceps',['Curl machine','Hammer curl']),
    g('Pecs',['Fly machine','Incline bench','Converging chest press']),
    g('Triceps',['Triceps pull down','Triceps pull up','Tricep isolate']),
    g('Fore arm',['Curl','Extension']),
    g('Shoulders',['Rear delts','Side delts','Machine delts']),
    g('Legs',['Leg extension','Seated leg curl','Calf raises','Cable crunch'])
  ],logs:{},sessions:[],session:null};
}
function load(){
  try{var d=JSON.parse(localStorage.getItem(KEY));
    if(d&&Array.isArray(d.groups)&&d.logs&&typeof d.logs==='object')return d;
  }catch(e){}
  return seedState();
}
var state=load();
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(state));}
  catch(e){toast('⚠️ Could not save — storage full?');}
}
save(); // persist seed on first run (migrations run at init, after all definitions)

/* ===== model helpers ===== */
function exById(id){
  for(var i=0;i<state.groups.length;i++){
    var g=state.groups[i];
    for(var j=0;j<g.exercises.length;j++)if(g.exercises[j].id===id)return {ex:g.exercises[j],group:g,gi:i};
  }
  return null;
}
function groupById(id){for(var i=0;i<state.groups.length;i++)if(state.groups[i].id===id)return state.groups[i];return null;}
function logsOf(id){return state.logs[id]||[];}
function lastLog(id){var l=logsOf(id);return l.length?l[l.length-1]:null;}
function bestW(id){return logsOf(id).reduce(function(m,l){return Math.max(m,l.w);},0);}
function dayTops(id){
  var m={};
  logsOf(id).forEach(function(l){var k=dateKey(l.ts);if(!(k in m)||l.w>m[k])m[k]=l.w;});
  return Object.keys(m).sort().map(function(k){return {k:k,w:m[k]};});
}
function trendOf(id){var t=dayTops(id);if(t.length<2)return 0;return t[t.length-1].w-t[t.length-2].w;}

var tab='summary', editMode=false, sheetEx=null, openScrollY=0, justStarted=false, questReveal=false;

/* ===== render: tabs ===== */
var lastRenderedTab=null;
/* full-bleed biome skins (DAY theme only; night stays untouched):
   swap the page bg + the FRLG white/red vars for the location's palette */
function applySkin(){
  var v=$('#view');
  function set(bg,pb,bd,bx){
    v.style.background=bg;
    v.style.setProperty('--cream',pb);v.style.setProperty('--cream2',bg);
    v.style.setProperty('--bord',bd);v.style.setProperty('--boxw',bx);
  }
  function clear(){
    v.style.background='';
    ['--cream','--cream2','--bord','--boxw'].forEach(function(k){v.style.removeProperty(k);});
  }
  if(state.theme==='night'){clear();return;}
  if(tab==='quests'&&state.game){
    // the QUEST page wears the palette of the road you're LOOKING AT: an old
    // village shows its own biome, not the frontier's
    var qvT=curTown();
    if(qvT!==townIdx()&&qvT<ROAD_LOC.length){
      var lh=roadLoc(qvT);
      set(lh.bg,lh.pb,lh.c,lh.bx);return;
    }
    if(roadActive()){
      var lc=roadLoc(state.game.road.idx);
      set(lc.bg,lc.pb,lc.c,lc.bx);return;
    }
  }
  // each special building wears its own mood: casino gold, rocket sage, silph blue…
  if(tab&&tab.indexOf('poi-')===0){
    var pdz=poiDef(tab.slice(4));
    if(pdz&&pdz.pal){set(pdz.pal.bg,pdz.pal.pb,pdz.pal.c,pdz.pal.bx);return;}
  }
  if(tab==='workout'&&state.session&&state.session.mode==='train'){
    // roadblock/rival fights wear the road's biome; only plain wild training is green
    if(state.session.wild&&state.session.wild.tr&&state.game&&state.game.road){
      var rc=roadLoc(state.game.road.idx);
      set(rc.bg,rc.pb,rc.c,rc.bx);return;
    }
    set('#CDE6C8','#EAF6E6','#2E8B48','#F4FBF2');return; // deep in the tall grass
  }
  clear();
}
/* which battle skin the panel wears: red boss / biome road-trainer / green wild */
function battleModeCls(){
  if(!state.session)return '';
  if(state.session.mode==='boss')return ' mode-boss';
  if(state.session.wild&&state.session.wild.tr)return ' mode-road';

}

    if(state.game.qSeen!==_sig){state.game.qSeen=_sig;save();}
  }
  document.querySelectorAll('#tabbar button').forEach(function(b){

  else if(tab==='map')v.innerHTML=mapHTML();
  else if(tab==='workout')v.innerHTML=workoutHTML();
  else if(tab==='team')v.innerHTML=teamHTML();
  else if(tab==='lab')v.innerHTML=labHTML();
  else if(tab==='center')v.innerHTML=centerHTML();
  else if(tab==='trophy')v.innerHTML=trophyHTML();
  else if(tab==='card')v.innerHTML=cardHTML();
  else if(tab==='mart')v.innerHTML=martHTML();
  else if(tab==='gymhall')v.innerHTML=gymhallHTML();
  else if(tab==='travel')v.innerHTML=travelHTML();
  else if(tab==='quests')v.innerHTML=questsHTML();
  else if(tab&&tab.indexOf('poi-')===0)v.innerHTML=poiPageHTML(tab.slice(4));
  else v.innerHTML=settingsHTML();
  if(tab!==lastRenderedTab){
    v.classList.remove('pagein');void v.offsetWidth;v.classList.add('pagein');
    lastRenderedTab=tab;
  }
  if(state.session)alignBack();
  if(!keepScroll)window.scrollTo(0,0);
}

/* ===== workout sessions ===== */
function fmtElapsed(ms){
  var s=Math.max(0,Math.floor(ms/1000));
  var m=Math.floor(s/60), sec=s%60, h=Math.floor(m/60);
  return h>0 ? h+':'+String(m%60).padStart(2,'0')+':'+String(sec).padStart(2,'0')
             : m+':'+String(sec).padStart(2,'0');
}
function fmtDur(ms){
  if(ms<60000)return Math.round(ms/1000)+'s';
  var m=Math.round(ms/60000);
  return m>=60 ? Math.floor(m/60)+'h '+(m%60)+'m' : m+'m';
}
function fmtVol(v){
  if(v>=10000)return String(Math.round(v/1000))+'k';
  if(v>=1000)return (v/1000).toFixed(1)+'k';
  return String(Math.round(v));
}
function allLogsFlat(){
  var out=[];
  state.groups.forEach(function(g){g.exercises.forEach(function(e){
    logsOf(e.id).forEach(function(l){out.push({l:l,ex:e});});
  });});
  return out;
}
function sessionStats(start,end){
  var sets=0,vol=0,exIds={};
  allLogsFlat().forEach(function(o){
    if(o.l.ts>=start&&o.l.ts<=end){sets+=o.l.s;vol+=o.l.w*o.l.r*o.l.s;exIds[o.ex.id]=1;}
  });
  return {sets:sets,volume:Math.round(vol),exercises:Object.keys(exIds).length};
}
function sessionSets(){return state.session?sessionStats(state.session.start,Date.now()).sets:0;}
function daySetsMap(){
  var m={};
  allLogsFlat().forEach(function(o){var k=dateKey(o.l.ts);m[k]=(m[k]||0)+o.l.s;});
  return m;
}
function weekStartTs(ts){
  var d0=startOfDay(ts);
  var day=(new Date(d0).getDay()+6)%7; // Monday = 0
  return d0-day*DAY;
}
var tickInt=null;
function ensureTicker(){
  if(state.session&&!tickInt)tickInt=setInterval(tickElapsed,1000);
  if(!state.session&&tickInt){clearInterval(tickInt);tickInt=null;}
}
function tickElapsed(){
  if(!state.session)return;
  var t=fmtElapsed(Date.now()-state.session.start);
  document.querySelectorAll('.elapsed').forEach(function(el){el.textContent=t;});
}
function startWorkout(mode){
  if(state.session)return;
  resolveRests(); // finished Center rests apply before the squad's HP is seeded
  state.session={start:Date.now(),mode:mode==='boss'?'boss':'train'};
  if(state.game&&state.session.mode==='train'){
    state.session.wild=spawnWild();
    if(pendingMb!=null&&roadActive()&&!state.game.road.mb[pendingMb]){
      var pmb=mbFor(state.game.road.idx,pendingMb);
      state.session.wild={sp:pmb.sp,lv:pmb.lv,hp:pmb.hp,max:pmb.hp,shiny:false,
        tr:{cls:pmb.cls,clsN:pmb.clsN,name:pmb.name,purse:pmb.purse,mb:pendingMb,arena:pmb.arena}};
    }
    pendingMb=null;
    if(pendingPoi){
      var pwld=poiWildFor(pendingPoi.kind,pendingPoi.f);
      if(pwld)state.session.wild=pwld;
      pendingPoi=null;
    }
    initBossSession();
    state.session.bmsg=state.session.wild.tr
      ?state.session.wild.tr.clsN+' '+state.session.wild.tr.name+' sent out '+DEX[state.session.wild.sp].n+'! Log a set to attack!'
      :poiWildMsg(state.session.wild);
  }
  if(state.game&&state.session.mode==='boss'&&state.game.boss){
    initBossSession();
    introCameo=true; // the gym leader walks on before their first mon
    var bzs=bossInfo();
    state.session.bmsg=bzs?(bzs.n+' wants to battle! '+bzs.n+' sent out '+bzs.mon+'!'):'';
  }
  // a bought LUCKY EGG auto-activates on the next workout
  if(state.game&&bagOf().luckyegg>0){
    bagOf().luckyegg--;
    state.session.lucky=1;
    state.session.bmsg='LUCKY EGG is glowing — 2× XP this workout! '+(state.session.bmsg||'');
  }
  save();ensureTicker();
  justStarted=true;
  tab='workout';editMode=false;render();
  var fx=$('#fx');
  if(fx){fx.classList.remove('go');void fx.offsetWidth;fx.classList.add('go');setTimeout(function(){fx.classList.remove('go');},950);}
  sfx(state.game?'battlestart':'save');
  // the opponent announces itself once the flash clears
  if(state.game&&state.session){
    var cw=state.session.wild?state.session.wild.sp:null;
    var cb=(!cw&&state.session.mode==='boss')?bossInfo():null;
    setTimeout(function(){if(cw)cry(cw);else if(cb)cryById(cb.monId);},1050);
    // trainer fights open on the big VS splash; shiny wilds get their fanfare
    var vw=state.session.wild;
    if(state.session.mode==='boss'&&cb)playVsFx(cb.tr,cb.n);
    else if(vw&&vw.tr)playVsFx(vw.tr.cls,vw.tr.clsN+' '+vw.tr.name);
    else if(vw&&vw.shiny)setTimeout(shinyBurst,1200);
  }
  toast(mode==='boss'?'Boss battle started! ⚔️':'Training battle started! 🔥');
}
function endWorkout(){
  var ses=state.session;if(!ses)return;
  var end=Date.now();
  var st=sessionStats(ses.start,end);
  // battle wounds walk home with you — the POKEMON CENTER heals them
  if(state.game&&ses.phps){
    state.game.hurt=state.game.hurt||{};
    Object.keys(ses.phps).forEach(function(k){state.game.hurt[k]=ses.phps[k];});
  }
  state.session=null;ensureTicker();
  // back to town after every workout, like leaving the gym
  tab='map';editMode=false;
  if(!st.sets){save();render();toast('Workout ended — no sets logged, so nothing saved');return;}
  state.sessions=state.sessions||[];
  state.sessions.push({id:uid(),start:ses.start,end:end,sets:st.sets,volume:st.volume,exercises:st.exercises});
  var cut=0;
  if(state.game&&st.volume){cut=Math.round(st.volume/20);addMoney(cut);}
  save();render();
  sfx('victory');
  var amEnd=state.game?activeMon():null;
  function srow(icon,label,val){
    return '<div style="display:flex;align-items:center;gap:8px;padding:3px 0;font-size:20px">'+
      '<img src="'+itemIcon(icon)+'" alt="" style="width:20px;height:20px;image-rendering:pixelated;flex:none">'+
      '<span style="flex:1;color:var(--mut)">'+label+'</span><b>'+val+'</b></div>';
  }
  showModal('<h3 style="text-align:center">Workout complete! 💪</h3>'+
    (amEnd?'<div style="text-align:center;padding:2px 0 6px"><img class="bigspr'+(amEnd.shiny?' shinyglow':'')+'" src="'+sprPath(amEnd.sp,amEnd.shiny)+'" alt="" style="width:72px;height:72px"></div>':'')+
    srow('greatball','Duration',fmtDur(end-ses.start))+
    srow('protein','Exercises · Sets',st.exercises+' · '+st.sets)+
    srow('iron','Volume',fmtVol(st.volume)+' '+esc(state.unit))+
    (ses.xpg?srow('luckyegg','XP earned','+'+ses.xpg):'')+
    (cut?srow('pokeball','Purse','₽'+cut.toLocaleString()):'')+
    '<div class="mbtns"><button class="btn acc" data-action="close-modal">DONE</button></div>');
  if(state.game)checkGameEvents();
}
function applyTheme(){
  var th=state.theme==='day'?'theme-day':'theme-night';
  document.documentElement.className=th;
  var meta=document.querySelector('meta[name="theme-color"]');
  if(meta)meta.setAttribute('content',state.theme==='day'?'#E4E8EE':'#182028');
}
function migrateState(){
  var changed=false, note=null;
  if(state.theme!=='day'&&state.theme!=='night'){state.theme='night';changed=true;}
  if(!Array.isArray(state.sessions)){state.sessions=[];changed=true;}
  if(!('session' in state)||(state.session&&typeof state.session.start!=='number')){state.session=null;changed=true;}
  state.groups.forEach(function(g){g.exercises.forEach(function(e){
    if(e.name==='Dear delts'){e.name='Rear delts';changed=true;}
  });});
  // v2: add Shoulders + Legs groups to existing installs (one time)
  if(!(state.version>=2)){
    if(!state.groups.some(function(g){return /shoulder/i.test(g.name);})){
      state.groups.push({id:uid(),name:'Shoulders',exercises:[]});
    }
    var lg=null;
    state.groups.forEach(function(g){if(!lg&&/^leg/i.test(g.name))lg=g;});
    if(!lg){lg={id:uid(),name:'Legs',exercises:[]};state.groups.push(lg);}
    ['Leg extension','Seated leg curl','Calf raises','Cable crunch'].forEach(function(n){
      if(!lg.exercises.some(function(e){return e.name.toLowerCase()===n.toLowerCase();})){
        lg.exercises.push({id:uid(),name:n,note:''});
      }
    });
    state.version=2;changed=true;
  }
  // v3: move the delt machines into Shoulders, history (same ids) comes along
  if(!(state.version>=3)){
    var sh=null;
    state.groups.forEach(function(g){if(!sh&&/shoulder/i.test(g.name))sh=g;});
    if(!sh){sh={id:uid(),name:'Shoulders',exercises:[]};state.groups.push(sh);}
    ['Rear delts','Side delts','Machine delts'].forEach(function(n){
      state.groups.forEach(function(g){
        if(g===sh)return;
        for(var i=0;i<g.exercises.length;i++){
          if(g.exercises[i].name.toLowerCase()===n.toLowerCase()){
            sh.exercises.push(g.exercises.splice(i,1)[0]);
            return;
          }
        }
      });
    });
    state.version=3;changed=true;
  }
  // v4: game container
  if(!('game' in state)){state.game=null;changed=true;}
  if(state.game){
    if(!state.game.enc)state.game.enc={};
    if(!state.game.flags)state.game.flags={};
    if(!state.game.seen)state.game.seen={};
    if(!state.game.dex)state.game.dex={};
    if(!Array.isArray(state.game.mons))state.game.mons=[];
  }
  if(!(state.version>=4)){state.version=4;changed=true;}
  // v5: boss ladder + replay flag
  if(state.game&&!state.game.boss&&!state.game.flags.champion){state.game.boss={idx:0,hp:BOSSES[0].hp};changed=true;}
  if(state.game&&!state.gamePlayed){state.gamePlayed=1;changed=true;}
  if(!(state.version>=5)){state.version=5;changed=true;}
  // v6: sound + hero
  if(state.sound===undefined){state.sound=true;changed=true;}
  if(state.game&&state.game.player===undefined){state.game.player=null;changed=true;}
  if(!(state.version>=6)){state.version=6;changed=true;}
  // v7: rematch rounds
  if(state.game&&!state.game.round){state.game.round=1;changed=true;}
  if(state.game&&state.game.flags.champion&&!state.game.boss){
    state.game.round=2;state.game.boss={idx:0,hp:hpFor(0,2)};changed=true;
  }
  if(!(state.version>=7)){state.version=7;changed=true;}
  // v8: oak's egg slot
  if(state.game&&state.game.egg===undefined){state.game.egg=null;changed=true;}
  if(!(state.version>=8)){state.version=8;changed=true;}
  // v9: money, bag, hall of fame, manual party
  if(state.game){
    if(state.game.money===undefined){
      state.game.money=3000+badgeCount()*1500+(state.game.flags.champion?5000:0);
      changed=true;
    }
    if(!state.game.bag){state.game.bag={};changed=true;}
    if(!Array.isArray(state.game.hof)){state.game.hof=[];changed=true;}
    if(state.game.partyIds===undefined){state.game.partyIds=null;changed=true;}
    if(!state.game.medals){state.game.medals={};changed=true;}
    if(!state.game.hurt){state.game.hurt={};changed=true;}
    if(state.game.raid===undefined){state.game.raid=null;changed=true;}
    if(state.game.road===undefined){state.game.road=null;changed=true;}
    if(state.game.daily===undefined){state.game.daily=null;changed=true;}
    if(state.game.npcq===undefined){state.game.npcq=null;changed=true;}
    if(state.game.visit===undefined){state.game.visit=null;changed=true;}
    if(!state.game.beenTo){ // old saves have already been to every town up to their progress
      state.game.beenTo={};for(var _t=0;_t<=townIdx();_t++)state.game.beenTo[_t]=1;changed=true;
    }
    if(!state.game.rest){state.game.rest={};changed=true;}
    if(state.game.bag&&state.game.bag.xattack){
      state.game.bag.fullrestore=(state.game.bag.fullrestore||0)+state.game.bag.xattack;
      delete state.game.bag.xattack;changed=true;
    }
  }
  if(!(state.version>=9)){state.version=9;changed=true;}
  // v10: per-road quest history + battle catching (the passive catch bars retired)
  if(state.game){
    if(!state.game.roadLog){
      state.game.roadLog={};
      // roads already behind you were fully cleared to advance — record them as such
      var _endIdx=state.game.boss?Math.min(state.game.boss.idx,ROAD_LOC.length):ROAD_LOC.length;
      for(var _r=0;_r<_endIdx;_r++)state.game.roadLog[_r]={synth:1,round:1};
      changed=true;
    }
    if(state.game.enc&&Object.keys(state.game.enc).length){state.game.enc={};changed=true;}
    // every caught species counts as seen (fills the AREA DEX silhouettes)
    Object.keys(state.game.dex||{}).forEach(function(_sp){
      if(state.game.dex[_sp]&&state.game.dex[_sp].c&&!state.game.seen[_sp]){state.game.seen[_sp]=1;changed=true;}
    });
  }
  if(!(state.version>=10)){state.version=10;changed=true;}
  // v11: the special places open their doors
  if(state.game&&!state.game.poi){state.game.poi={};changed=true;}
  if(!(state.version>=11)){state.version=11;changed=true;}
  // v12: battle points + trainer-card streak record (Athlete's Pack)
  if(state.game){
    if(state.game.bp===undefined){state.game.bp=0;changed=true;}
    if(state.game.bestStreak===undefined){
      state.game.bestStreak=(state.game.daily&&state.game.daily.streak)||0;changed=true;
    }
  }
  if(!(state.version>=12)){state.version=12;changed=true;}
  // a workout left running for >6h was clearly forgotten: close it at the last logged set
  if(state.session&&Date.now()-state.session.start>6*3600000){
    var ses=state.session, limit=ses.start+6*3600000, lastTs=0;
    allLogsFlat().forEach(function(o){if(o.l.ts>=ses.start&&o.l.ts<=limit&&o.l.ts>lastTs)lastTs=o.l.ts;});
    if(lastTs>ses.start){
      var st=sessionStats(ses.start,lastTs);
      state.sessions.push({id:uid(),start:ses.start,end:lastTs,sets:st.sets,volume:st.volume,exercises:st.exercises});
      note='Your last workout was still running — saved it automatically.';
    }
    state.session=null;changed=true;
  }
  if(changed)save();
  return note;
}

/* ===== summary tab ===== */
function weeksChartHTML(){
  var daysSet={};
  allLogsFlat().forEach(function(o){daysSet[startOfDay(o.l.ts)]=1;});
  var thisWS=weekStartTs(Date.now()), weeks=[];
  for(var i=7;i>=0;i--){
    var ws=thisWS-i*7*DAY, n=0;
    Object.keys(daysSet).forEach(function(k){var t=+k;if(t>=ws&&t<ws+7*DAY)n++;});
    weeks.push({ws:ws,n:n});
  }
  var max=Math.max.apply(null,weeks.map(function(w){return w.n;}).concat([4]));
  var W=312,H=92,bw=28,gap=10.6,bars='';
  weeks.forEach(function(w,i){
    var x=i*(bw+gap), bh=Math.max(3,Math.round(w.n/max*56)), y=72-bh;
    var cur=i===weeks.length-1;
    bars+='<rect x="'+x.toFixed(1)+'" y="'+y+'" width="'+bw+'" height="'+bh+'" rx="3" fill="'+(cur?'#E89028':'var(--accent)')+'" opacity="'+(w.n?1:.25)+'"/>';
    if(w.n)bars+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(y-5)+'" text-anchor="middle" style="fill:#606060;font-size:13px;font-family:VT323">'+w.n+'</text>';
  });
  var d0=new Date(weeks[0].ws);
  bars+='<text x="0" y="'+(H-2)+'" style="fill:#787878;font-size:13px;font-family:VT323">'+MONTHS[d0.getMonth()]+' '+d0.getDate()+'</text>'+
    '<text x="'+W+'" y="'+(H-2)+'" text-anchor="end" style="fill:#787878;font-size:13px;font-family:VT323">this week</text>';

var RANK_TIERS=['BRONZE','SILVER','GOLD','MASTER'];
var RANK_COLS=['#C08050','#98A8B8','#E8A010','#B06AD0'];
function cardStats(){
  var vol=totalVolumeAll();
  var workouts=(state.sessions||[]).length;
  var days=Object.keys(daySetsMap()).length;
  var streak=Math.max((state.game&&state.game.bestStreak)||0,(state.game&&state.game.daily&&state.game.daily.streak)||0);
  var top=0,ex={};
  allLogsFlat().forEach(function(o){if(o.l.w>top)top=o.l.w;ex[o.ex.id]=1;});
  return [
    {n:'IRON MOVED',v:Math.round(vol),fmt:fmtVol(vol)+' '+state.unit,t:[50000,250000,1000000,5000000],icon:'iron'},
    {n:'WORKOUTS',v:workouts,fmt:String(workouts),t:[25,100,250,500],icon:'protein'},
    {n:'TRAINING DAYS',v:days,fmt:String(days),t:[30,100,250,500],icon:'carbos'},
    {n:'BEST STREAK',v:streak,fmt:streak+' days',t:[7,21,50,100],icon:'luckyegg'},
    {n:'TOP LIFT',v:top,fmt:fmtW(top)+' '+state.unit,t:[60,100,140,180],icon:'hpup'},
    {n:'VARIETY',v:Object.keys(ex).length,fmt:Object.keys(ex).length+' exercises',t:[10,18,28,40],icon:'calcium'}
  ];
}
function rankTierOf(c){var n=0;c.t.forEach(function(th){if(c.v>=th)n++;});return n;}
function cardRank(stars){
  if(stars>=24)return ['RAINBOW','#B06AD0'];
  if(stars>=18)return ['GOLD','#E8A010'];
  if(stars>=12)return ['SILVER','#98A8B8'];
  if(stars>=6)return ['BRONZE','#C08050'];
  return ['NEW TRAINER','#C05028'];
}

    }

      '<div class="plv" style="font-size:11px;margin-top:3px">'+next+'</div></div></div>';

  for(var j=0;j<3;j++){

function restOf(){if(!state.game)return {};if(!state.game.rest)state.game.rest={};return state.game.rest;}
function resolveRests(){
  if(!state.game||state.session)return;

  Object.keys(r).forEach(function(uid){
    if(r[uid]<=now){

  var b=DEX[sp].bs;

    atk:Math.floor(2*b[1]*l/100)+5,def:Math.floor(2*b[2]*l/100)+5,

var CATCH_FAIL_LINES=['Oh, no! The POKEMON broke free!','Aww! It appeared to be caught!','Aargh! Almost had it!','Gah! It was so close, too!'];
function runThrow(bk){
  var s=state.session;
  if(throwBusy||!s||s.mode!=='train'||!s.wild||s.wild.tr||s.blackout)return;
  var w=s.wild;
  if(w.ghost===5)return; // the MAROWAK ghost passes right through balls
  var bag=bagOf(),isSafari=!!w.safari;
  if(!ITEMS[bk]||!ITEMS[bk].mult)return;
  if(isSafari){
    if(bk!=='safariball'||(poiOf('safari').balls||0)<=0)return;
  }else{
    if(bk==='safariball'||(bag[bk]||0)<=0)return;
  }
  // everything is decided and SAVED up front — the animation is pure theatre,
  // so an interrupted throw can never eat a ball without paying out
  if(isSafari)poiOf('safari').balls--;
  else bag[bk]--;
  var res=catchCheck(w,ballMultFor(w,bk));
  var wPre={sp:w.sp,lv:w.lv,hp:Math.max(0,w.hp),max:w.max,shiny:w.shiny};
  var safariOver=isSafari&&(poiOf('safari').balls||0)<=0;
  var fled=false;
  if(res.caught){
    var cm=addMon(w.sp,w.shiny);
    cm.xp=xpFloor(w.lv); // it keeps the level it fought at
    if(w.ghost!==undefined){ // a caught ghost is a spirit at rest too
      var pgc=poiOf('tower2');
      if((pgc.floor||0)===w.ghost)pgc.floor=(pgc.floor||0)+1;
    }
    if(safariOver)poiOf('safari').active=0;
    s.wild=spawnWild();
    s.bmsg='A wild '+DEX[s.wild.sp].n+' appeared!'+(s.wild.safari?' THROW BALL when ready!':' Log a set to attack — it fights back!');
  }else{
    fled=isSafari&&Math.random()<0.35;
    if(safariOver)poiOf('safari').active=0;
    if(fled||safariOver){
      s.wild=spawnWild();
      s.bmsg=(fled?'It broke free and fled!':'Out of SAFARI BALLS — the game is over!')+' A wild '+DEX[s.wild.sp].n+' appeared!';
    }else{
      s.bmsg=CATCH_FAIL_LINES[Math.min(3,res.shakes)]+(isSafari?' THROW BALL when ready!':' Log a set to attack!');
    }
  }
  save();
  closeModal();
  throwBusy=true;
  clearBattleAnim();
  var wrap=bw();
  if(!wrap){throwBusy=false;render(true);return;}
  // the panel keeps showing the PRE-throw wild while the ball flies
  wrap.innerHTML=wildPanelHTML(false,{wild:wPre,lead:leadMon()});
  alignBack();
  var scene=bq('.arenabg'),espr=bq('.bt-espr');
  typeMsg(playerName()+' used '+ITEMS[bk].n+'!');
  sfx('throw');
  var ball=document.createElement('img');
  var bImg=ITEM_IMG_OVR[bk];
  ball.src=bImg?bImg.src:itemIcon(bk);ball.className='bball bfly';ball.alt='';
  if(bImg)ball.style.filter=bImg.f;
  if(scene)scene.appendChild(ball);
  var T=animTimers;
  T.push(setTimeout(function(){
    if(espr)espr.classList.add('intoball');
    sfx('ballopen');
  },440));
  T.push(setTimeout(function(){
    // land: pin position inline, then bounce (later classes only animate transform/filter)
    ball.style.left='63%';ball.style.bottom='47%';
    ball.classList.remove('bfly');ball.classList.add('bdrop');
  },540));
  T.push(setTimeout(function(){ball.style.transform='translateY(44px)';},1080));
  var rocks=res.caught?3:Math.min(3,res.shakes);
  for(var ri=0;ri<rocks;ri++){
    (function(ix){T.push(setTimeout(function(){
      ball.classList.remove('bdrop','brock');void ball.offsetWidth;ball.classList.add('brock');
      sfx('ballshake');
    },1300+ix*720));})(ri);
  }
  var endT=1300+rocks*720+120;
  if(res.caught){
    T.push(setTimeout(function(){
      ball.classList.add('bok');
      sfx('ballclick');
      var st=document.createElement('div');st.className='catchstars';
      st.innerHTML='<span>★</span><span>★</span><span>★</span>';
      if(scene)scene.appendChild(st);
      typeMsg('Gotcha! '+DEX[wPre.sp].n+' was caught!');
    },endT));
    T.push(setTimeout(function(){
      throwBusy=false;
      announceCatch(wPre.sp,wPre.shiny,wPre.lv);
      if(safariOver){
        queueModal(function(){
          showModal('<h3>GAME OVER</h3><p>That was your last SAFARI BALL — what a way to spend it! The warden waves you out.</p>'+
            '<div class="mbtns"><button class="btn acc" data-action="modal-ok">OK</button></div>');
          modalOk=function(){closeModal();render(true);};
        });
      }
      checkGameEvents();
      updateBattlePanel();
      sprFx('.bt-espr','slidein-r');
    },endT+1600));
  }else{
    T.push(setTimeout(function(){
      ball.classList.add('bpop');
      sfx('ballburst');
      if(espr){espr.classList.remove('intoball');void espr.offsetWidth;espr.classList.add('outball');}
      typeMsg(CATCH_FAIL_LINES[Math.min(3,res.shakes)]);
    },endT));
    T.push(setTimeout(function(){
      throwBusy=false;
      updateBattlePanel();
      if(fled||safariOver){
        sprFx('.bt-espr','slidein-r');
        cry(state.session&&state.session.wild?state.session.wild.sp:null);
        typeMsg(state.session?state.session.bmsg:'');
        if(safariOver){
          queueModal(function(){
            showModal('<h3>GAME OVER</h3><p>Out of SAFARI BALLS! The warden pats your shoulder: “Come back with more pocket money!”</p>'+
              '<div class="mbtns"><button class="btn acc" data-action="modal-ok">OK</button></div>');
            modalOk=function(){closeModal();render(true);};
          });
        }
      }
    },endT+1500));
  }
}

function wxFor(t){
  var h=strHash(todayKey()+'-wx-'+t)%100;
  if(t===7)return h<40?'sun':(h<52?'fog':'clear');         // Cinnabar bakes
  if(t===2||t===3)return h<28?'rain':(h<38?'fog':'clear'); // the coasts drizzle
  if(t===5)return h<22?'sun':(h<34?'sand':'clear');        // safari dust
  if(t===6)return h<24?'fog':'clear';                      // a psychic haze
  if(t===8)return h<30?'fog':(h<44?'rain':'clear');        // the plateau broods
  return h<18?'rain':(h<28?'sun':(h<34?'fog':'clear'));
}

function hpFor(idx,round){return Math.round(BOSSES[idx].hp*Math.pow(2,(round||1)-1));}
/* Which team member is currently fighting, given remaining total HP.
   Members are fought front-to-back; each occupies a `frac` slice of the total. */
function bossMemberIdx(idx,hp,max){
  var team=bossTeam(idx),cum=0;
  for(var i=0;i<team.length;i++){
    cum+=team[i].frac;
    if(hp>max*(1-cum)+0.5)return i;
  }
  return team.length-1;
}
function bossInfo(){
  var g=state.game;if(!g||!g.boss)return null;
  var b=BOSSES[g.boss.idx];if(!b)return null;
  var round=g.round||1;
  var max=hpFor(g.boss.idx,round), hp=Math.max(0,g.boss.hp);
  var team=bossTeam(g.boss.idx);
  var mi=bossMemberIdx(g.boss.idx,hp,max);
  var cumBefore=0;for(var i=0;i<mi;i++)cumBefore+=team[i].frac;
  var memberMax=Math.round(max*team[mi].frac);
  var lower=max*(1-(cumBefore+team[mi].frac));
  var memberHp=Math.max(0,Math.min(memberMax,Math.round(hp-lower)));
  var m=team[mi];
  return {n:b.n,tr:b.tr,gym:b.gym,badge:b.badge,
    mon:m.mon,monId:m.monId,type:m.type,
    lv:Math.min(100,b.lv+(round-1)*30),
    hp:hp,max:max,idx:g.boss.idx,round:round,
    team:team,memberIdx:mi,teamSize:team.length,aliveLeft:team.length-mi,
    memberHp:memberHp,memberMax:memberMax};
}
/* ----- your battle squad ----- */
function battleParty(){
  if(!state.game)return [];
  // manual party (chosen order) wins; otherwise top-6 by level
  if(Array.isArray(state.game.partyIds)&&state.game.partyIds.length){
    var ms=state.game.partyIds.map(findMon).filter(Boolean).slice(0,6);
    if(ms.length)return ms;
  }
  return state.game.mons.slice().sort(function(a,b){
    return monLevel(b.xp)-monLevel(a.xp) || b.xp-a.xp;
  }).slice(0,6);
}
function maxHpOf(m){return statsFor(m).hp;}
function curHpOf(m){
  if(state.session&&state.session.phps&&state.session.phps[m.uid]!==undefined)return state.session.phps[m.uid];
  // battle scars persist between workouts — heal at the POKEMON CENTER on the map
  if(state.game&&state.game.hurt&&state.game.hurt[m.uid]!==undefined)return Math.min(state.game.hurt[m.uid],maxHpOf(m));
  return maxHpOf(m);
}
function leadMon(){
  if(state.session&&state.session.lead){var m=findMon(state.session.lead);if(m)return m;}
  return activeMon();
}
function partyMons(){
  if(!state.session||!state.session.party)return battleParty();
  return state.session.party.map(findMon).filter(Boolean);
}
function alivePartyMons(){return partyMons().filter(function(m){return curHpOf(m)>0;});}
function initBossSession(){
  if(!state.game||!state.session)return;
  var party=battleParty();
  var ids=party.map(function(m){return m.uid;});
  // the XP mon chosen at start always joins the squad, even outside the top six
  if(state.game.active&&ids.indexOf(state.game.active)<0){
    var extra=findMon(state.game.active);
    if(extra){party.push(extra);ids.push(extra.uid);}
  }
  state.session.party=ids;
  state.session.phps={};
  var hurt=(state.game.hurt||{});
  party.forEach(function(m){
    var hv=hurt[m.uid];
    state.session.phps[m.uid]=(hv!==undefined)?Math.max(0,Math.min(hv,maxHpOf(m))):maxHpOf(m);
  });
  var lead=(state.game.active&&ids.indexOf(state.game.active)>=0)?state.game.active:(ids[0]||null);
  if(lead&&state.session.phps[lead]<=0){
    var alive=null;
    ids.forEach(function(u){if(!alive&&state.session.phps[u]>0)alive=u;});
    if(alive)lead=alive;
    else state.session.blackout=true;
  }
  state.session.lead=lead;if(lead)state.game.active=lead;
  save();
}
/* boss type hitting your mon (defensive matchup) */
function typeEffAgainst(atkType,defTypes){
  var e=1;(defTypes||[]).forEach(function(t){
    if(EFF2[atkType]&&EFF2[atkType][t]!==undefined)e*=EFF2[atkType][t];
  });
  return e;
}
function bossCounterDamage(bz,mon){
  var st=statsFor(mon);
  var eff=typeEffAgainst(bz.type,DEX[mon.sp].t);
  var def=(st.def+st.spd)/2;
  var raw=(bz.lv*1.7+6)*eff;
  return {dmg:Math.max(1,Math.round(raw*45/(45+def))),eff:eff};
}
function applyBossCounter(bz,lead){
  if(!state.session.phps)state.session.phps={};
  var c=bossCounterDamage(bz,lead);
  var mx=maxHpOf(lead);
  var from=Math.round(Math.max(0,curHpOf(lead))/Math.max(1,mx)*100);
  state.session.phps[lead.uid]=Math.max(0,curHpOf(lead)-c.dmg);
  var to=Math.round(state.session.phps[lead.uid]/Math.max(1,mx)*100);
  var ctxt=c.eff>=2?' A heavy blow!':(c.eff>1?' It hit hard!':(c.eff<1?' '+DEX[lead.sp].n+' shrugged it off.':''));
  var res={dmg:c.dmg,php:[from,to],msg:bz.mon+' struck back — '+c.dmg+' dmg!'+ctxt,fainted:false,faintMsg:null,goMsg:null};
  state.session.bmsg+=' '+res.msg;
  if(state.session.phps[lead.uid]<=0){
    res.fainted=true;
    var f=handleLeadFaint(lead);
    res.faintMsg=f.msg;res.goMsg=f.goMsg;
  }
  return res;
}
/* wilds bite back too — lighter than bosses, route trainers hit harder */
function applyWildCounter(wd,lead){
  if(!state.session.phps)state.session.phps={};
  var st=statsFor(lead);
  var atype=(DEX[wd.sp].t&&DEX[wd.sp].t[0])||null;
  var eff=atype?typeEffAgainst(atype,DEX[lead.sp].t):1;
  var raw=(wd.lv*(wd.tr?1.6:1.15)+3)*eff;
  var def=(st.def+st.spd)/2;
  var dmg=Math.max(1,Math.round(raw*45/(45+def)));
  var mx=maxHpOf(lead);
  var from=Math.round(Math.max(0,curHpOf(lead))/Math.max(1,mx)*100);
  state.session.phps[lead.uid]=Math.max(0,curHpOf(lead)-dmg);
  var to=Math.round(state.session.phps[lead.uid]/Math.max(1,mx)*100);
  var res={dmg:dmg,php:[from,to],msg:(wd.tr?DEX[wd.sp].n:'Wild '+DEX[wd.sp].n)+' fought back — '+dmg+' dmg!',fainted:false,faintMsg:null,goMsg:null};
  state.session.bmsg+=' '+res.msg;
  if(state.session.phps[lead.uid]<=0){
    res.fainted=true;
    var f=handleLeadFaint(lead);
    res.faintMsg=f.msg;res.goMsg=f.goMsg;
  }
  return res;
}
function handleLeadFaint(lead){
  state.session.bmsg+=' '+DEX[lead.sp].n+' is unable to battle!';
  // next teammate in PARTY ORDER tanks (set yours via TEAM → EDIT PARTY)
  var order=partyMons(),nxt=null;
  for(var i=0;i<order.length;i++){
    if(order[i].uid!==lead.uid&&curHpOf(order[i])>0){nxt=order[i];break;}
  }
  var out={msg:DEX[lead.sp].n+' is unable to battle!',goMsg:null};
  if(nxt){
    state.session.lead=nxt.uid;state.game.active=nxt.uid;
    state.session.bmsg+=' Go, '+DEX[nxt.sp].n+'!';
    out.goMsg='Go, '+DEX[nxt.sp].n+'!';
  }else triggerBlackout();
  return out;
}

/* LEFTOVERS nibble: the holder tops up after every exchange it survives */
function leftoversStep(am){

  var lmx=maxHpOf(am),lc=Math.max(0,curHpOf(am));

/* One logged set in boss mode = one full battle exchange, played out in stages. */
function resolveBossSet(am,entry,vol,id){
  if(!state.session.party)initBossSession();
  var bz=bossInfo(),exr=exById(id);
  if(!bz||!exr)return;
  if(state.session.blackout){
    state.session.bmsg=DEX[am.sp].n+' keeps training! +'+(entry.xpg||0)+' XP. (Blacked out — no boss damage this workout.)';
    pendingSteps={ov:null,list:[{msg:state.session.bmsg}]};
    return;
  }
  // your chosen move decides the type now — pick it via the MOVE button
  var mvName=curMoveFor(am,bz),mvType=moveTypeOf(mvName);
  var eff=effOfType(mvType,bz.type);
  var stA=statsFor(am);
  var boosted=!!state.session.xatkArmed;
  if(boosted){state.session.xatkArmed=false;state.session.xatkUsed=true;}
  // speed = crit chance, the gen-1 way (capped at 25%); SCOPE LENS stacks on top
  var crit=Math.random()<Math.min(0.25,stA.spe/400)+heldCritBonus(am);
  var dmg=Math.round(vol*eff*(1+Math.max(stA.atk,stA.spa)/250)*(boosted?1.5:1)*(crit?1.5:1)*heldBoostFor(am,mvType));
  var ehpFrom=Math.round(bz.memberHp/Math.max(1,bz.memberMax)*100);
  var hpBefore=state.game.boss.hp;
  state.game.boss.hp-=dmg;
  entry.dmg=dmg;entry.bidx=bz.idx;

/* the panel renders on the GYM tab AND in the exercise sheet — always talk to the topmost one */
function bw(){var els=document.querySelectorAll('.btwrap');return els.length?els[els.length-1]:null;}
function bq(sel){var w=bw();return w?w.querySelector(sel):null;}
/* back sprites are waist-up rips with transparent padding below — measure it once
   per sprite and sink the image so the cut sits EXACTLY on the text bar */
var backPadCache={};
/* pad = transparent rows below the sprite; measured off a standalone probe image so
   it never depends on the DOM element's load/layout state (that was why the GYM-tab
   panel stayed misaligned while the sheet worked) */
function placeBack(src){
  var img=bq('.bt-pspr');
  if(!img||img.getAttribute('src')!==src)return;
  var pad=backPadCache[src];if(pad===undefined)return;
  var nh=64,scale=(img.clientHeight||img.offsetHeight||76)/nh;
  img.style.bottom=(-2-Math.round(pad*scale))+'px';
}
function alignBack(){
  var img=bq('.bt-pspr');if(!img)return;
  var src=img.getAttribute('src');if(!src)return;
  if(backPadCache[src]!==undefined){placeBack(src);return;}
  var probe=new Image();
  probe.onload=function(){
    try{
      var c=document.createElement('canvas');
      c.width=probe.naturalWidth||64;c.height=probe.naturalHeight||64;
      var x=c.getContext('2d');x.drawImage(probe,0,0);
      var d=x.getImageData(0,0,c.width,c.height).data,pad=0;
      outer:for(var y=c.height-1;y>=0;y--){
        for(var xx=0;xx<c.width;xx++){if(d[(y*c.width+xx)*4+3]>8)break outer;}
        pad++;
      }
      backPadCache[src]=pad;
      placeBack(src); // re-query the CURRENT sprite, not the one at call time
    }catch(e){backPadCache[src]=0;}
  };
  probe.src=src;
}
