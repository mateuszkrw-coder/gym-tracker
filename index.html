function typeMsg(txt){
  var el=bq('.bt-msg');if(!el)return;
  if(typeTimer)clearInterval(typeTimer);
  el.classList.remove('msgdone');
  el.textContent='';
  var i=0;
  typeTimer=setInterval(function(){
    i+=2;
    el.textContent=txt.slice(0,i);
    if(i>=txt.length){clearInterval(typeTimer);typeTimer=null;el.classList.add('msgdone');}
  },16);
}
function setBarNow(sel,pct,isHp){
  var el=bq(sel);if(!el)return;
  el.style.transition='none';
  el.style.width=pct+'%';
  if(isHp)el.style.background=hpColor(pct);
  void el.offsetWidth;
  el.style.transition='';
}
function driftBar(sel,to,isHp){
  var el=bq(sel);if(!el)return;
  el.style.width=to+'%';
  if(isHp){
    el.style.background=hpColor(to);
    if(sel==='.bt-php')el.classList.toggle('hpcrit',to<=20&&to>0);
  }
}
function dmgFloat(side,val){
  var sc=bq(side==='player'?'.bt-pscene':'.bt-scene');
  if(!sc)return;
  var f=document.createElement('span');
  f.className='dmgfloat';
  if(side==='player'){f.style.color='#3878C8';f.style.left='24%';f.style.top='34%';}
  else{f.style.right='9%';f.style.top='7%';}
  f.textContent='-'+Number(val).toLocaleString();
  sc.appendChild(f);
  setTimeout(function(){if(f.parentNode)f.parentNode.removeChild(f);},950);
}
function sprFx(sel,cls){
  var el=bq(sel);if(!el)return;
  el.classList.remove('lunge-l','lunge-r','blink','faintdrop');
  void el.offsetWidth;
  el.classList.add(cls);
}
function syncPrevBars(){
  btPrevPct=curBattlePct();
  var bz=(state.session&&state.session.mode==='boss')?bossInfo():null;
  btPrevMember=bz?bz.memberIdx:null;
  var lead=leadMon();
  btPrevPhp=(bz&&lead)?Math.round(Math.max(0,curHpOf(lead))/Math.max(1,maxHpOf(lead))*100):null;
}
function runBattleStep(st){
  if(st.refresh){
    var w=bw();
    if(w){
      w.innerHTML=battlePanelHTML(false);
      if(st.slide==='enemy'){
        sprFx('.bt-espr','slidein-r');
        var shw=state.session&&state.session.wild;
        if(shw&&shw.shiny&&!shw.tr)animTimers.push(setTimeout(shinyBurst,460));
      }
      if(st.slide==='player')sprFx('.bt-pspr','slidein-l');
      syncPrevBars();
      alignBack();
    }
  }
  if(st.sfx)sfx(st.sfx);
  if(st.movesfx)moveSfx(st.movesfx);
  if(st.cry)cry(st.cry);
  if(st.cryId)cryById(st.cryId);
  if(st.msg)typeMsg(st.msg);
  if(st.lunge==='player')sprFx('.bt-pspr','lunge-l');
  if(st.lunge==='enemy')sprFx('.bt-espr','lunge-r');
  if(st.blink==='enemy')animTimers.push(setTimeout(function(){sprFx('.bt-espr','blink');},240));
  if(st.blink==='player')animTimers.push(setTimeout(function(){sprFx('.bt-pspr','blink');},240));
  if(st.faint==='enemy')sprFx('.bt-espr','faintdrop');
  if(st.faint==='player')sprFx('.bt-pspr','faintdrop');
  if(st.trainer){
    var tEl=bq('.bt-espr');
    if(tEl){
      tEl.classList.remove('faintdrop');
      tEl.src='sprites/trainers/'+st.trainer+'.png';
      sprFx('.bt-espr','slidein-r');
    }
  }
  if(st.fx)animTimers.push(setTimeout(function(){moveFx(st.fx);},180));
  if(st.quake){
    var qw=bw();
    if(qw){qw.classList.remove('shake');void qw.offsetWidth;qw.classList.add('shake');}
  }
  if(st.ehp)animTimers.push(setTimeout(function(){driftBar('.bt-ehp',st.ehp[1],true);},300));
  if(st.php)animTimers.push(setTimeout(function(){driftBar('.bt-php',st.php[1],true);},300));
  if(st.dmg)animTimers.push(setTimeout(function(){dmgFloat(st.dmg[0],st.dmg[1]);},260));
}
function stepHold(st){
  var base=st.hold||950;
  if(st.msg)base=Math.max(base,st.msg.length*8+520);
  return base;
}
function playBattleSteps(steps){
  var t=0;
  steps.forEach(function(st){
    animTimers.push(setTimeout(function(){runBattleStep(st);},t));
    t+=stepHold(st);
  });
  // xp fill runs alongside the first step, wrapping through 100 on level-up
  if(pendingExp){
    (function(xa){
      animTimers.push(setTimeout(function(){
        if(xa.wrap){
          driftBar('.bt-pexp',100,false);
          animTimers.push(setTimeout(function(){setBarNow('.bt-pexp',0,false);driftBar('.bt-pexp',xa.to,false);},460));
        }else driftBar('.bt-pexp',xa.to,false);
      },420));
    })(pendingExp);
    pendingExp=null;
  }
}
function updateBattlePanel(){
  var w=bw();if(!w)return;
  clearBattleAnim();
  if(pendingSteps){
    var plan=pendingSteps;pendingSteps=null;
    w.innerHTML=battlePanelHTML(false,plan.ov);
    // prime bars at the FIRST step's pre-attack values so drains play out
    var pE=false,pP=false;
    plan.list.forEach(function(st){
      if(st.ehp&&st.ehp.length>1&&!pE){setBarNow('.bt-ehp',st.ehp[0],true);pE=true;}
      if(st.php&&st.php.length>1&&!pP){setBarNow('.bt-php',st.php[0],true);pP=true;}
    });
    if(plan.exp){setBarNow('.bt-pexp',plan.exp.from,false);pendingExp=plan.exp;}
    var m0=bq('.bt-msg');if(m0){m0.textContent='';m0.classList.remove('msgdone');}
    alignBack();
    playBattleSteps(plan.list);
    return;
  }
  w.innerHTML=battlePanelHTML(false);
  alignBack();
  // plain refresh (switch, potion, panel rebuild): gentle bar catch-up
  var bar=bq('.bt-ehp'),newPct=curBattlePct();
  var isBoss=state.session&&state.session.mode==='boss';
  var bz=isBoss?bossInfo():null;
  var curMember=bz?bz.memberIdx:-1;
  if(bar&&newPct!==null&&btPrevPct!==null&&btPrevPct!==newPct&&!(isBoss&&btPrevMember!==null&&curMember!==btPrevMember)){
    setBarNow('.bt-ehp',btPrevPct,true);
    requestAnimationFrame(function(){requestAnimationFrame(function(){driftBar('.bt-ehp',newPct,true);});});
  }
  if(state.session&&state.session.party){
    var lead=leadMon(),pbar=bq('.bt-php');
    if(pbar&&lead){
      var npp=Math.round(Math.max(0,curHpOf(lead))/Math.max(1,maxHpOf(lead))*100);
      if(btPrevPhp!==null&&btPrevPhp!==npp){
        setBarNow('.bt-php',btPrevPhp,true);
        requestAnimationFrame(function(){requestAnimationFrame(function(){driftBar('.bt-php',npp,true);});});
      }
    }
  }
  syncPrevBars();
}

function bossLadderHTML(){
  var g=state.game;

  var beatenN=Math.min(curIdx,BOSSES.length);

  BOSSES.forEach(function(b,i){
    var beaten=i<curIdx,current=i===curIdx;
    var nm=b.n.replace('CHAMPION ','');

      (beaten||current?'':';filter:brightness(0);opacity:.4')+'">';

function roadBarHTML(){
  if(!roadActive())return '';

  if(!bz)return '';
  var loc=roadLoc(r.idx),ac=loc.c||'#2E8B48';
  var nodes=[],doneCount=0;
  qs.forEach(function(q,qi){
    var d=questClaimed(qi),rdy=!d&&questReady(q);
    if(d)doneCount++;
    nodes.push({img:'sprites/npc/'+q.npc+'.png',w:18,d:d,rdy:rdy});
  });
  for(var j=0;j<roadMbCount(r.idx);j++){
    var dm=!!r.mb[j];if(dm)doneCount++;
    nodes.push({img:'sprites/trainers/'+mbFor(r.idx,j).cls+'.png',w:26,d:dm,rdy:false});

  var h='<div class="panel" style="border-color:'+ac+'"><h3>THE TRACK<span class="bestchip" style="border-color:'+ac+'">'+doneCount+' / '+total+'</span></h3>'+
    '<div style="position:relative;height:66px;margin-top:6px">'+
    '<div class="gbar" style="position:absolute;left:16px;right:44px;top:24px;min-width:0"><div style="width:'+pct+'%;background:'+ac+'"></div></div>';

    h+='<div style="position:absolute;left:'+left+'%;top:6px;width:38px;text-align:center">'+
      '<div style="width:36px;height:36px;margin:0 auto;border-radius:50%;border:3px solid '+ring+';background:var(--boxw);display:flex;align-items:center;justify-content:center;overflow:hidden">'+

function bossDefeated(){
  var g=state.game;var bz=bossInfo();if(!bz)return;
  var bonus=Math.round(bz.max/30);
  g.mons.forEach(function(m){m.xp+=bonus;});
  // the leader pays out, like the games
  var purse=Math.round(bz.lv*60*(bz.round||1));
  addMoney(purse);
  // winning revitalises your squad for the next challenger
  if(state.session&&state.session.party){
    state.session.party.forEach(function(uid){var mm=findMon(uid);if(mm)state.session.phps[uid]=maxHpOf(mm);});
    state.session.blackout=false;
  }
  var stayTown=townIdx(); // where you're standing right now, BEFORE the badge advances
  // etch the conquered road into the village's local history (the QUEST page shows it there)
  if(g.road&&g.boss&&g.road.idx===g.boss.idx&&g.boss.idx<ROAD_LOC.length){
    g.roadLog=g.roadLog||{};
    g.roadLog[g.road.idx]={round:g.road.round||1,startTs:g.road.startTs,clearTs:Date.now(),kills:g.road.kills||0};
  }
  var isChamp=bz.idx>=BOSSES.length-1;
  if(isChamp){
    // etch this team into the Hall of Fame
    if(!Array.isArray(g.hof))g.hof=[];
    var snap=(state.session&&state.session.party?partyMons():battleParty()).map(function(m){
      return {sp:m.sp,lv:monLevel(m.xp),shiny:!!m.shiny};
    });
    g.hof.push({ts:Date.now(),round:bz.round,team:snap});
  }
  if(isChamp){
    g.flags.champion=1;
    g.round=(g.round||1)+1;
    g.boss={idx:0,hp:hpFor(0,g.round)};
  }
  else g.boss={idx:bz.idx+1,hp:hpFor(bz.idx+1,g.round||1)};
  // NO auto-warp: stay in the town you just won in; the new gym town opens on the MAP
  g.visit=Math.min(stayTown,townIdx());
  // the rest of the workout goes back to normal training — the next boss waits at the GYM
  if(state.session){
    state.session.mode='train';
    state.session.wild=spawnWild();
    state.session.moveSel={};
    state.session.bmsg='A wild '+DEX[state.session.wild.sp].n+' appeared!';
  }
  save();
  var wildAfter=(state.session&&state.session.wild)?DEX[state.session.wild.sp].n:null;
  // let the final KO animation land before the victory screen
  setTimeout(function(){
  queueModal(function(){
    sfx('victory');
    showModal('<div class="vbanner">VICTORY!</div>'+
      '<div style="text-align:center;padding:6px 0 2px"><img src="sprites/trainers/'+bz.tr+'.png" alt="'+bz.n+'" style="width:72px;height:72px;image-rendering:pixelated"></div>'+
      '<p style="text-align:center;margin:2px 0 8px">'+esc(playerName())+' defeated '+esc(bz.n)+(bz.gym?' of '+esc(bz.gym):'')+'!</p>'+
      '<div class="vrow"><img src="'+itemIcon('pokeball')+'" alt="">Prize money<b style="margin-left:auto">₽'+purse.toLocaleString()+'</b></div>'+
      '<div class="vrow"><img src="'+itemIcon('luckyegg')+'" alt="">Whole team EXP<b style="margin-left:auto">+'+bonus.toLocaleString()+'</b></div>'+
      '<div style="display:flex;align-items:center;gap:6px;margin:4px 0 2px"><span class="barlab" style="color:#88A8E8">EXP</span><div class="gbar exp"><div class="vexp"></div></div></div>'+
      (wildAfter?'<p style="text-align:center;margin:10px 0 0;color:var(--mut)">Your workout continues as <b style="color:#2E8B48">NORMAL TRAINING</b><br>— a wild '+wildAfter+' appeared!</p>':'')+
      '<div class="mbtns"><button class="btn acc" data-action="modal-ok">OK</button></div>',true);
    modalOk=function(){closeModal();};
  });
  queueModal(function(){
    sfx('badge');
    showModal('<h3>'+(bz.badge?esc(bz.badge)+' GET! 🏅':'VICTORY!')+'</h3>'+
      '<p>Your whole team earned +'+bonus+' XP! '+esc(bz.n)+' paid out <b>₽'+Math.round(bz.lv*60*(bz.round||1)).toLocaleString()+'</b>.'+
      (bz.idx<8&&bz.badge?' <b>'+TOWNS[Math.min(bz.idx+1,8)].n+'</b> just opened on your MAP — hop the ferry there (first trip free!) to challenge '+esc(BOSSES[bz.idx+1].n)+'.':(isChamp?'':' Next challenger: '+esc(BOSSES[bz.idx+1].n)+'.'))+'</p>'+
      '<div class="mbtns"><button class="btn acc" data-action="modal-ok">OK</button></div>',true);
    modalOk=function(){closeModal();render(true);};
  });
  if(isChamp){
    queueModal(function(){
      sfx('badge');
      showModal('<h3>HALL OF FAME! 🏆</h3><p>'+esc(playerName())+' and team enter the HALL OF FAME! But the league never rests… ROUND '+g.round+' begins: every boss returns, twice as strong.</p>'+
        '<div class="mbtns"><button class="btn acc" data-action="modal-ok">OK</button></div>',true);
      modalOk=function(){closeModal();render(true);};
    });
    grantMon('mewtwo','mewtwo','A legend stirs…','You are the CHAMPION! MEWTWO acknowledges your strength and joins you!');
  }
  },5600); // the KO + concede cameo + back-to-training step play out first
}

  if(def.town!==curTown()&&!(def.towns&&def.towns.indexOf(curTown())>=0)){

      '<div class="panel"><div class="memo">This place is in '+TOWNS[def.town].n+' — hop the ferry there first!</div></div>'+poiBackBtn();

  if(def.gate&&!def.gate()){
    return '<div class="titlebar"><h1>?????</h1><button class="textbtn" data-action="tab" data-tab="map">← BACK</button></div>'+
      '<div class="panel"><div class="memo">The ghosts here are unidentifiable! Something in the ROCKET HIDEOUT might reveal them…</div></div>'+poiBackBtn();
  }
  var out=null;
  if(k==='tower')out=towerHTML();
  else if(k==='dept')out=deptHTML();
  else if(k==='corner')out=cornerHTML();
  else if(k==='hideout')out=hideoutHTML();

  else if(k==='lab')out=labPoiHTML();
  if(out===null)return mapHTML();

  return out.replace('</h1></div>','</h1><button class="textbtn" data-action="tab" data-tab="map">← BACK</button></div>');

/* ----- fight builders: every building fight is a wild/roadblock injection ----- */
var TOWER_POOLS=[['rattata','pidgey','caterpie'],['nidoranm','ekans','sandshrew'],['machop','mankey','cubone'],
  ['graveler','onix','marowak'],['haunter','venomoth','golbat'],['magneton','electrode','raichu'],
  ['rapidash','arcanine','ninetales'],['dragonair','gyarados','machamp']];
var TOWER_CLASSES=['youngster','lass','bugcatcher','picnicker','fisherman','hiker','lass','blue'];
var HIDEOUT_QUESTS=[
  {t:'groups',target:2,ask:'The door lock reads your training chip… work 2 different muscle groups today to fry it.'},
  {t:'sets',target:15,ask:'A weight-sensing floor plate blocks the stairs. Log 15 sets today to trip it.'},
  {t:'vol',target:6000,ask:'The lift needs a counterweight: move 6,000 kg today.'},
  null
];
var SILPH_SPS=['zubat','grimer','koffing','ekans','golbat','muk','arbok','weezing','machoke','hypno'];
var SILPH_LOOT={1:'potion',3:'greatball',5:'hyperpotion',7:'ultraball',9:'fullrestore'};
var GHOST_FLOORS=[['gastly',18,1],['gastly',20,1],['haunter',22,1.1],['haunter',24,1.2],['cubone',26,1.3],['marowak',30,2]];
function poiWildFor(kind,f){
  var bc=badgeCount();
  if(kind==='tower'){
    var h=strHash(wkKey()+'-'+f);
    var lv=Math.min(75,8+bc*4+f*3);
    var sp=TOWER_POOLS[f][h%TOWER_POOLS[f].length];
    var cls=TOWER_CLASSES[f];
    return {sp:sp,lv:lv,hp:Math.round((600+lv*60)*1.6),max:Math.round((600+lv*60)*1.6),shiny:false,parts:{},
      tr:{cls:cls,clsN:f===7?'TOWER ACE':'TOWER TRAINER',name:TRAINER_NAMES[h%TRAINER_NAMES.length],
        purse:lv*45,arena:'gym',tower:f}};
  }
  if(kind==='hideout'){
    if(f<3){
      var hlv=10+bc*3+f*2,hhp=Math.round((600+hlv*60)*1.35);
      return {sp:['zubat','ekans','koffing'][f],lv:hlv,hp:hhp,max:hhp,shiny:false,parts:{},
        tr:{cls:'hiker',clsN:'ROCKET GRUNT',name:['ODIN','ROCCO','VANCE'][f],purse:hlv*35,arena:'poison',hideout:f}};
    }
    var glv=18+bc*3,ghp=Math.round((600+glv*60)*2.2);
    return {sp:'rhyhorn',lv:glv,hp:ghp,max:ghp,shiny:false,parts:{},
      tr:{cls:'giovanni',clsN:'ROCKET BOSS',name:'GIOVANNI',purse:glv*90,arena:'poison',hideout:3}};
  }
  if(kind==='silph'){
    if(f<10){
      var slv=16+bc*3+f*2,shp=Math.round((600+slv*60)*1.5);
      return {sp:SILPH_SPS[f],lv:slv,hp:shp,max:shp,shiny:false,parts:{},
        tr:{cls:(f%2?'youngster':'hiker'),clsN:'ROCKET GRUNT',name:TRAINER_NAMES[(f*3)%TRAINER_NAMES.length],
          purse:slv*50,arena:'psychic',silph:f}};
    }
    var blv=24+bc*3,bhp=Math.round((600+blv*60)*2.4);
    return {sp:'nidoking',lv:blv,hp:bhp,max:bhp,shiny:false,parts:{},
      tr:{cls:'giovanni',clsN:'ROCKET BOSS',name:'GIOVANNI',purse:blv*110,arena:'psychic',silph:10}};
  }
  if(kind==='ghost'){
    var gd=GHOST_FLOORS[f];if(!gd)return null;
    var ghp2=Math.round((500+gd[1]*45)*gd[2]);
    if(state.game)state.game.seen[gd[0]]=1;
    return {sp:gd[0],lv:gd[1],hp:ghp2,max:ghp2,shiny:false,parts:{},ghost:f};
  }
  if(kind==='snorlax'){
    var nhp=Math.round((500+30*45)*2);
    if(state.game)state.game.seen.snorlax=1;
    return {sp:'snorlax',lv:30,hp:nhp,max:nhp,shiny:Math.random()<shinyOdds(),parts:{},snor:1};
  }
  if(kind==='front'){
    var fs=poiOf('front').streak||0;
    var flv=Math.min(100,40+fs*2);
    var pool=['machamp','alakazam','gengar','dragonite','snorlax','lapras','arcanine','gyarados','exeggutor','starmie','rhydon','magneton'];
    var fh=strHash(todayKey()+'-front-'+fs);
    var tycoon=(fs%7===6); // every 7th fight, the TYCOON himself steps in
    var fhp=Math.round((600+flv*60)*(tycoon?2.1:1.7));
    return {sp:tycoon?'dragonite':pool[fh%pool.length],lv:flv+(tycoon?3:0),hp:fhp,max:fhp,shiny:false,parts:{},
      tr:{cls:tycoon?'lance':(fh%2?'picnicker':'youngster'),clsN:tycoon?'TOWER TYCOON':'FRONTIER ACE',
        name:tycoon?'DRAGO':TRAINER_NAMES[fh%TRAINER_NAMES.length],purse:flv*20,arena:'pond',front:fs}};
  }
  return null;
}

function partyHolds(k){

function expShareHolder(excludeUid){

function poiWildMsg(w){
  if(w.ghost!==undefined)return 'POKEMON TOWER '+(w.ghost+1)+'F — a restless '+DEX[w.sp].n+' bars the way! Log a set to attack!';
  if(w.snor)return 'SNORLAX woke up angry! Weaken it with sets, then THROW BALL!';

function poiStartFight(kind,f){
  if(!state.game)return;
  if(state.session&&state.session.mode==='boss'){toast('Finish the gym battle first!');return;}
  if(state.session&&state.session.blackout){toast('Your team is out — heal up first!');return;}
  // validate the request against the building's live state
  if(kind==='tower'){var pt=poiOf('tower');poiTowerWeek(pt);if(f!==(pt.floor||0)||f>=8)return;}
  if(kind==='hideout'){var ph=poiOf('hideout');if(f!==(ph.floor||0)||f>=4)return;
    var hq=HIDEOUT_QUESTS[f];
    if(hq&&dailyProg(hq)<hq.target){toast('The way is sealed — finish the floor task first!');return;}}
  if(kind==='silph'){var ps=poiOf('silph');if(f!==(ps.floor||0)||f>=11)return;}
  if(kind==='ghost'){var pg=poiOf('tower2');if(!poiOf('hideout').scope)return;if(f!==(pg.floor||0)||f>=6)return;}
  if(kind==='snorlax'){var pf=poiOf('tower2');if(!pf.flute)return;
    if(state.game.dex.snorlax&&state.game.dex.snorlax.c){toast('SNORLAX is already on your team!');return;}}
  if(kind==='front'){var pfr=poiOf('front');if(f!==(pfr.streak||0))return;}
  var w=poiWildFor(kind,f);
  if(!w)return;
  if(state.session){
    state.session.wild=w;
    state.session.bmsg=w.tr?(w.tr.clsN+' '+w.tr.name+' sent out '+DEX[w.sp].n+'! Log a set to attack!'):poiWildMsg(w);
    save();sfx('battlestart');
    tab='workout';render();
    if(w.tr)playVsFx(w.tr.cls,w.tr.clsN+' '+w.tr.name);
    else if(w.shiny)setTimeout(shinyBurst,700);
    setTimeout(function(){cry(w.sp);},400);
  }else{
    pendingPoi={kind:kind,f:f};
    pendingMb=null;
    showChooserThenStart('train');
  }
}
/* the victory bookkeeping for building trainers — returns the banner text */
function poiTrainerWin(tr){
  if(tr.tower!==undefined){
    var pt=poiOf('tower');poiTowerWeek(pt);
    if((pt.floor||0)===tr.tower){
      pt.floor=(pt.floor||0)+1;
      if(pt.floor>=8){
        pt.clears=(pt.clears||0)+1;
        bagOf().rarecandy=(bagOf().rarecandy||0)+1;
        addMoney(2000);
        return ' TOWER CONQUERED! Prize: ₽2,000 + RARE CANDY!';
      }
      return ' TOWER '+(tr.tower+1)+'F CLEARED!';
    }
    return '';
  }
  if(tr.hideout!==undefined){
    var ph=poiOf('hideout');
    if((ph.floor||0)===tr.hideout){
      ph.floor=(ph.floor||0)+1;
      if(ph.floor>=4){
        ph.scope=1;
        return ' HIDEOUT CLEARED — you found the SILPH SCOPE!';
      }
      return ' B'+(tr.hideout+1)+' CLEARED!';
    }
    return '';
  }
  if(tr.front!==undefined){
    var pf2=poiOf('front');
    if((pf2.streak||0)===tr.front){
      pf2.streak=(pf2.streak||0)+1;
      if(pf2.streak>(pf2.best||0))pf2.best=pf2.streak;
      var bpw=1+(pf2.streak%7===0?3:0);
      addBp(bpw);
      return ' STREAK '+pf2.streak+'! +'+bpw+' BP!';
    }
    return '';
  }
  if(tr.silph!==undefined){
    var ps=poiOf('silph');
    if((ps.floor||0)===tr.silph){
      ps.floor=(ps.floor||0)+1;
      var extra='';
      var loot=SILPH_LOOT[tr.silph];
      if(loot){bagOf()[loot]=(bagOf()[loot]||0)+1;extra+=' Found a '+ITEMS[loot].n+'!';}
      if(tr.silph===4){ps.card=1;extra+=' Got the CARD KEY!';}
      if(tr.silph===6&&!ps.lapras){
        ps.lapras=1;
        var lshiny=Math.random()<0.05;
        var lm=addMon('lapras',lshiny);lm.xp=xpFloor(25);
        queueModal(function(){
          sfx('catch');cry('lapras');
          showModal('<h3>A gift!</h3><p>A grateful SILPH researcher hands you LAPRAS :L25!'+(lshiny?' ✨ It’s SHINY!':'')+'</p>'+
            '<div style="text-align:center;padding:8px 0"><img class="bigspr'+(lshiny?' shinyglow':'')+'" src="'+sprPath('lapras',lshiny)+'" alt=""></div>'+
            '<div class="mbtns"><button class="btn acc" data-action="modal-ok">OK</button></div>');
          modalOk=function(){closeModal();render(true);};
        });
        extra+=' A researcher gifted you LAPRAS!';
      }
      if(ps.floor>=11){
        ps.master=1;
        bagOf().masterball=(bagOf().masterball||0)+1;
        return ' SILPH CO. FREED! '+(extra||'')+' The president hands you the MASTER BALL!';
      }
      return ' SILPH '+(tr.silph+1)+'F LIBERATED!'+extra;
    }
    return '';
  }
  return '';
}

function runSlots(){
  if(slotBusy||!state.game)return;
  var p=cornerOf();
  var free=cornerFreeLeft(p);
  if(free>0)p.spins=(p.spins||0)+1;
  else if((p.coins||0)>=10)p.coins-=10;
  else {toast('No coins! Trade ₽ for coins first.');return;}
  // the house decides first, the reels perform after
  var r=Math.random(),win=0,icons;
  if(r<0.05){win=300;var j=SLOT_ICONS[Math.floor(Math.random()*2)+3];icons=[j,j,j];}
  else if(r<0.16){win=120;icons=['pokeball','pokeball','pokeball'];}
  else if(r<0.38){win=30;var pi=SLOT_ICONS[Math.floor(Math.random()*SLOT_ICONS.length)];
    var other=SLOT_ICONS[(SLOT_ICONS.indexOf(pi)+2)%SLOT_ICONS.length];
    icons=[pi,pi,other];}
  else {icons=SLOT_ICONS.slice().sort(function(){return Math.random()-0.5;}).slice(0,3);
    if(icons[0]===icons[1]&&icons[1]===icons[2])icons[2]=SLOT_ICONS[(SLOT_ICONS.indexOf(icons[2])+1)%SLOT_ICONS.length];}
  p.coins=(p.coins||0)+win;
  save();
  slotBusy=true;
  sfx('throw');
  var msg=$('#slotmsg');
  ['A','B','C'].forEach(function(rk){
    var box=document.querySelector('#reel'+rk);
    if(box)box.classList.add('spinning');
  });
  if(msg)msg.textContent='· · ·';
  ['A','B','C'].forEach(function(rk,i){
    setTimeout(function(){
      var box=document.querySelector('#reel'+rk);
      if(box){
        box.classList.remove('spinning');
        box.querySelector('.reelstrip').innerHTML=itemImg(icons[i],34);
      }
      sfx('ballshake');
    },700+i*500);
  });
  setTimeout(function(){
    slotBusy=false;
    if(win>=300)sfx('badge');
    else if(win>0)sfx('save');
    else sfx('weakhit');
    if(msg)msg.textContent=win>0?'WIN! +'+win+' COINS':'No luck…';
    setTimeout(function(){render(true);},900);
  },2050);
}

/* ===== game: sound ===== */
function ac(){
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended')audioCtx.resume();
  }catch(e){return null;}
  return audioCtx;
}
function tone(t0,freq,dur,type,vol,endFreq){
  var c=audioCtx;if(!c)return;
  var o=c.createOscillator(),g=c.createGain();
  o.type=type||'square';
  o.frequency.setValueAtTime(freq,t0);
  if(endFreq)o.frequency.exponentialRampToValueAtTime(Math.max(20,endFreq),t0+dur);
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(vol||0.05,t0+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g);g.connect(c.destination);
  o.start(t0);o.stop(t0+dur+0.03);
}
/* species-id → cry key resolver (boss-only mons included) */
var SP_BY_ID=null;
var EXTRA_CRIES={87:'dewgong',114:'tangela',124:'jynx'};
function spById(id){
  if(!SP_BY_ID){
    SP_BY_ID={};
    Object.keys(DEX).forEach(function(k){if(SP_BY_ID[DEX[k].id]===undefined)SP_BY_ID[DEX[k].id]=k;});
  }
  return SP_BY_ID[id]||EXTRA_CRIES[id];
}
/* official Showdown cries (bundled) + authentic FRLG move SFX (khinsider, trimmed) */
var CRIES_ON=true;
var sndBufs={};
function playBuf(buf,gain,maxSec){
  var c=ac();if(!c)return;
  try{
    var src=c.createBufferSource(),g=c.createGain();
    g.gain.value=gain||0.25;
    src.buffer=buf;src.connect(g);g.connect(c.destination);
    src.start();
    if(maxSec)src.stop(c.currentTime+maxSec);
  }catch(e){}
}
/* generic lazy loader: fetch → decode → cache buffer (or 'x' on miss), then play */
function playSnd(url,key,gain,maxSec){
  if(state.sound===false)return;
  var c=ac();if(!c)return;
  if(sndBufs[key]){if(sndBufs[key]!=='x')playBuf(sndBufs[key],gain,maxSec);return;}
  fetch(url)
    .then(function(r){if(!r.ok)throw 0;return r.arrayBuffer();})
    .then(function(b){return new Promise(function(res,rej){c.decodeAudioData(b,res,rej);});})
    .then(function(buf){sndBufs[key]=buf;playBuf(buf,gain,maxSec);})
    .catch(function(){sndBufs[key]='x';});
}
function cry(sp){
  if(!CRIES_ON||!sp)return;
  playSnd('sounds/cries/'+sp+'.mp3','cry_'+sp,0.22);
}

function histListHTML(id){
  // only the previous training for this exercise — the full log lives in HISTORY
  var logs=logsOf(id).slice().sort(function(a,b){return b.ts-a.ts;});
  if(state.session)logs=logs.filter(function(l){return l.ts<state.session.start;});
  if(!logs.length)return '<div class="chart-empty" style="padding-bottom:30px">No history yet — your sets will show up here.</div>';
  var lastKey=dateKey(logs[0].ts);
  var h='<div class="histday">LAST TRAINING · '+fmtDayKey(lastKey)+'</div>';
  logs.forEach(function(l){
    if(dateKey(l.ts)!==lastKey)return;
    h+='<div class="hrow"><div class="meta"><div class="hname">'+fmtW(l.w)+' '+state.unit+
      ' <span class="hsub" style="font-size:13px">× '+l.r+(l.s>1?' × '+l.s+' sets':'')+'</span></div></div>'+
      '<div class="hsub">'+fmtTime(l.ts)+'</div>'+
      '<button class="delbtn" data-action="del-log" data-log="'+l.id+'" aria-label="Delete entry">✕</button></div>';
  });
  return h;
}

/* ===== chart ===== */
function chartHTML(id){
  var pts=dayTops(id).slice(-12);
  if(pts.length<2)return '<div class="chart-empty">Log on two different days and your progress curve appears here 📈</div>';
  var W=336,H=150,L=34,R=12,T=20,B=22;
  var ws=pts.map(function(p){return p.w;});
  var omin=Math.min.apply(null,ws), omax=Math.max.apply(null,ws);
  var lo,hi;
  if(omin===omax){lo=omin-2;hi=omax+2;}else{var pad=(omax-omin)*0.18;lo=omin-pad;hi=omax+pad;}
  function X(i){return L+(W-L-R)*i/(pts.length-1);}
  function Y(w){return T+(H-T-B)*(1-(w-lo)/(hi-lo));}
  var line='', area='M '+X(0).toFixed(1)+' '+(H-B)+' ';
  pts.forEach(function(p,i){
    var x=X(i).toFixed(1), y=Y(p.w).toFixed(1);
    line+=(i?' ':'')+x+','+y;
    area+='L '+x+' '+y+' ';
  });
  area+='L '+X(pts.length-1).toFixed(1)+' '+(H-B)+' Z';
  var dots=pts.map(function(p,i){
    var last=i===pts.length-1;
    return '<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(p.w).toFixed(1)+'" r="'+(last?4.5:3)+'" fill="'+(last?'#D03028':'var(--accent)')+'"/>';
  }).join('');
  var lastP=pts[pts.length-1];
  var grid='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(omax).toFixed(1)+'" y2="'+Y(omax).toFixed(1)+'" stroke="rgba(255,255,255,.08)" stroke-dasharray="3 4"/>';
  if(omax!==omin)grid+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(omin).toFixed(1)+'" y2="'+Y(omin).toFixed(1)+'" stroke="rgba(255,255,255,.08)" stroke-dasharray="3 4"/>';
  var labels='<text x="2" y="'+(Y(omax)+4).toFixed(1)+'" class="cl">'+fmtW(omax)+'</text>';
  if(omax!==omin)labels+='<text x="2" y="'+(Y(omin)+4).toFixed(1)+'" class="cl">'+fmtW(omin)+'</text>';
  labels+='<text x="'+X(pts.length-1).toFixed(1)+'" y="'+(Y(lastP.w)-10).toFixed(1)+'" text-anchor="end" class="cl big">'+fmtW(lastP.w)+'</text>';
  var p0=pts[0].k.split('-'), p1=lastP.k.split('-');
  labels+='<text x="'+L+'" y="'+(H-4)+'" class="cl">'+MONTHS[+p0[1]-1]+' '+(+p0[2])+'</text>'+
    '<text x="'+(W-R)+'" y="'+(H-4)+'" text-anchor="end" class="cl">'+MONTHS[+p1[1]-1]+' '+(+p1[2])+'</text>';
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block" aria-hidden="true">'+
    '<defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1">'+
    '<stop offset="0" stop-color="var(--accent)" stop-opacity=".30"/>'+
    '<stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>'+
    grid+'<path d="'+area+'" fill="url(#cg)"/>'+
    '<polyline points="'+line+'" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>'+
    dots+labels+'</svg>';
}

      var gain=Math.round(vol/10*(state.session?(state.session.mode==='boss'?1:1.5):1)*(state.session&&state.session.lucky?2:1)*(heldOf(am)==='machobrace'?1.25:1));

        var stT=statsFor(am);

        var wMv=wKm[Math.floor(Math.random()*wKm.length)];
        var wCrit=Math.random()<Math.min(0.25,stT.spe/400)+heldCritBonus(am);
        var dmgT=Math.round(vol*(1+Math.max(stT.atk,stT.spa)/250)*(wCrit?1.5:1)*heldBoostFor(am,moveTypeOf(wMv)));
        var wPre={sp:wd.sp,lv:wd.lv,hp:Math.max(0,wd.hp),max:wd.max,shiny:wd.shiny,tr:wd.tr};
        var wFrom=Math.round(wPre.hp/wd.max*100);
        wd.parts=wd.parts||{};wd.parts[am.uid]=1; // everyone who lands a hit shares the EXP

            wSteps.push({msg:wd.tr.clsN+' '+wd.tr.name+' was defeated!'+mbWin+' Won ₽'+wd.tr.purse+'!',sfx:'badge',hold:1500});
            wSteps.push({msg:'Back to normal training! A wild '+newN+' appeared!',sfx:'battlestart',cry:state.session.wild.sp,refresh:true,slide:'enemy'});
            trainerVictoryModal(wd.tr,wPre.sp,wbonus,isRival,newN);
          }else{

            if(state.game.road)state.game.road.kills=(state.game.road.kills||0)+1;
            dailyBumpKill();
            var ghostWin='';

      // a new record feeds the lead a Rare Candy: jump to the next level (+PR bonus ₽)
      if(entry.w>prevBest&&prevBest>0){

function delLogEntry(logId){
  var id=sheetEx; if(!id)return;
  var arr=state.logs[id]||[];
  var i=arr.findIndex(function(l){return l.id===logId;});
  if(i<0)return;
  var gone=arr.splice(i,1)[0];
  if(!arr.length)delete state.logs[id];
  if(gone.xpg&&gone.mon&&state.game){
    var dm=findMon(gone.mon);
    if(dm)dm.xp=Math.max(0,dm.xp-gone.xpg);
    if(state.session&&state.session.xpg)state.session.xpg=Math.max(0,state.session.xpg-gone.xpg);
  }
  if(gone.dmg!==undefined&&state.game&&state.game.boss&&state.game.boss.idx===gone.bidx){
    state.game.boss.hp=Math.min(hpFor(gone.bidx,state.game.round||1),state.game.boss.hp+gone.dmg);
  }
  save();
  refreshSheetData(id);
  toast('Entry deleted',{action:'Undo',fn:function(){
    (state.logs[id]=state.logs[id]||[]).push(gone);
    state.logs[id].sort(function(a,b){return a.ts-b.ts;});
    if(gone.xpg&&gone.mon&&state.game){
      var um=findMon(gone.mon);
      if(um)um.xp+=gone.xpg;
      if(state.session)state.session.xpg=(state.session.xpg||0)+gone.xpg;
    }
    if(gone.dmg!==undefined&&state.game&&state.game.boss&&state.game.boss.idx===gone.bidx){
      state.game.boss.hp=Math.max(1,state.game.boss.hp-gone.dmg);
    }
    save();
    refreshSheetData(id);
  }});
}

/* ===== rest timer ===== */
var timerInt=null, timerEnd=0, timerBtnEl=null, timerLbl='', audioCtx=null;
function stopTimer(){
  if(timerInt){clearInterval(timerInt);timerInt=null;}
  if(timerBtnEl){timerBtnEl.classList.remove('on');timerBtnEl.textContent=timerLbl;timerBtnEl=null;}
}
function startTimer(sec,btn){
  if(timerBtnEl===btn){stopTimer();return;}
  stopTimer();
  timerBtnEl=btn; timerLbl=btn.textContent;
  timerEnd=Date.now()+sec*1000;
  btn.classList.add('on');
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended')audioCtx.resume();
  }catch(e){}
  function tick(){
    var left=Math.ceil((timerEnd-Date.now())/1000);
    if(left<=0){
      stopTimer();
      toast('Rest over — next set 💪');
      beep();
      if(navigator.vibrate)navigator.vibrate(200);
      return;
    }
    if(timerBtnEl)timerBtnEl.textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');
  }
  tick();
  timerInt=setInterval(tick,250);
}
function beep(){
  try{
    if(!audioCtx)return;
    var t0=audioCtx.currentTime;
    [0,0.22].forEach(function(off){
      var o=audioCtx.createOscillator(), g=audioCtx.createGain();
      o.frequency.value=880;o.connect(g);g.connect(audioCtx.destination);
      g.gain.setValueAtTime(0.001,t0+off);
      g.gain.exponentialRampToValueAtTime(0.25,t0+off+0.02);
      g.gain.exponentialRampToValueAtTime(0.001,t0+off+0.18);
      o.start(t0+off);o.stop(t0+off+0.2);
    });
  }catch(e){}
}

/* ===== toast ===== */
var toastTimer=null;
function toast(msg,opts){
  opts=opts||{};
  var t=$('#toast');
  t.innerHTML=esc(msg)+(opts.action?' <button id="toastact">'+esc(opts.action)+'</button>':'');
  if(opts.action)$('#toastact').onclick=function(){opts.fn();t.classList.remove('show');};
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){t.classList.remove('show');},opts.action?4500:1800);
}

}
function promptModal(title,initial,cb,okText){

    '<input id="m-in" type="text" value="'+esc(initial)+'" placeholder="Name" maxlength="40">'+

function importModal(){

    '<input type="file" id="m-file" accept=".json,application/json" style="margin-bottom:10px;font-size:13px;color:var(--muted);width:100%">'+

/* ===== data management ===== */
function applyImport(txt){
  var d=JSON.parse(txt);
  if(!d||!Array.isArray(d.groups))throw new Error('bad');
  var logs=(d.logs&&typeof d.logs==='object')?d.logs:{};
  var ng=d.groups.map(function(g){return {
    id:g.id||uid(),
    name:String(g.name||'Group').slice(0,40),
    exercises:Array.isArray(g.exercises)?g.exercises.map(function(e){return {
      id:e.id||uid(),
      name:String(e.name||'Exercise').slice(0,40),
      note:typeof e.note==='string'?e.note.slice(0,500):''
    };}):[]
  };});
  var nl={};
  ng.forEach(function(g){g.exercises.forEach(function(e){
    var arr=Array.isArray(logs[e.id])?logs[e.id]:[];
    var c=arr.filter(function(l){return l&&isFinite(l.w)&&isFinite(l.ts);})
      .map(function(l){return {id:l.id||uid(),ts:+l.ts,w:+l.w,r:Math.max(1,parseInt(l.r,10)||1),s:Math.max(1,parseInt(l.s,10)||1)};})
      .sort(function(a,b){return a.ts-b.ts;});
    if(c.length)nl[e.id]=c;
  });});
  var ns=Array.isArray(d.sessions)?d.sessions
    .filter(function(s){return s&&isFinite(s.start)&&isFinite(s.end)&&+s.end>+s.start;})
    .map(function(s){return {id:s.id||uid(),start:+s.start,end:+s.end,
      sets:Math.max(0,parseInt(s.sets,10)||0),volume:Math.max(0,Math.round(+s.volume)||0),
      exercises:Math.max(0,parseInt(s.exercises,10)||0)};})
    .sort(function(a,b){return a.start-b.start;}):[];
  var gm=null;
  if(d.game&&Array.isArray(d.game.mons)){
    gm={startTs:+d.game.startTs||Date.now(),
      starter:d.game.starter==='squirtle'?'squirtle':'charmander',
      mons:d.game.mons.filter(function(m){return m&&DEX[m.sp];}).map(function(m){
        var nm={uid:m.uid||uid(),sp:m.sp,xp:Math.max(0,Math.round(+m.xp)||0),shiny:!!m.shiny,ts:+m.ts||Date.now()};
        if(m.vits&&typeof m.vits==='object'){
          var vt={};
          ['hp','atk','def','spa','spd','spe'].forEach(function(k){
            var n=parseInt(m.vits[k],10);
            if(n>0)vt[k]=Math.min(5,n);
          });
          if(Object.keys(vt).length)nm.vits=vt;
        }
        if(m.held&&ITEMS[m.held]&&ITEMS[m.held].hold)nm.held=m.held;
        return nm;
      }),
      active:typeof d.game.active==='string'?d.game.active:null,
      enc:(d.game.enc&&typeof d.game.enc==='object')?d.game.enc:{},
      flags:(d.game.flags&&typeof d.game.flags==='object')?d.game.flags:{},
      seen:(d.game.seen&&typeof d.game.seen==='object')?d.game.seen:{},
      dex:(d.game.dex&&typeof d.game.dex==='object')?d.game.dex:{}};
    gm.round=Math.max(1,parseInt(d.game.round,10)||1);
    gm.boss=null;
    var bi=(d.game.boss&&isFinite(d.game.boss.idx)&&BOSSES[+d.game.boss.idx])?+d.game.boss.idx:0;
    var bmax=hpFor(bi,gm.round);
    var bh=(d.game.boss&&isFinite(d.game.boss.hp))?Math.min(bmax,Math.max(1,Math.round(+d.game.boss.hp))):bmax;
    if(!gm.flags.champion||d.game.boss){
      gm.boss={idx:bi,hp:bh};
    }else{
      gm.round=Math.max(2,gm.round);
      gm.boss={idx:0,hp:hpFor(0,gm.round)};
    }
    gm.player=(d.game.player&&typeof d.game.player.name==='string')?
      {name:String(d.game.player.name).slice(0,10),spr:d.game.player.spr==='leaf'?'leaf':'red'}:null;
    gm.egg=(d.game.egg&&isFinite(d.game.egg.left)&&+d.game.egg.left>0)?{left:Math.round(+d.game.egg.left)}:null;
    gm.money=Math.max(0,Math.round(+d.game.money)||0);
    gm.bag={};
    if(d.game.bag&&typeof d.game.bag==='object'){
      Object.keys(d.game.bag).forEach(function(bk){
        var key=bk==='xattack'?'fullrestore':bk;
        if(!ITEMS[key])return;
        var bc=parseInt(d.game.bag[bk],10);
        if(bc>0)gm.bag[key]=Math.min(99,(gm.bag[key]||0)+bc);
      });
    }
    gm.hof=Array.isArray(d.game.hof)?d.game.hof.filter(function(e){return e&&isFinite(e.ts)&&Array.isArray(e.team);})
      .map(function(e){return {ts:+e.ts,round:Math.max(1,parseInt(e.round,10)||1),
        team:e.team.filter(function(t){return t&&DEX[t.sp];})
          .map(function(t){return {sp:t.sp,lv:Math.max(1,Math.min(100,parseInt(t.lv,10)||1)),shiny:!!t.shiny};})};}):[];
    gm.partyIds=Array.isArray(d.game.partyIds)?d.game.partyIds.filter(function(x){return typeof x==='string';}).slice(0,6):null;
    if(gm.partyIds&&!gm.partyIds.length)gm.partyIds=null;
    gm.medals={};
    if(d.game.medals&&typeof d.game.medals==='object'){
      MEDAL_ORDER.forEach(function(t){if(d.game.medals[t])gm.medals[t]=1;});
      SPECIAL_MEDALS.forEach(function(s2){if(d.game.medals[s2.k])gm.medals[s2.k]=1;});
    }
    gm.hurt={};
    if(d.game.hurt&&typeof d.game.hurt==='object'){
      gm.mons.forEach(function(m){
        var hv=parseInt(d.game.hurt[m.uid],10);
        if(hv>=0&&isFinite(hv))gm.hurt[m.uid]=hv;
      });
    }
    gm.raid=(d.game.raid&&RAID_SPECIES[d.game.raid.k]&&isFinite(d.game.raid.startTs))?
      {k:d.game.raid.k,startTs:+d.game.raid.startTs}:null;
    gm.rest={};
    if(d.game.rest&&typeof d.game.rest==='object'){
      gm.mons.forEach(function(m){
        var rv=+d.game.rest[m.uid];
        if(isFinite(rv)&&rv>0)gm.rest[m.uid]=rv;
      });
    }
    gm.roadLog={};
    if(d.game.roadLog&&typeof d.game.roadLog==='object'){
      Object.keys(d.game.roadLog).forEach(function(rk){
        var ri=parseInt(rk,10),rv=d.game.roadLog[rk];
        if(!(ri>=0&&ri<ROAD_LOC.length)||!rv)return;
        gm.roadLog[ri]=rv.synth?{synth:1,round:Math.max(1,parseInt(rv.round,10)||1)}
          :{round:Math.max(1,parseInt(rv.round,10)||1),startTs:+rv.startTs||Date.now(),
            clearTs:+rv.clearTs||Date.now(),kills:Math.max(0,parseInt(rv.kills,10)||0)};
      });
    }
    gm.poi={};
    if(d.game.poi&&typeof d.game.poi==='object'){
      var pin=function(v,mx){var n2=parseInt(v,10);return (n2>=0&&isFinite(n2))?Math.min(mx||999999,n2):0;};
      var psrc=d.game.poi;
      if(psrc.tower)gm.poi.tower={floor:pin(psrc.tower.floor,8),clears:pin(psrc.tower.clears),weekKey:typeof psrc.tower.weekKey==='string'?psrc.tower.weekKey:''};
      if(psrc.corner)gm.poi.corner={coins:pin(psrc.corner.coins),date:typeof psrc.corner.date==='string'?psrc.corner.date:'',spins:pin(psrc.corner.spins,20)};
      if(psrc.hideout)gm.poi.hideout={floor:pin(psrc.hideout.floor,4),scope:psrc.hideout.scope?1:0};
      if(psrc.silph)gm.poi.silph={floor:pin(psrc.silph.floor,11),card:psrc.silph.card?1:0,master:psrc.silph.master?1:0,lapras:psrc.silph.lapras?1:0};
      if(psrc.tower2)gm.poi.tower2={floor:pin(psrc.tower2.floor,7),flute:psrc.tower2.flute?1:0,cubone:psrc.tower2.cubone?1:0};
      if(psrc.safari)gm.poi.safari={active:psrc.safari.active?1:0,balls:pin(psrc.safari.balls,15)};
      if(psrc.lab)gm.poi.lab={expWeek:typeof psrc.lab.expWeek==='string'?psrc.lab.expWeek:''};
      if(psrc.athlon){
        gm.poi.athlon={date:typeof psrc.athlon.date==='string'?psrc.athlon.date:'',cups:{}};
        if(psrc.athlon.cups)['g','s','b'].forEach(function(ck){gm.poi.athlon.cups[ck]=pin(psrc.athlon.cups[ck],9999);});
      }
      if(psrc.front)gm.poi.front={streak:pin(psrc.front.streak,999),best:pin(psrc.front.best,999)};
    }
    gm.bp=Math.max(0,Math.round(+d.game.bp)||0);
    gm.bestStreak=Math.max(0,parseInt(d.game.bestStreak,10)||0);
    gm.visit=(isFinite(d.game.visit)&&+d.game.visit>=0&&+d.game.visit<TOWNS.length)?+d.game.visit:null;
    gm.beenTo={};
    if(d.game.beenTo&&typeof d.game.beenTo==='object'){
      Object.keys(d.game.beenTo).forEach(function(bk2){
        var bi2=parseInt(bk2,10);
        if(bi2>=0&&bi2<TOWNS.length&&d.game.beenTo[bk2])gm.beenTo[bi2]=1;
      });
    }
    gm.road=null;
    if(d.game.road&&isFinite(d.game.road.idx)){
      gm.road={idx:Math.max(0,parseInt(d.game.road.idx,10)||0),
        round:Math.max(1,parseInt(d.game.road.round,10)||1),
        startTs:+d.game.road.startTs||Date.now(),
        kills:Math.max(0,parseInt(d.game.road.kills,10)||0),mb:{},qdone:{}};
      if(d.game.road.mb&&typeof d.game.road.mb==='object')Object.keys(d.game.road.mb).forEach(function(mk){if(d.game.road.mb[mk])gm.road.mb[mk]=1;});
      if(d.game.road.qdone&&typeof d.game.road.qdone==='object')Object.keys(d.game.road.qdone).forEach(function(qk){if(d.game.road.qdone[qk])gm.road.qdone[qk]=1;});
      if(d.game.road.qann&&typeof d.game.road.qann==='object'){gm.road.qann={};Object.keys(d.game.road.qann).forEach(function(ak){if(d.game.road.qann[ak])gm.road.qann[ak]=1;});}
      if(d.game.road.clearmsg)gm.road.clearmsg=1;
    }
    gm.daily=null;
    if(d.game.daily&&typeof d.game.daily==='object'&&typeof d.game.daily.date==='string'){
      gm.daily={date:d.game.daily.date,claimed:{},kills:Math.max(0,parseInt(d.game.daily.kills,10)||0),
        streak:Math.max(0,parseInt(d.game.daily.streak,10)||0),
        lastDone:typeof d.game.daily.lastDone==='string'?d.game.daily.lastDone:null};
      if(d.game.daily.claimed&&typeof d.game.daily.claimed==='object')Object.keys(d.game.daily.claimed).forEach(function(ck){if(d.game.daily.claimed[ck])gm.daily.claimed[ck]=1;});
    }
    gm.npcq=null;
    if(d.game.npcq&&isFinite(d.game.npcq.startTs)){
      gm.npcq={startTs:+d.game.npcq.startTs,claimed:{}};
      if(d.game.npcq.claimed&&typeof d.game.npcq.claimed==='object'){
        NPCQ.forEach(function(q){if(d.game.npcq.claimed[q.k])gm.npcq.claimed[q.k]=1;});
      }
    }
    gm.visit=(d.game.visit!=null&&isFinite(d.game.visit))?Math.max(0,Math.min(8,parseInt(d.game.visit,10))):null;
    gm.beenTo={};
    if(d.game.beenTo&&typeof d.game.beenTo==='object'){
      for(var bt=0;bt<=8;bt++)if(d.game.beenTo[bt])gm.beenTo[bt]=1;
    }else{for(var bt2=0;bt2<=townIdx();bt2++)gm.beenTo[bt2]=1;}
  }
  state={version:+d.version||1,unit:d.unit==='lb'?'lb':'kg',groups:ng,logs:nl,sessions:ns,session:null,theme:d.theme==='day'?'day':'night',game:gm,gamePlayed:(d.gamePlayed||gm)?1:0,sound:d.sound!==false};
  save();
  editMode=false;tab='workout';render();
}
function exportData(){
  var json=JSON.stringify(state,null,2);
  var name='gym-backup-'+dateKey(Date.now())+'.json';
  try{
    var file=new File([json],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})&&navigator.share){
      navigator.share({files:[file],title:'Gym Tracker backup'}).catch(function(){});
      return;
    }
  }catch(e){}
  var a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([json],{type:'application/json'}));
  a.download=name;
  document.body.appendChild(a);a.click();a.remove();
  toast('Backup downloaded');
}
function copyData(){
  var json=JSON.stringify(state);
  function fallback(){
    var ta=document.createElement('textarea');
    ta.value=json;document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');toast('Copied — paste it somewhere safe');}
    catch(e){toast('⚠️ Copy failed — use Export instead');}
    ta.remove();
  }
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(json).then(function(){toast('Copied — paste it somewhere safe');},fallback);
  }else fallback();
}

/* ===== event delegation ===== */

document.addEventListener('input',function(e){

document.addEventListener('click',function(e){
  var b=e.target.closest('[data-action]');
  if(!b)return;
  var a=b.dataset.action;
  if(!titlePlayed){titlePlayed=true;sfx('title');}
  else sfx('click');

  if(a==='tab'){tab=b.dataset.tab;editMode=false;render();}
  else if(a==='toggle-edit'){editMode=!editMode;render(true);}
  else if(a==='open'){openSheet(b.dataset.ex);}
  else if(a==='close-sheet'){closeSheet();}
  else if(a==='step'){stepInput(b.dataset.t,+b.dataset.d);}
  else if(a==='log'){saveLogEntry();}
  else if(a==='del-log'){delLogEntry(b.dataset.log);}
  else if(a==='del-session'){
    var sid=b.dataset.s;
    var ses=(state.sessions||[]).filter(function(x){return x.id===sid;})[0];
    if(!ses)return;
    var n=0;
    Object.keys(state.logs).forEach(function(k){
      n+=state.logs[k].filter(function(l){return l.ts>=ses.start&&l.ts<=ses.end;}).length;
    });
    confirmModal('Delete this workout?',
      fmtDayKey(dateKey(ses.end))+' · '+fmtDur(ses.end-ses.start)+' · '+ses.sets+' sets. '+
      (n?('Its '+n+' logged entr'+(n===1?'y':'ies')+' will be deleted too.'):'No logged entries belong to it.'),
      'Delete',function(){
      Object.keys(state.logs).forEach(function(k){
        state.logs[k].forEach(function(l){
          if(l.ts>=ses.start&&l.ts<=ses.end&&l.xpg&&l.mon&&state.game){
            var dm=findMon(l.mon);
            if(dm)dm.xp=Math.max(0,dm.xp-l.xpg);
          }
          if(l.ts>=ses.start&&l.ts<=ses.end&&l.dmg&&state.game&&state.game.boss&&state.game.boss.idx===l.bidx){
            state.game.boss.hp=Math.min(hpFor(l.bidx,state.game.round||1),state.game.boss.hp+l.dmg);
          }
        });
        state.logs[k]=state.logs[k].filter(function(l){return l.ts<ses.start||l.ts>ses.end;});
        if(!state.logs[k].length)delete state.logs[k];
      });
      state.sessions=state.sessions.filter(function(x){return x.id!==sid;});
      save();render(true);toast('Workout deleted');
    });
  }
  else if(a==='timer'){startTimer(+b.dataset.sec,b);}
  else if(a==='dismiss-banner'){localStorage.setItem('gym.bannerOff','1');render(true);}
  else if(a==='close-modal'){closeModal();}
  else if(a==='modal-ok'){if(modalOk)modalOk();}
  else if(a==='unit'){state.unit=b.dataset.u==='lb'?'lb':'kg';save();render(true);}
  else if(a==='theme'){state.theme=b.dataset.th==='day'?'day':'night';save();applyTheme();render(true);}
  else if(a==='start-workout'){if(state.game)showChooserThenStart('train');else startWorkout('train');}
  else if(a==='end-workout'){endWorkout();}
  else if(a==='team-view'){teamView=(b.dataset.v==='dex'||b.dataset.v==='box')?b.dataset.v:'party';render(true);}
  else if(a==='box-type'){boxType=b.dataset.t||'';render(true);}
  else if(a==='box-sort'){boxSort=b.dataset.s||'lv';render(true);}
  else if(a==='open-mon'){openMon(b.dataset.m);}
  else if(a==='close-mon'){closeMon();}
  else if(a==='make-lead'){
    if(state.game&&findMon(b.dataset.m)){
      state.game.active=b.dataset.m;save();closeMon();toast('New lead ✓');
    }
  }
  else if(a==='choose-mon'){
    if(state.game&&findMon(b.dataset.m)){
      state.game.active=b.dataset.m;save();closeModal();startWorkout(pendingMode);
    }
  }
  else if(a==='pre-lead'){
    if(state.game&&findMon(b.dataset.m)){state.game.active=b.dataset.m;save();showBossPartyModal();}
  }
  else if(a==='party-go'){closeModal();startWorkout('boss');}
  else if(a==='switch-mon'){if(state.session&&!state.session.blackout)showSwitchModal();}
  else if(a==='do-switch'){
    var swm=findMon(b.dataset.m);
    if(swm&&state.session&&curHpOf(swm)>0){
      state.session.lead=swm.uid;state.game.active=swm.uid;
      state.session.bmsg=playerName()+' sent out '+DEX[swm.sp].n+'!';
      save();closeModal();updateBattlePanel();render(true);
    }
  }
  else if(a==='stadium-go'){
    if(!roadClear()){closeModal();toast('The road is blocked — clear your QUESTS first!');return;}
    closeModal();showChooserThenStart('boss');
  }
  else if(a==='bld'){
    var bid=b.dataset.b;
    if(bid==='train'){if(state.session){tab='workout';render();}else{pendingMb=null;showChooserThenStart('train');}}
    else if(bid==='boss'){
      if(state.session){tab='workout';render();}
      else if(state.game){tab='gymhall';render();}
      else toast('Meet PROF. OAK first!');
    }
    else if(bid==='mart'){
      if(!state.game){toast('Meet PROF. OAK first!');}
      else if(!featOn('mart')){toast('The MART opens once you reach the next town!');}
      else{tab='mart';render();}
    }
    else if(bid==='center'){
      if(state.game){tab='center';render();}
      else toast('Meet PROF. OAK first!');
    }
  }
  else if(a==='use-xatk'){
    if(state.session&&state.session.mode==='boss'&&!state.session.xatkUsed&&!state.session.xatkArmed){
      state.session.xatkArmed=true;
      state.session.bmsg=playerName()+' used X ATTACK! The next set hits 50% harder!';
      save();sfx('pr');updateBattlePanel();
    }
  }
  else if(a==='battle-bag'){showBattleBag();}
  else if(a==='gym-talk'){showStadiumModal();}
  else if(a==='go-quests'){closeModal();tab='quests';render();}
  else if(a==='travel-go'){
    if(!state.game||travelBusy)return;
    if(state.session){toast('Finish your workout before you travel!');return;}
    var dest=parseInt(b.dataset.t,10);
    if(!(dest>=0&&dest<TOWNS.length&&(state.dev||dest<=townIdx()))){toast('You haven’t reached there yet!');return;}
    if(dest===curTown()){tab='map';render();return;}
    var fare=travelFare(dest),firstTime=!beenTo()[dest],origin=curTown();
    if(fare>0&&money()<fare){toast('Not enough ₽ for the ticket ('+fare+')');return;}
    if(fare>0)state.game.money-=fare;
    state.game.visit=dest;
    if(!state.dev)state.game.beenTo[dest]=1; // dev peeks don't burn the free first trip
    save();
    closeModal();
    playTravelFx(origin,dest,firstTime,function(){

        (retro>0?('Your past training counts: +'+retro+' XP — it’s already LV '+slv+'! '):'')+
        'Every set you log earns it XP. You pick who trains at each workout start.</p>'+
        '<div style="text-align:center;padding:8px 0"><img class="bigspr" src="'+sprPath(ssp,false)+'" alt=""></div>'+
        '<div class="mbtns"><button class="btn acc" data-action="modal-ok">LET’S GO</button></div>',true);
      modalOk=function(){closeModal();tab='team';render();checkGameEvents();};
    });
  }
  else if(a==='evo-choice'){
    var em=findMon(b.dataset.m);
    if(em&&DEX[b.dataset.to]){closeModal();doEvolve(em,b.dataset.to);}
  }
  else if(a==='pick-gender'){
    pendingGender=b.dataset.g==='leaf'?'leaf':'red';
    closeModal();
    promptModal('And your name is…?',state.game&&state.game.player?state.game.player.name:'',function(v){
      pendingName=v.toUpperCase().slice(0,10);
      afterNamePicked();
    },'OK');
  }
  else if(a==='rename-trainer'){
    if(!state.game)return;
    promptModal('Trainer name',playerName(),function(v){
      if(!state.game.player)state.game.player={name:'RED',spr:'red'};
      state.game.player.name=v.toUpperCase().slice(0,10);
      save();render(true);
    });
  }
  else if(a==='sound'){
    state.sound=b.dataset.s==='on';
    save();render(true);
    if(state.sound)sfx('save');
  }
  else if(a==='devmode'){
    state.dev=b.dataset.d==='on';
    if(!state.dev&&state.game&&state.game.visit!=null&&state.game.visit>townIdx())state.game.visit=townIdx();
    save();render(true);
    toast(state.dev?'DEV MODE ON — every town open on the TOWN MAP':'DEV MODE OFF');
  }
  else if(a==='goto-edit'){tab='workout';editMode=true;render();}
  else if(a==='export'){exportData();}
  else if(a==='copy'){copyData();}
  else if(a==='import'){importModal();}
  else if(a==='reset'){
    confirmModal('Reset everything?','This permanently deletes all logged workouts and restores the default exercise list.','Delete all',function(){
      state=seedState();save();editMode=false;render();toast('Fresh start 🌱');
    });
  }
  else if(a==='add-group'){
    promptModal('New muscle group','',function(v){
      state.groups.push({id:uid(),name:v,exercises:[]});save();render(true);
    },'Add');
  }
  else if(a==='rename-group'){
    var g1=groupById(b.dataset.g);if(!g1)return;
    promptModal('Rename group',g1.name,function(v){g1.name=v;save();render(true);});
  }
  else if(a==='del-group'){
    var g2=groupById(b.dataset.g);if(!g2)return;
    confirmModal('Delete “'+g2.name+'”?',
      g2.exercises.length+' exercise(s) and '+logCount(g2)+' log entries will be deleted too.','Delete',function(){
      g2.exercises.forEach(function(ex){delete state.logs[ex.id];});
      state.groups=state.groups.filter(function(x){return x.id!==g2.id;});
      save();render(true);
    });
  }
  else if(a==='add-ex'){
    var g3=groupById(b.dataset.g);if(!g3)return;
    promptModal('New exercise in '+g3.name,'',function(v){
      g3.exercises.push({id:uid(),name:v,note:''});save();render(true);
    },'Add');
  }
  else if(a==='rename-ex'){
    var r1=exById(b.dataset.ex);if(!r1)return;
    promptModal('Rename exercise',r1.ex.name,function(v){r1.ex.name=v;save();render(true);});
  }
  else if(a==='del-ex'){
    var r2=exById(b.dataset.ex);if(!r2)return;
    var n=logsOf(r2.ex.id).length;
    confirmModal('Delete “'+r2.ex.name+'”?',
      n?('Its '+n+' log entries will be deleted too.'):'It has no logged entries.','Delete',function(){
      delete state.logs[r2.ex.id];
      r2.group.exercises=r2.group.exercises.filter(function(x){return x.id!==r2.ex.id;});
      save();render(true);
    });
  }
});

/* ===== init ===== */
// Surface unexpected errors instead of silently freezing a button press.
window.addEventListener('error',function(ev){
  try{toast('⚠️ '+String((ev&&ev.message)||'Something glitched').slice(0,90));}catch(e){}
});
var staleNote=migrateState();
applyTheme();
render();
ensureTicker();
if(staleNote)setTimeout(function(){toast(staleNote);},600);
if(!state.game)setTimeout(showGenderModal,450);
else{
  if(!state.game.player)setTimeout(showGenderModal,450);
  setTimeout(checkGameEvents,900);
}
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('./sw.js').catch(function(){});
  });
}
})();
</script>
</body>
</html>
